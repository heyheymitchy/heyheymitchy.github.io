<!-- lesson.html（完成版テンプレート） -->
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>受講ページ</title>
  <link rel="stylesheet" href="style.css">

  <style>
    .lesson-box {
      margin: 40px auto;
      padding: 30px;
      max-width: 700px;
      background: #fffbea;
      border: 3px solid #ffcc00;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .expired-box {
      margin: 40px auto;
      padding: 30px;
      max-width: 600px;
      background: #ffe5e5;
      border: 3px solid #ff4d4d;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
  </style>
</head>

<body>

<div id="content">
  <div class="lesson-box">
    <h2>受講ページ</h2>
    <p>以下の動画・PDFをご利用ください。</p>

    <div id="videoArea"></div>
    <div id="pdfArea"></div>
  </div>
</div>
<div id="nextCourseArea" class="lesson-box" style="margin-top:20px; background:#e8fff5; border-color:#00c080;">
  <h3>次のステップへ進む</h3>
  <p id="nextCourseName"></p>
  <a id="nextCourseLink" class="btn-primary" href="#">次の講座へすすむ</a>
</div>



<div id="pdfViewerArea"></div>
<p><button id="viewPdfBtn" class="btn-primary"> PDFを表示する</button></p>
<script>

<script>
// ============================================
// lesson.html（教材ページ）
// GAS API と連携して動画・PDFを安全に提供する
// ============================================

// ---------------------------------------------------------
// ① URLから memberId を取得（マイページから遷移）
// ---------------------------------------------------------
const params = new URLSearchParams(window.location.search);
const memberId = params.get("memberId");

// ---------------------------------------------------------
// ② GAS Web API の URL（doGet）
// ---------------------------------------------------------
// GAS修正時はデプロイ後にＵＲＬ修正すること７３行目20260824

const API_URL = "https://script.google.com/macros/s/AKfycbysMnrvvKoV92MRNwGoaBXrQeXy8nDmbsRnaaX5VFY2Y5C-pc1fQJLcgh2rnk21J_zu/exec";

// =========================================================
// PDFビューア（iframe表示）
// =========================================================
function viewPdf() {

  // GAS に PDF を要求（downloadPdf=1）
  fetch(`${API_URL}?downloadPdf=1&memberId=${memberId}`)
    .then(res => {

      // -----------------------------------------------------
      // ① JSON が返ってきた場合 → 期限切れ
      // -----------------------------------------------------
      if (res.headers.get("Content-Type").includes("application/json")) {
        return res.json().then(json => {
          if (json.error === "expired") {
            alert("視聴期限が終了しています");
          }
        });
      }

      // -----------------------------------------------------
      // ② PDF Blob を取得
      // -----------------------------------------------------
      return res.blob();
    })
    .then(blob => {
      if (!blob) return;

      // Blob URL を iframe に埋め込む（安全）
      const url = URL.createObjectURL(blob);

      document.getElementById("pdfViewerArea").innerHTML = `
        <iframe 
          src="${url}" 
          width="100%" 
          height="600px" 
          style="border: none; border-radius: 12px; background: #fff;">
        </iframe>
      `;
    });
}

// 次の講座案内
function loadNextCourse() {
  fetch(`${API_URL}?getNextCourse=1&memberId=${memberId}`)
    .then(res => res.json())
    .then(json => {
      if (!json || !json.nextCourseId) return;

      document.getElementById("nextCourseName").textContent =
        `次のおすすめ講座：${json.nextCourseName}`;

      document.getElementById("nextCourseLink").href =
        `https://yourdomain.com/course/${json.nextCourseId}.html`;
    });
}

// ページ読み込み時に実行
loadNextCourse();

// =========================================================
// ③ 教材（動画URL・PDFURL）取得
// =========================================================
function loadResources() {

  // GAS に教材情報を要求（getResources=1）
  fetch(`${API_URL}?getResources=1&memberId=${memberId}`)
    .then(res => res.json())
    .then(json => {

      // -----------------------------------------------------
      // 動画リンク（クリックで downloadVideo()）
      // -----------------------------------------------------
      document.getElementById("videoArea").innerHTML = `
        <p><a href="#" id="openVideo">?? 動画を見る</a></p>
      `;
      document.getElementById("openVideo").addEventListener("click", () => {
        downloadVideo();
      });

      // -----------------------------------------------------
      // PDFリンク（クリックで downloadPdf()）
      // -----------------------------------------------------
      document.getElementById("pdfArea").innerHTML = `
        <p><a href="#" id="downloadPdf">?? PDFをダウンロード</a></p>
      `;
      document.getElementById("downloadPdf").addEventListener("click", () => {
        downloadPdf();
      });
    });
}


// =========================================================
// ④ PDFダウンロード（GAS経由・安全版）
// =========================================================
function downloadPdf() {

  fetch(`${API_URL}?downloadPdf=1&memberId=${memberId}`)
    .then(res => {

      // 期限切れチェック
      if (res.headers.get("Content-Type").includes("application/json")) {
        return res.json().then(json => {
          if (json.error === "expired") {
            alert("視聴期限が終了しています");
          }
        });
      }

      return res.blob();
    })
    .then(blob => {
      if (!blob) return;

      const url = URL.createObjectURL(blob);
      window.open(url, "_blank"); // 新しいタブで開く
    });
}


// =========================================================
// ⑤ 動画ダウンロード（GAS経由・安全版）
// =========================================================
function downloadVideo() {

  fetch(`${API_URL}?downloadVideo=1&memberId=${memberId}`)
    .then(res => {

      // 期限切れチェック
      if (res.headers.get("Content-Type").includes("application/json")) {
        return res.json().then(json => {
          if (json.error === "expired") {
            alert("視聴期限が終了しています");
          }
        });
      }

      return res.blob();
    })
    .then(blob => {
      if (!blob) return;

      const url = URL.createObjectURL(blob);
      window.open(url, "_blank");
    });
}


// =========================================================
// ⑥ PDFビューアボタンのイベント登録
// =========================================================
document.getElementById("viewPdfBtn").addEventListener("click", viewPdf);

</script>

<!-- △　PDF iframe ビューアのメリット -->
<!-- ■PDFのURLをユーザーに渡さない -->
<!-- → URLコピーしても使えない／Drive共有リンクの漏洩を完全防止 -->
<!-- ■GAS が期限チェックしてから返す -->
<!-- → 期限切れなら絶対に閲覧不可 -->
<!-- ■Blob URL は一時的 -->
<!-- → ブラウザを閉じると消える／再利用不可 -->
<!-- ■iframe 内で閲覧のみ -->
<!-- → ダウンロードボタンが出ない／コピー防止に強い -->
<!-- ■Drive の共有権限（setDriveExpire）と二重防御 -->
<!-- → Drive側でも期限切れ／GAS側でも期限切れ -->
</body>
</html>
