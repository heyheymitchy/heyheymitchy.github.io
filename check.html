<!-- ++++++++++++++++++++++++++++++++++++++++++++++++++ -->
<!-- わくわくプログラミング工房　平兵道　のホームページ -->
<!-- ++++++++++++++++++++++++++++++++++++++++++++++++++ -->
<!-- Check.html -->
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Check List</title>
  <link rel="stylesheet" href="style.css">

  <style>
    /* ==================================================
       このページ専用CSS
       ================================================== */

    /* 表示するアイコン */
    .icon {
      width: 150px;
      display: block;
      margin: 20px auto;
    }

    /* タイトル */
    .title {
      font-size: 24px;
      text-align: center;
      margin-top: 10px;
      font-weight: bold;
    }

    /* 説明文 */
    .desc {
      font-size: 16px;
      margin: 20px;
      line-height: 1.6;
    }
  </style>
</head>

<body>
<!-- ここからは全html共用の記述にする -->
<!-- ================================================== -->
<!-- 共通ヘッダー -->
<!-- ================================================== -->
  <div id="header"></div>
<!-- ここまで -->   

<!-- ここからはこのページだけの内容 -->
<div id="content"></div>

<!-- ここまで -->

<!-- ここからは全html共用の記述にする -->
  <!-- ================================================== -->
  <!-- 共通フッター -->
  <!-- ================================================== -->
  <div id="footer"></div>
  
  <!-- ================================================== -->
  <!-- 共通JavaScript -->
  <!-- ================================================== -->
  <script src="script.js"></script>
<!-- ここまで -->

  <script>
    /* ==================================================
       CHECK_GASからデータを取得して表示する
       ================================================== */

    // ▼ URLパラメータ
    const params = new URLSearchParams(location.search);

    // ▼ ptを取得
    const pt = params.get("pt") || "101";

    // ▼ 言語
    // URLに lang=ja / lang=en があればそれを使用
    // なければ日本語
    const lang = params.get("lang") || "ja";

    // ▼ CHECK_GASのウェブアプリURL(デプロイしたらＵＲＬ上塗りすること)
    const CHECK_GAS_URL = "https://script.google.com/macros/s/AKfycbwm2_mO5lIk6h8Ue4eA0KFbB7Z_iEEUMnxx-sd3YnaQWKw0F4brjL5uXLcWyu6gzU1Xsg/exec";

    // ▼ 表示エリア
    const content = document.getElementById("content");

    // ▼ GASからデータ取得
    fetch(
      CHECK_GAS_URL +
      "?pt=" + encodeURIComponent(pt) +
      "&lang=" + encodeURIComponent(lang)
    )
      .then(response => {
        if (!response.ok) {
          throw new Error("HTTPエラー：" + response.status);
        }
        return response.json();
      })
      .then(item => {

        // ▼ データがない場合
        if (!item || item.error) {
          content.innerHTML =
            `<div class="title">データがありません（pt=${pt}）</div>`;
          return;
        }

        // ▼ HTML表示
        content.innerHTML = `
          <img src="${item.icon}" class="icon" alt="${item.title}">
          <div class="title">${escapeHtml(item.title)}</div>
          <div class="desc">${escapeHtml(item.desc)}</div>
        `;
      })
      .catch(error => {
        console.error(error);

        content.innerHTML = `
          <div class="title">データを取得できませんでした</div>
          <div class="desc">
            CHECK_GASのURL、GASの公開設定、スプレッドシート設定を確認してください。
          </div>
        `;
      });

    // ==================================================
    // HTML特殊文字対策
    // ==================================================
    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>

</body>
</html>
