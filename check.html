<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Course Detail</title>
<style>
.icon {
  width: 150px;
  display: block;
  margin: 20px auto;
}
.title {
  font-size: 24px;
  text-align: center;
  margin-top: 10px;
}
.desc {
  font-size: 16px;
  margin: 20px;
  line-height: 1.6;
}
</style>
</head>
<body>

<div id="content"></div>

<script src="data.js"></script>
<script>
const params = new URLSearchParams(location.search);
const pt = Number(params.get("pt"));
const lang = sessionStorage.getItem("lang") || "ja";
const validRange = lang === "ja"
  ? (pt >= 101 && pt <= 125)
  : (pt >= 901 && pt <= 925);

const content = document.getElementById("content");

if (!validRange) {
  content.innerHTML = `<div class="title">データがありません（pt=${pt}）</div>`;
  console.log("範囲外 pt:", pt);
  return;
}

const item = data_jaen[pt];

if (item) {
  content.innerHTML = `
    <img src="${item.icon}" class="icon">
    <div class="title">${item.title}</div>
    <div class="desc">${item.desc}</div>
  `;
} else {
  content.innerHTML = `<div class="title">データがありません（pt=${pt}）</div>`;
  console.log("data_jaen に存在しない pt:", pt);
}
</script>

</body>
</html>
