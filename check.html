<!-- ++++++++++++++++++++++++++++++++++++++++++++++++++ -->
<!-- わくわくプログラミング工房　平兵道　のホームページ -->
<!-- ++++++++++++++++++++++++++++++++++++++++++++++++++ -->
<!-- check.html -->
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>講座一覧｜わくわくプログラミング工房</title>
  <!-- ==================================================
       共通CSS
       ================================================== -->
  <link rel="stylesheet" href="style.css">

  <style>
    /* ==================================================
       このページ専用CSS
       ================================================== */
    /* ==================================================
       講座グループの上段説明
       ================================================== */
    .course-header {
      margin: 20px;
      padding: 20px 30px;
      border-radius: 15px;
      background-color: #ffffff;
      border: 2px solid #dddddd;
      box-shadow:
        0 3px 8px rgba(0, 0, 0, 0.10);
    }

    /* ==================================================
       講座グループタイトル部分
       ================================================== */
    .course-header-title-area {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 10px;
    }

    /* ==================================================
       講座グループアイコン
       個別カードには表示しない
       ================================================== */

    .course-header-icon {

      width: 80px;

      height: 80px;

      object-fit: contain;

      flex-shrink: 0;

    }


    /* ==================================================
       講座グループタイトル
       ================================================== */

    .course-header-title {

      font-size: 32px;

      color: #0000FF;

      font-weight: bold;

      line-height: 1.3;

    }


    /* ==================================================
       講座グループ説明
       ================================================== */

    .course-header-desc {

      font-size: 20px;

      line-height: 1.6;

    }


    /* ==================================================
       選択状況表示
       ================================================== */

    .selected-course-area {

      display: none;

      margin: 20px;

      padding: 18px 22px;

      border-radius: 15px;

      background-color: #fffbe6;

      border: 2px solid #ffcc00;

    }


    .selected-course-area.show {

      display: block;

    }


    .selected-course-title {

      font-size: 22px;

      font-weight: bold;

      color: #0000FF;

      margin-bottom: 10px;

    }


    .selected-course-info {

      font-size: 17px;

      line-height: 1.7;

    }


    /* ==================================================
       講座一覧
       ================================================== */

    #content {

      display: grid;

      grid-template-columns:
        repeat(5, minmax(0, 1fr));

      gap: 18px;

      margin: 20px;

      align-items: stretch;

    }


    /* ==================================================
       講座カード
       ================================================== */

    .course-card {

      border: 2px solid #dddddd;

      border-radius: 12px;

      padding: 15px;

      background-color: #ffffff;

      box-shadow:
        0 3px 8px rgba(0, 0, 0, 0.10);

      min-width: 0;

      display: flex;

      flex-direction: column;

    }


    /* ==================================================
       選択された講座カード
       ================================================== */

    .course-card.selected {

      border: 3px solid #ff9900;

      background-color: #fffbe6;

      box-shadow:
        0 4px 12px rgba(255, 153, 0, 0.25);

    }


    /* ==================================================
       講座名
       ================================================== */

    .title {

      font-size: 18px;

      color: #0000FF;

      font-weight: bold;

      line-height: 1.35;

      margin-bottom: 8px;

      word-break: break-word;

    }


    /* ==================================================
       説明文
       ================================================== */

    .desc {

      font-size: 13px;

      line-height: 1.5;

      margin-bottom: 8px;

      word-break: break-word;

      flex-grow: 1;

    }


    /* ==================================================
       講座ID
       ================================================== */

    .course-id {

      font-size: 14px;

      font-weight: bold;

      margin-top: 5px;

      margin-bottom: 10px;

    }


    /* ==================================================
       講座選択ボタン
       ================================================== */

    .course-select-button {

      width: 100%;

      font-size: 14px;

      font-weight: bold;

      padding: 9px 5px;

      border: none;

      border-radius: 8px;

      cursor: pointer;

      background-color: #ffcc00;

      color: #000000;

      margin-top: auto;

    }


    .course-select-button:hover {

      opacity: 0.8;

    }


    /* ==================================================
       選択済みボタン
       ================================================== */

    .course-card.selected
    .course-select-button {

      background-color: #66cc66;

      color: #ffffff;

    }


    /* ==================================================
       教材選択エリア
       ================================================== */

    .product-area {

      display: none;

      margin: 20px;

      padding: 20px;

      border-radius: 15px;

      background-color: #ffffff;

      border: 2px solid #dddddd;

      box-shadow:
        0 3px 8px rgba(0, 0, 0, 0.10);

    }


    .product-area.show {

      display: block;

    }


    /* ==================================================
       教材選択タイトル
       ================================================== */

    .product-title {

      font-size: 24px;

      font-weight: bold;

      color: #0000FF;

      margin-bottom: 15px;

    }


    /* ==================================================
       教材選択説明
       ================================================== */

    .product-description {

      font-size: 16px;

      margin-bottom: 15px;

      line-height: 1.6;

    }


    /* ==================================================
       商品選択
       ================================================== */

    .product-options {

      display: grid;

      grid-template-columns:
        repeat(3, minmax(0, 1fr));

      gap: 15px;

    }


    /* ==================================================
       商品選択カード
       ================================================== */

    .product-option {

      display: block;

      border: 2px solid #dddddd;

      border-radius: 12px;

      padding: 15px;

      cursor: pointer;

      background-color: #ffffff;

      transition: 0.2s;

    }


    .product-option:hover {

      border-color: #ffcc00;

      background-color: #fffbe6;

    }


    /* ==================================================
       選択された商品
       ================================================== */

    .product-option.selected {

      border: 3px solid #ff9900;

      background-color: #fffbe6;

    }


    /* ==================================================
       商品上段
       ================================================== */

    .product-option-top {

      display: flex;

      align-items: center;

      gap: 8px;

      margin-bottom: 8px;

    }


    .product-option input {

      cursor: pointer;

    }


    /* ==================================================
       商品ID
       ================================================== */

    .product-id {

      font-size: 20px;

      font-weight: bold;

      color: #0000FF;

    }


    /* ==================================================
       商品名
       ================================================== */

    .product-name {

      font-size: 17px;

      font-weight: bold;

      margin-bottom: 5px;

    }


    /* ==================================================
       商品価格
       ================================================== */

    .product-price {

      font-size: 18px;

      font-weight: bold;

      color: #cc0000;

    }


    /* ==================================================
       確認エリア
       ================================================== */

    .confirm-area {

      display: none;

      margin: 20px;

      padding: 20px;

      border-radius: 15px;

      background-color: #f5f9ff;

      border: 2px solid #6699cc;

    }


    .confirm-area.show {

      display: block;

    }


    .confirm-title {

      font-size: 24px;

      font-weight: bold;

      color: #0000FF;

      margin-bottom: 15px;

    }


    /* ==================================================
       確認内容
       ================================================== */

    .confirm-table {

      width: 100%;

      border-collapse: collapse;

      margin-bottom: 20px;

    }


    .confirm-table th,
    .confirm-table td {

      border: 1px solid #cccccc;

      padding: 10px;

      text-align: left;

    }


    .confirm-table th {

      width: 160px;

      background-color: #eeeeee;

      font-weight: bold;

    }


    .confirm-table td {

      background-color: #ffffff;

    }


    .confirm-price {

      font-size: 22px;

      font-weight: bold;

      color: #cc0000;

    }


    /* ==================================================
       申し込みボタン
       ================================================== */

    .apply-button {

      width: 100%;

      max-width: 500px;

      display: block;

      margin: 0 auto;

      padding: 14px;

      border: none;

      border-radius: 10px;

      cursor: pointer;

      background-color: #ff9900;

      color: #ffffff;

      font-size: 20px;

      font-weight: bold;

    }


    .apply-button:hover {

      opacity: 0.85;

    }


    /* ==================================================
       データなし表示
       ================================================== */

    .message {

      font-size: 26px;

      font-weight: bold;

      margin: 40px;

    }


    /* ==================================================
       タブレット表示
       ================================================== */

    @media (max-width: 1100px) {

      #content {

        grid-template-columns:
          repeat(3, minmax(0, 1fr));

      }


      .product-options {

        grid-template-columns:
          repeat(3, minmax(0, 1fr));

      }

    }


    /* ==================================================
       スマートフォン表示
       ================================================== */

    @media (max-width: 700px) {

      #content {

        grid-template-columns:
          repeat(2, minmax(0, 1fr));

        gap: 12px;

        margin: 12px;

      }


      .course-header {

        margin: 12px;

        padding: 15px 18px;

      }


      .course-header-title-area {

        gap: 10px;

      }


      .course-header-icon {

        width: 60px;

        height: 60px;

      }


      .course-header-title {

        font-size: 24px;

      }


      .course-header-desc {

        font-size: 16px;

      }


      .course-card {

        padding: 9px;

      }


      .title {

        font-size: 16px;

      }


      .desc {

        font-size: 12px;

      }


      .course-id {

        font-size: 12px;

      }


      .course-select-button {

        font-size: 12px;

        padding: 8px 4px;

      }


      .selected-course-area {

        margin: 12px;

        padding: 15px;

      }


      .selected-course-title {

        font-size: 20px;

      }


      .selected-course-info {

        font-size: 15px;

      }


      .product-area {

        margin: 12px;

        padding: 15px;

      }


      .product-title {

        font-size: 20px;

      }


      .product-options {

        grid-template-columns:
          1fr;

        gap: 10px;

      }


      .confirm-area {

        margin: 12px;

        padding: 15px;

      }


      .confirm-title {

        font-size: 20px;

      }


      .confirm-table th {

        width: 100px;

      }


      .confirm-table th,
      .confirm-table td {

        padding: 8px;

        font-size: 14px;

      }


      .confirm-price {

        font-size: 20px;

      }


      .apply-button {

        font-size: 18px;

      }

    }

  </style>

</head>


<body>


  <!-- ==================================================
       共通ヘッダー
       ================================================== -->

  <div id="header"></div>


  <!-- ==================================================
       選択した講座グループの説明
       ================================================== -->

  <div class="course-header">

    <div class="course-header-title-area">

      <!--
        CHECK_GASから取得した講座グループの
        アイコンを表示します。

        SC / GM / AT / MC / CG ... など、
        25グループをSC固定にせず処理します。
      -->

      <img
        id="courseHeaderIcon"
        class="course-header-icon"
        src=" "
        alt="講座アイコン"
      >

      <div
        id="courseHeaderTitle"
        class="course-header-title"
      >
        講座一覧
      </div>

    </div>


    <div
      id="courseHeaderDesc"
      class="course-header-desc"
    >
      講座を選択してください。
    </div>

  </div>


  <!-- ==================================================
       選択した講座
       ================================================== -->

  <div
    id="selectedCourseArea"
    class="selected-course-area"
  >

    <div class="selected-course-title">

      ① 選択した講座

    </div>


    <div
      id="selectedCourseInfo"
      class="selected-course-info"
    ></div>

  </div>


  <!-- ==================================================
       選択した講座グループの講座一覧
       ================================================== -->

  <div id="content"></div>


  <!-- ==================================================
       教材選択
       ================================================== -->

  <div
    id="productArea"
    class="product-area"
  >

    <div class="product-title">

      ② 教材を選択してください

    </div>


    <div class="product-description">

      選択した講座で利用する教材を
      1つ選択してください。

    </div>


    <div class="product-options">


      <!-- ==================================================
           KS
           ================================================== -->

      <label
        id="productOptionKS"
        class="product-option"
      >

        <div class="product-option-top">

          <input
            type="radio"
            name="product"
            value="KS"
            onchange="selectProduct('KS')"
          >

          <span class="product-id">

            KS

          </span>

        </div>


        <div class="product-name">

          動画教材

        </div>


        <div class="product-price">

          1,200円

        </div>

      </label>


      <!-- ==================================================
           PS
           ================================================== -->

      <label
        id="productOptionPS"
        class="product-option"
      >

        <div class="product-option-top">

          <input
            type="radio"
            name="product"
            value="PS"
            onchange="selectProduct('PS')"
          >

          <span class="product-id">

            PS

          </span>

        </div>


        <div class="product-name">

          PDF教材

        </div>


        <div class="product-price">

          2,400円

        </div>

      </label>


      <!-- ==================================================
           KP
           ================================================== -->

      <label
        id="productOptionKP"
        class="product-option"
      >

        <div class="product-option-top">

          <input
            type="radio"
            name="product"
            value="KP"
            onchange="selectProduct('KP')"
          >

          <span class="product-id">

            KP

          </span>

        </div>


        <div class="product-name">

          動画＋PDF

        </div>


        <div class="product-price">

          2,400円

        </div>

      </label>


    </div>

  </div>


  <!-- ==================================================
       最終確認
       ================================================== -->

  <div
    id="confirmArea"
    class="confirm-area"
  >

    <div class="confirm-title">

      ③ お申し込み内容の確認

    </div>


    <table class="confirm-table">

      <tr>

        <th>
          講座ID
        </th>

        <td id="confirmCourseId">
        </td>

      </tr>


      <tr>

        <th>
          講座名
        </th>

        <td id="confirmCourseName">
        </td>

      </tr>


      <tr>

        <th>
          販売商品ID
        </th>

        <td id="confirmProductId">
        </td>

      </tr>


      <tr>

        <th>
          教材
        </th>

        <td id="confirmProductName">
        </td>

      </tr>


      <tr>

        <th>
          料金
        </th>

        <td
          id="confirmPrice"
          class="confirm-price"
        >
        </td>

      </tr>

    </table>


    <button
      id="applyButton"
      class="apply-button"
      onclick="applyCourse()"
    >

      ④ この内容で申し込む

    </button>

  </div>


  <!-- ==================================================
       共通フッター
       ================================================== -->

  <div id="footer"></div>


  <!-- ==================================================
       共通JavaScript
       ================================================== -->

  <script src="script.js"></script>


  <!-- ==================================================
       このページ専用JavaScript
       ================================================== -->

  <script>


    /* ==================================================
       URLパラメータ
       ================================================== */

    const params =
      new URLSearchParams(
        location.search
      );


    /* ==================================================
       大分類courseId
       
       例：
       check.html?courseId=SC
       
       → SC
       ================================================== */

    const courseId =
      (
        params.get("courseId") || "SC"
      )
      .trim()
      .toUpperCase();


    


    /* ==================================================
       course.htmlから受け取った親講座情報
       ================================================== */

    const urlTitle =
      (
        params.get("title") || ""
      )
      .trim();


    const urlIcon =
      (
        params.get("icon") || ""
      )
      .trim();


    const urlPt =
      (
        params.get("pt") || ""
      )
      .trim();


/* ==================================================
       言語
       ================================================== */

    const lang =
      (
        params.get("lang") || "ja"
      )
      .trim()
      .toLowerCase();


    /* ==================================================
       CHECK_GAS URL 2026/09/22
       ================================================== */

    const CHECK_GAS_URL = "https://script.google.com/macros/s/AKfycbwQ3SNqsIAovU7ZJc_KX4BXodZYrGaGQ_zMBWX0CsD4aklcjZ9eUGL4GQqn3wSdOeIdAQ/exec";



    /* ==================================================
       HTML表示エリア
       ================================================== */

    const content =
      document.getElementById(
        "content"
      );


    /* ==================================================
       選択状態
       ================================================== */

    let selectedCourse = null;

    let selectedProductId = null;

    let selectedPrice = 0;


    /* ==================================================
       CHECK_GASから講座データ取得
       ================================================== */

    fetch(

      CHECK_GAS_URL

      + "?courseId="

      + encodeURIComponent(
          courseId
        )

      + "&lang="

      + encodeURIComponent(
          lang
        )

    )


      /* ==================================================
         HTTP確認
         ================================================== */

      .then(response => {

        if (!response.ok) {

          throw new Error(
            "HTTPエラー：" +
            response.status
          );

        }

        return response.json();

      })


      /* ==================================================
         GASデータ処理
         ================================================== */

      .then(data => {


        /* ==================================================
           GASエラー
           ================================================== */

        if (
          !data ||
          data.error
        ) {

          content.innerHTML = `

            <div class="message">

              データがありません

              <br><br>

              （courseId=${escapeHtml(
                courseId
              )}）

              <br><br>

              ${
                data && data.error
                  ? escapeHtml(
                      data.error
                    )
                  : ""
              }

            </div>

          `;

          return;

        }


        /* ==================================================
           items確認
           ================================================== */

        if (
          !Array.isArray(data.items) ||
          data.items.length === 0
        ) {

          content.innerHTML = `

            <div class="message">

              講座データがありません。

            </div>

          `;

          return;

        }


        /* ==================================================
           講座グループ情報を動的に設定

           ★今回の重要変更
           以前はScratch（SC）がHTMLに固定されていました。

           今回はURLのcourseIdとCHECK_GASの返却データから
           動的に表示します。

           そのため、
             SC / GM / AT / MC / CG ...
           など25グループを同じcheck.htmlで処理できます。

           CHECK_GASが将来、
             parentTitle
             parentDesc
             parentIcon
           を返す場合にも対応します。
           ================================================== */

        const firstItem =
          data.items[0] || {};

        const headerIcon =
          document.getElementById(
            "courseHeaderIcon"
          );

        const headerTitle =
          document.getElementById(
            "courseHeaderTitle"
          );

        const headerDesc =
          document.getElementById(
            "courseHeaderDesc"
          );


        /* --------------------------------------------------
           親講座名
           -------------------------------------------------- */

        const parentTitle =
          String(
            data.parentTitle ||
            data.categoryTitle ||
            data.groupTitle ||
            firstItem.parentTitle ||
            firstItem.categoryTitle ||
            firstItem.groupTitle ||
            urlTitle ||
            ""
          ).trim();


        const displayGroupName =
          parentTitle ||
          (courseId + "講座");


        headerTitle.textContent =
          "［講座］" +
          displayGroupName +
          "（" +
          courseId +
          "）";


        /* --------------------------------------------------
           親講座説明
           -------------------------------------------------- */

        const parentDesc =
          String(
            data.parentDesc ||
            data.categoryDesc ||
            data.groupDesc ||
            firstItem.parentDesc ||
            firstItem.categoryDesc ||
            firstItem.groupDesc ||
            ""
          ).trim();


        if (parentDesc) {

          headerDesc.innerHTML =
            escapeHtml(
              parentDesc
            ).replace(
              /&lt;br&gt;/gi,
              "<br>"
            );

        }

        else {

          headerDesc.textContent =
            "「" +
            displayGroupName +
            "」の講座から、" +
            data.items.length +
            "講座を選択できます。";

        }


        /* --------------------------------------------------
           親講座アイコン
           -------------------------------------------------- */

        const headerIconUrl =
          String(
            data.parentIcon ||
            data.categoryIcon ||
            data.groupIcon ||
            firstItem.parentIcon ||
            firstItem.categoryIcon ||
            firstItem.groupIcon ||
            firstItem.icon ||
            urlIcon ||
            ""
          ).trim();


        if (headerIconUrl) {

          headerIcon.src =
            headerIconUrl;

          headerIcon.alt =
            displayGroupName;

          headerIcon.style.display =
            "block";

        }

        else {

          headerIcon.style.display =
            "none";

        }


        /* ==================================================
           講座一覧作成
           ================================================== */

        let html = "";


        data.items.forEach(
          function(item) {


            /* ==================================================
               講座カード
               
               ★アイコンは表示しない
               ================================================== */

            html += `

              <div
                class="course-card"
                id="course-card-${escapeHtml(
                  item.courseId
                )}"
              >


                <!-- ==========================================
                     講座名
                     ========================================== -->

                <div class="title">

                  ［講座名］
                  ${escapeHtml(
                    item.title
                  )}

                </div>


                <!-- ==========================================
                     説明
                     ========================================== -->

                <div class="desc">

                  ${
                    escapeHtml(
                      item.desc
                    )
                    .replace(
                      /&lt;br&gt;/gi,
                      "<br>"
                    )
                  }

                </div>


                <!-- ==========================================
                     講座ID
                     ========================================== -->

                <div class="course-id">

                  ［講座ID］
                  ${escapeHtml(
                    item.courseId
                  )}

                </div>


                <!-- ==========================================
                     講座選択ボタン
                     ========================================== -->

                <button

                  type="button"

                  class="course-select-button"

                  onclick="selectCourse(
                    '${escapeJs(
                      item.courseId
                    )}'
                  )"

                >

                  この講座を選択

                </button>


              </div>

            `;

          }
        );


        /* ==================================================
           一覧を画面表示
           ================================================== */

        content.innerHTML =
          html;


        /* ==================================================
           講座データを保存
           ================================================== */

        window.courseItems =
          data.items;


      })


      /* ==================================================
         通信エラー
         ================================================== */

      .catch(error => {


        console.error(
          "CHECK_GAS通信エラー：",
          error
        );


        content.innerHTML = `

          <div class="message">

            データを取得できませんでした

          </div>


          <div class="desc">

            CHECK_GASとの通信で
            エラーが発生しました。

            <br><br>

            ブラウザの再読み込みを
            試してください。

          </div>

        `;

      });


    /* ==================================================
       講座を選択
       ================================================== */

    function selectCourse(courseId) {


      /* ==================================================
         講座IDを統一
         ================================================== */

      courseId =
        String(
          courseId
        )
        .trim()
        .toUpperCase();


      /* ==================================================
         講座データ検索
         ================================================== */

      const item =
        (window.courseItems || [])
        .find(
          function(course) {

            return String(
              course.courseId
            )
            .trim()
            .toUpperCase()
            ===
            courseId;

          }
        );


      /* ==================================================
         講座が見つからない
         ================================================== */

      if (!item) {

        alert(
          "選択した講座が見つかりません。"
        );

        return;

      }


      /* ==================================================
         選択講座を保存
         ================================================== */

      selectedCourse =
        item;


      /* ==================================================
         すべてのカードの選択状態を解除
         ================================================== */

      document
        .querySelectorAll(
          ".course-card"
        )
        .forEach(
          function(card) {

            card.classList.remove(
              "selected"
            );

          }
        );


      /* ==================================================
         選択したカードを強調
         ================================================== */

      const selectedCard =
        document.getElementById(
          "course-card-" +
          courseId
        );


      if (selectedCard) {

        selectedCard.classList.add(
          "selected"
        );

      }


      /* ==================================================
         選択した講座を表示
         ================================================== */

      document.getElementById(
        "selectedCourseInfo"
      ).innerHTML = `

        講座ID：
        <strong>
          ${escapeHtml(
            item.courseId
          )}
        </strong>

        <br>

        講座名：
        <strong>
          ${escapeHtml(
            item.title
          )}
        </strong>

      `;


      document.getElementById(
        "selectedCourseArea"
      )
      .classList.add(
        "show"
      );


      /* ==================================================
         教材選択エリアを表示
         ================================================== */

      document.getElementById(
        "productArea"
      )
      .classList.add(
        "show"
      );


      /* ==================================================
         商品選択をリセット
         ================================================== */

      selectedProductId = null;

      selectedPrice = 0;


      document
        .querySelectorAll(
          'input[name="product"]'
        )
        .forEach(
          function(radio) {

            radio.checked = false;

          }
        );


      document
        .querySelectorAll(
          ".product-option"
        )
        .forEach(
          function(option) {

            option.classList.remove(
              "selected"
            );

          }
        );


      /* ==================================================
         最終確認を隠す
         ================================================== */

      document.getElementById(
        "confirmArea"
      )
      .classList.remove(
        "show"
      );


      /* ==================================================
         教材選択位置まで移動
         ================================================== */

      document.getElementById(
        "productArea"
      )
      .scrollIntoView({

        behavior: "smooth",

        block: "start"

      });

    }


    /* ==================================================
       商品を選択
       ================================================== */

    function selectProduct(
      productId
    ) {


      /* ==================================================
         商品IDを統一
         ================================================== */

      productId =
        String(
          productId
        )
        .trim()
        .toUpperCase();


      /* ==================================================
         商品ID確認
         ================================================== */

      if (
        productId !== "KS" &&
        productId !== "PS" &&
        productId !== "KP"
      ) {

        alert(
          "販売商品IDが正しくありません。"
        );

        return;

      }


      /* ==================================================
         商品価格
         ================================================== */

      let price = 0;


      if (productId === "KS") {

        price = 1200;

      }

      else if (
        productId === "PS"
      ) {

        price = 2400;

      }

      else if (
        productId === "KP"
      ) {

        price = 2400;

      }


      /* ==================================================
         選択状態を保存
         ================================================== */

      selectedProductId =
        productId;

      selectedPrice =
        price;


      /* ==================================================
         商品カードの選択状態を解除
         ================================================== */

      document
        .querySelectorAll(
          ".product-option"
        )
        .forEach(
          function(option) {

            option.classList.remove(
              "selected"
            );

          }
        );


      /* ==================================================
         選択商品を強調
         ================================================== */

      const selectedOption =
        document.getElementById(
          "productOption" +
          productId
        );


      if (selectedOption) {

        selectedOption.classList.add(
          "selected"
        );

      }


      /* ==================================================
         商品名
         ================================================== */

      let productName = "";


      if (productId === "KS") {

        productName =
          "動画教材";

      }

      else if (
        productId === "PS"
      ) {

        productName =
          "PDF教材";

      }

      else if (
        productId === "KP"
      ) {

        productName =
          "動画＋PDF";

      }


      /* ==================================================
         最終確認へ表示
         ================================================== */

      document.getElementById(
        "confirmCourseId"
      ).textContent =
        selectedCourse.courseId;


      document.getElementById(
        "confirmCourseName"
      ).textContent =
        selectedCourse.title;


      document.getElementById(
        "confirmProductId"
      ).textContent =
        productId;


      document.getElementById(
        "confirmProductName"
      ).textContent =
        productName;


      document.getElementById(
        "confirmPrice"
      ).textContent =
        price.toLocaleString() +
        "円";


      /* ==================================================
         最終確認を表示
         ================================================== */

      document.getElementById(
        "confirmArea"
      )
      .classList.add(
        "show"
      );


      /* ==================================================
         最終確認位置へ移動
         ================================================== */

      document.getElementById(
        "confirmArea"
      )
      .scrollIntoView({

        behavior: "smooth",

        block: "start"

      });

    }


    /* ==================================================
       申し込み
       ================================================== */

    function applyCourse() {


      /* ==================================================
         講座確認
         ================================================== */

      if (!selectedCourse) {

        alert(
          "先に講座を選択してください。"
        );

        return;

      }


      /* ==================================================
         商品確認
         ================================================== */

      if (!selectedProductId) {

        alert(
          "教材を選択してください。"
        );

        return;

      }


      /* ==================================================
         カート情報
         
         STEP 4 tryit.htmlへ
         これまでと同じ3項目を渡す
         ================================================== */

      const cartData = {

        courseId:
          String(
            selectedCourse.courseId
          )
          .trim()
          .toUpperCase(),

        productId:
          String(
            selectedProductId
          )
          .trim()
          .toUpperCase(),

        price:
          selectedPrice

      };


      /* ==================================================
         localStorageへ保存
         ================================================== */

      localStorage.setItem(

        "cart",

        JSON.stringify(
          cartData
        )

      );


      /* ==================================================
         tryit.html URL
         
         例：
         
         tryit.html
         ?courseId=SC01
         &productId=KS
         &price=1200
         ================================================== */

      const url =

        "tryit.html"

        + "?courseId="

        + encodeURIComponent(
            cartData.courseId
          )

        + "&productId="

        + encodeURIComponent(
            cartData.productId
          )

        + "&price="

        + encodeURIComponent(
            cartData.price
          );


      /* ==================================================
         tryit.htmlへ移動
         ================================================== */

      window.location.href =
        url;

    }


    /* ==================================================
       HTML特殊文字対策
       ================================================== */

    function escapeHtml(value) {

      return String(value)

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /'/g,
          "&#039;"
        );

    }


    /* ==================================================
       JavaScript文字列用エスケープ
       ================================================== */

    function escapeJs(value) {

      return String(value)

        .replace(
          /\\/g,
          "\\\\"
        )

        .replace(
          /'/g,
          "\\'"
        )

        .replace(
          /"/g,
          '\\"'
        )

        .replace(
          /\r/g,
          "\\r"
        )

        .replace(
          /\n/g,
          "\\n"
        );

    }
  </script>
</body>
