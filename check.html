<!-- ++++++++++++++++++++++++++++++++++++++++++++++++++ -->
<!-- わくわくプログラミング工房　平兵道 -->
<!-- check.html -->
<!-- ++++++++++++++++++++++++++++++++++++++++++++++++++ -->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>講座一覧｜わくわくプログラミング工房</title>
<link rel="stylesheet" href="style.css" >

<style>
/* ==================================================
   共通
   ================================================== */
body {
  margin: 0;
}

/* ==================================================
   グループ説明
   ================================================== */
.course-header {

  margin: 20px;

  padding: 20px 30px;

  border-radius: 15px;

  background-color: #ffffff;

  border: 2px solid #dddddd;

  box-shadow:
    0 3px 8px rgba(0,0,0,0.10);

}


.course-header-title-area {

  display: flex;

  align-items: center;

  gap: 15px;

  margin-bottom: 10px;

}


.course-header-icon {

  width: 80px;

  height: 80px;

  object-fit: contain;

  flex-shrink: 0;

}


.course-header-title {

  font-size: 32px;

  color: #0000ff;

  font-weight: bold;

  line-height: 1.3;

}


.course-header-desc {

  font-size: 20px;

  line-height: 1.6;

}


/* ==================================================
   選択した講座
   ================================================== */

.selected-course-area {

  display: none;

  margin: 20px;

  padding: 18px 22px;

  border-radius: 15px;

  background-color: #fffbe6;

  border: 2px solid #ffcc00;

}


.selected-course-area.show {

  display: block;

}


.selected-course-title {

  font-size: 22px;

  font-weight: bold;

  color: #0000ff;

  margin-bottom: 10px;

}


.selected-course-info {

  font-size: 17px;

  line-height: 1.7;

}


/* ==================================================
   講座一覧
   ================================================== */

#content {

  display: grid;

  grid-template-columns:
    repeat(5, minmax(0, 1fr));

  gap: 18px;

  margin: 20px;

  align-items: stretch;

}


/* ==================================================
   講座カード
   ================================================== */

.course-card {

  border: 2px solid #dddddd;

  border-radius: 12px;

  padding: 15px;

  background-color: #ffffff;

  box-shadow:
    0 3px 8px rgba(0,0,0,0.10);

  min-width: 0;

  display: flex;

  flex-direction: column;

}


.course-card.selected {

  border: 3px solid #ff9900;

  background-color: #fffbe6;

}


.title {

  font-size: 18px;

  color: #0000ff;

  font-weight: bold;

  line-height: 1.35;

  margin-bottom: 8px;

  word-break: break-word;

}


.desc {

  font-size: 13px;

  line-height: 1.5;

  margin-bottom: 8px;

  word-break: break-word;

  flex-grow: 1;

}


.course-id {

  font-size: 14px;

  font-weight: bold;

  margin-top: 5px;

  margin-bottom: 10px;

}


.course-select-button {

  width: 100%;

  font-size: 14px;

  font-weight: bold;

  padding: 9px 5px;

  border: none;

  border-radius: 8px;

  cursor: pointer;

  background-color: #ffcc00;

  color: #000000;

  margin-top: auto;

}


.course-select-button:hover {

  opacity: 0.8;

}


.course-card.selected
.course-select-button {

  background-color: #66cc66;

  color: #ffffff;

}


/* ==================================================
   商品選択
   ================================================== */

.product-area {

  display: none;

  margin: 20px;

  padding: 20px;

  border-radius: 15px;

  background-color: #ffffff;

  border: 2px solid #dddddd;

  box-shadow:
    0 3px 8px rgba(0,0,0,0.10);

}


.product-area.show {

  display: block;

}


.product-title {

  font-size: 24px;

  font-weight: bold;

  color: #0000ff;

  margin-bottom: 15px;

}


.product-description {

  font-size: 16px;

  margin-bottom: 15px;

  line-height: 1.6;

}


.product-options {

  display: grid;

  grid-template-columns:
    repeat(3, minmax(0,1fr));

  gap: 15px;

}


.product-option {

  display: block;

  border: 2px solid #dddddd;

  border-radius: 12px;

  padding: 15px;

  cursor: pointer;

  background-color: #ffffff;

  transition: 0.2s;

}


.product-option:hover {

  border-color: #ffcc00;

  background-color: #fffbe6;

}


.product-option.selected {

  border: 3px solid #ff9900;

  background-color: #fffbe6;

}


.product-option-top {

  display: flex;

  align-items: center;

  gap: 8px;

  margin-bottom: 8px;

}


.product-id {

  font-size: 20px;

  font-weight: bold;

  color: #0000ff;

}


.product-name {

  font-size: 17px;

  font-weight: bold;

  margin-bottom: 5px;

}


.product-price {

  font-size: 18px;

  font-weight: bold;

  color: #cc0000;

}


/* ==================================================
   確認
   ================================================== */

.confirm-area {

  display: none;

  margin: 20px;

  padding: 20px;

  border-radius: 15px;

  background-color: #f5f9ff;

  border: 2px solid #6699cc;

}


.confirm-area.show {

  display: block;

}


.confirm-title {

  font-size: 24px;

  font-weight: bold;

  color: #0000ff;

  margin-bottom: 15px;

}


.confirm-table {

  width: 100%;

  border-collapse: collapse;

  margin-bottom: 20px;

}


.confirm-table th,
.confirm-table td {

  border: 1px solid #cccccc;

  padding: 10px;

  text-align: left;

}


.confirm-table th {

  width: 160px;

  background-color: #eeeeee;

}


.confirm-table td {

  background-color: #ffffff;

}


.confirm-price {

  font-size: 22px;

  font-weight: bold;

  color: #cc0000;

}


.apply-button {

  width: 100%;

  max-width: 500px;

  display: block;

  margin: 0 auto;

  padding: 14px;

  border: none;

  border-radius: 10px;

  cursor: pointer;

  background-color: #ff9900;

  color: #ffffff;

  font-size: 20px;

  font-weight: bold;

}


/* ==================================================
   メッセージ
   ================================================== */

.message {

  margin: 40px 20px;

  padding: 25px;

  border-radius: 15px;

  background-color: #fffbe6;

  border: 2px solid #ffcc00;

  font-size: 20px;

  line-height: 1.7;

}


/* ==================================================
   スマホ
   ================================================== */

@media (max-width:1100px) {

  #content {

    grid-template-columns:
      repeat(3,minmax(0,1fr));

  }

}


@media (max-width:700px) {

  #content {

    grid-template-columns:
      repeat(2,minmax(0,1fr));

    gap: 12px;

    margin: 12px;

  }

  .course-header {

    margin: 12px;

    padding: 15px 18px;

  }

  .course-header-icon {

    width: 60px;

    height: 60px;

  }

  .course-header-title {

    font-size: 24px;

  }

  .course-header-desc {

    font-size: 16px;

  }

  .course-card {

    padding: 9px;

  }

  .title {

    font-size: 16px;

  }

  .desc {

    font-size: 12px;

  }

  .course-id {

    font-size: 12px;

  }

  .course-select-button {

    font-size: 12px;

  }

  .product-options {

    grid-template-columns: 1fr;

  }

}

</style>

</head>


<body>


<!-- ==================================================
     共通ヘッダー
     ================================================== -->

<div id="header"></div>


<!-- ==================================================
     グループ情報
     ================================================== -->

<div class="course-header">

  <div class="course-header-title-area">

    <img
      id="courseHeaderIcon"
      class="course-header-icon"
      style="display:none;"
      alt="講座アイコン"
    >

    <div
      id="courseHeaderTitle"
      class="course-header-title"
    >
      講座一覧
    </div>

  </div>


  <div
    id="courseHeaderDesc"
    class="course-header-desc"
  >
    講座を選択してください。
  </div>

</div>


<!-- ==================================================
     選択講座
     ================================================== -->

<div
  id="selectedCourseArea"
  class="selected-course-area"
>

  <div class="selected-course-title">

    ① 選択した講座

  </div>

  <div
    id="selectedCourseInfo"
    class="selected-course-info"
  ></div>

</div>


<!-- ==================================================
     講座一覧
     ================================================== -->

<div id="content"></div>


<!-- ==================================================
     商品選択
     ================================================== -->

<div
  id="productArea"
  class="product-area"
>

  <div class="product-title">

    ② 教材を選択してください

  </div>

  <div class="product-description">

    選択した講座で利用する教材を
    1つ選択してください。

  </div>


  <div class="product-options">


    <!-- KS -->

    <label
      id="productOptionKS"
      class="product-option"
    >

      <div class="product-option-top">

        <input
          type="radio"
          name="product"
          value="KS"
          onchange="selectProduct('KS')"
        >

        <span class="product-id">
          KS
        </span>

      </div>

      <div class="product-name">
        動画教材
      </div>

      <div class="product-price">
        1,200円
      </div>

    </label>


    <!-- PS -->

    <label
      id="productOptionPS"
      class="product-option"
    >

      <div class="product-option-top">

        <input
          type="radio"
          name="product"
          value="PS"
          onchange="selectProduct('PS')"
        >

        <span class="product-id">
          PS
        </span>

      </div>

      <div class="product-name">
        PDF教材
      </div>

      <div class="product-price">
        2,400円
      </div>

    </label>


    <!-- KP -->

    <label
      id="productOptionKP"
      class="product-option"
    >

      <div class="product-option-top">

        <input
          type="radio"
          name="product"
          value="KP"
          onchange="selectProduct('KP')"
        >

        <span class="product-id">
          KP
        </span>

      </div>

      <div class="product-name">
        動画＋PDF
      </div>

      <div class="product-price">
        2,400円
      </div>

    </label>

  </div>

</div>


<!-- ==================================================
     最終確認
     ================================================== -->

<div
  id="confirmArea"
  class="confirm-area"
>

  <div class="confirm-title">

    ③ お申し込み内容の確認

  </div>


  <table class="confirm-table">

    <tr>
      <th>講座ID</th>
      <td id="confirmCourseId"></td>
    </tr>

    <tr>
      <th>講座名</th>
      <td id="confirmCourseName"></td>
    </tr>

    <tr>
      <th>販売商品ID</th>
      <td id="confirmProductId"></td>
    </tr>

    <tr>
      <th>教材</th>
      <td id="confirmProductName"></td>
    </tr>

    <tr>
      <th>料金</th>
      <td
        id="confirmPrice"
        class="confirm-price"
      ></td>
    </tr>

  </table>


  <button
    id="applyButton"
    class="apply-button"
    onclick="applyCourse()"
  >

    ④ この内容で申し込む

  </button>

</div>


<!-- ==================================================
     共通フッター
     ================================================== -->

<div id="footer"></div>


<script src="script.js"></script>


<script>

/* ==================================================
   URLパラメータ
   ================================================== */

const params =
  new URLSearchParams(
    location.search
  );


/* ==================================================
   ★重要
   courseIdをSC固定しない
   ================================================== */

const courseId =
  (
    params.get("courseId") || ""
  )
  .trim()
  .toUpperCase();


/* ==================================================
   言語
   ================================================== */

const lang =
  (
    params.get("lang") || "ja"
  )
  .trim()
  .toLowerCase();


/* ==================================================
   CHECK_GAS
   ================================================== */

const CHECK_GAS_URL = "https://script.google.com/macros/s/AKfycbwQ3SNqsIAovU7ZJc_KX4BXodZYrGaGQ_zMBWX0CsD4aklcjZ9eUGL4GQqn3wSdOeIdAQ/exec";


/* ==================================================
   表示場所
   ================================================== */

const content =
  document.getElementById(
    "content"
  );


/* ==================================================
   選択状態
   ================================================== */

let selectedCourse = null;

let selectedProductId = null;

let selectedPrice = 0;


/* ==================================================
   courseIdがない場合
   ================================================== */

if (!courseId) {

  content.innerHTML = `

    <div class="message">

      <strong>
        講座IDが指定されていません。
      </strong>

      <br><br>

      course.htmlから講座を選択してください。

    </div>

  `;

}


/* ==================================================
   CHECK_GAS呼び出し
   ================================================== */

else {

  const requestUrl =
    CHECK_GAS_URL
    + "?courseId="
    + encodeURIComponent(courseId)
    + "&lang="
    + encodeURIComponent(lang);


  console.log(
    "CHECK_GAS URL：",
    requestUrl
  );


  fetch(requestUrl)


  /* ==================================================
     HTTP確認
     ================================================== */

  .then(
    function(response) {

      if (!response.ok) {

        throw new Error(
          "HTTPエラー：" +
          response.status
        );

      }

      return response.json();

    }
  )


  /* ==================================================
     GAS結果
     ================================================== */

  .then(
    function(data) {

      console.log(
        "CHECK_GAS response：",
        data
      );


      /* ==================================================
         親グループ情報
         ================================================== */

      const headerTitle =
        document.getElementById(
          "courseHeaderTitle"
        );

      const headerDesc =
        document.getElementById(
          "courseHeaderDesc"
        );

      const headerIcon =
        document.getElementById(
          "courseHeaderIcon"
        );


      const parentTitle =
        String(
          data.parentTitle || ""
        )
        .trim();


      const parentDesc =
        String(
          data.parentDesc || ""
        )
        .trim();


      const parentIcon =
        String(
          data.parentIcon || ""
        )
        .trim();


      /* ==================================================
         グループ名
         ================================================== */

      headerTitle.textContent =

        "［講座］" +

        (
          parentTitle ||
          courseId + "講座"
        )

        +

        "（" +

        courseId +

        "）";


      /* ==================================================
         グループ説明
         ================================================== */

      if (parentDesc) {

        headerDesc.innerHTML =
          escapeHtml(
            parentDesc
          )
          .replace(
            /&lt;br&gt;/gi,
            "<br>"
          );

      }

      else {

        headerDesc.textContent =

          "「" +
          courseId +
          "」の講座を選択してください。";

      }


      /* ==================================================
         グループアイコン
         ================================================== */

      if (parentIcon) {

        headerIcon.src =
          parentIcon;

        headerIcon.alt =
          parentTitle ||
          courseId;

        headerIcon.style.display =
          "block";

      }

      else {

        headerIcon.style.display =
          "none";

      }


      /* ==================================================
         GASエラー
         ================================================== */

      if (
        !data ||
        data.ok === false
      ) {

        content.innerHTML = `

          <div class="message">

            <strong>
              講座データを取得できませんでした。
            </strong>

            <br><br>

            ［グループID］
            ${escapeHtml(courseId)}

            <br><br>

            ${
              data && data.error
                ? escapeHtml(data.error)
                : "不明なエラーです。"
            }

          </div>

        `;

        return;

      }


      /* ==================================================
         items確認
         ================================================== */

      if (
        !Array.isArray(data.items) ||
        data.items.length === 0
      ) {

        content.innerHTML = `

          <div class="message">

            「${escapeHtml(courseId)}」の
            個別講座がありません。

          </div>

        `;

        return;

      }


      /* ==================================================
         講座一覧
         ================================================== */

      let html = "";


      data.items.forEach(
        function(item) {

          const safeId =
            escapeHtml(
              item.courseId
            );


          html += `

            <div
              class="course-card"
              id="course-card-${safeId}"
            >

              <div class="title">

                ［講座名］
                ${escapeHtml(
                  item.title
                )}

              </div>


              <div class="desc">

                ${
                  escapeHtml(
                    item.desc
                  )
                  .replace(
                    /&lt;br&gt;/gi,
                    "<br>"
                  )
                }

              </div>


              <div class="course-id">

                ［講座ID］
                ${safeId}

              </div>


              <button
                type="button"
                class="course-select-button"
                onclick="
                  selectCourse(
                    '${escapeJs(
                      item.courseId
                    )}'
                  )
                "
              >

                この講座を選択

              </button>

            </div>

          `;

        }
      );


      /* ==================================================
         一覧表示
         ================================================== */

      content.innerHTML =
        html;


      /* ==================================================
         講座データ保存
         ================================================== */

      window.courseItems =
        data.items;

    }
  )


  /* ==================================================
     通信エラー
     ================================================== */

  .catch(
    function(error) {

      console.error(
        "CHECK_GAS通信エラー：",
        error
      );


      content.innerHTML = `

        <div class="message">

          <strong>
            CHECK_GASとの通信で
            エラーが発生しました。
          </strong>

          <br><br>

          ［グループID］
          ${escapeHtml(courseId)}

          <br><br>

          エラー内容：
          ${escapeHtml(
            error.message ||
            String(error)
          )}

          <br><br>

          ブラウザを再読み込みしてください。

        </div>

      `;

    }
  );

}


/* ==================================================
   講座選択
   ================================================== */

function selectCourse(courseId) {


  courseId =
    String(courseId)
    .trim()
    .toUpperCase();


  const item =
    (window.courseItems || [])
    .find(
      function(course) {

        return String(
          course.courseId
        )
        .trim()
        .toUpperCase()
        ===
        courseId;

      }
    );


  if (!item) {

    alert(
      "選択した講座が見つかりません。"
    );

    return;

  }


  selectedCourse =
    item;


  /* ==================================================
     カード選択解除
     ================================================== */

  document
    .querySelectorAll(
      ".course-card"
    )
    .forEach(
      function(card) {

        card.classList.remove(
          "selected"
        );

      }
    );


  /* ==================================================
     選択カード強調
     ================================================== */

  const selectedCard =
    document.getElementById(
      "course-card-" +
      courseId
    );


  if (selectedCard) {

    selectedCard.classList.add(
      "selected"
    );

  }


  /* ==================================================
     選択講座表示
     ================================================== */

  document.getElementById(
    "selectedCourseInfo"
  ).innerHTML = `

    講座ID：
    <strong>
      ${escapeHtml(
        item.courseId
      )}
    </strong>

    <br>

    講座名：
    <strong>
      ${escapeHtml(
        item.title
      )}
    </strong>

  `;


  document
    .getElementById(
      "selectedCourseArea"
    )
    .classList.add(
      "show"
    );


  /* ==================================================
     商品エリア表示
     ================================================== */

  document
    .getElementById(
      "productArea"
    )
    .classList.add(
      "show"
    );


  /* ==================================================
     商品選択リセット
     ================================================== */

  selectedProductId =
    null;

  selectedPrice =
    0;


  document
    .querySelectorAll(
      'input[name="product"]'
    )
    .forEach(
      function(radio) {

        radio.checked =
          false;

      }
    );


  document
    .querySelectorAll(
      ".product-option"
    )
    .forEach(
      function(option) {

        option.classList.remove(
          "selected"
        );

      }
    );


  document
    .getElementById(
      "confirmArea"
    )
    .classList.remove(
      "show"
    );


  document
    .getElementById(
      "productArea"
    )
    .scrollIntoView({

      behavior: "smooth",

      block: "start"

    });

}


/* ==================================================
   商品選択
   ================================================== */

function selectProduct(productId) {


  productId =
    String(productId)
    .trim()
    .toUpperCase();


  if (
    productId !== "KS" &&
    productId !== "PS" &&
    productId !== "KP"
  ) {

    alert(
      "販売商品IDが正しくありません。"
    );

    return;

  }


  let price = 0;

  let productName = "";


  if (
    productId === "KS"
  ) {

    price = 1200;

    productName =
      "動画教材";

  }

  else if (
    productId === "PS"
  ) {

    price = 2400;

    productName =
      "PDF教材";

  }

  else if (
    productId === "KP"
  ) {

    price = 2400;

    productName =
      "動画＋PDF";

  }


  selectedProductId =
    productId;

  selectedPrice =
    price;


  /* ==================================================
     選択解除
     ================================================== */

  document
    .querySelectorAll(
      ".product-option"
    )
    .forEach(
      function(option) {

        option.classList.remove(
          "selected"
        );

      }
    );


  /* ==================================================
     選択商品強調
     ================================================== */

  const selectedOption =
    document.getElementById(
      "productOption" +
      productId
    );


  if (selectedOption) {

    selectedOption.classList.add(
      "selected"
    );

  }


  /* ==================================================
     最終確認
     ================================================== */

  document.getElementById(
    "confirmCourseId"
  ).textContent =
    selectedCourse.courseId;


  document.getElementById(
    "confirmCourseName"
  ).textContent =
    selectedCourse.title;


  document.getElementById(
    "confirmProductId"
  ).textContent =
    productId;


  document.getElementById(
    "confirmProductName"
  ).textContent =
    productName;


  document.getElementById(
    "confirmPrice"
  ).textContent =
    price.toLocaleString() +
    "円";


  /* ==================================================
     確認表示
     ================================================== */

  document
    .getElementById(
      "confirmArea"
    )
    .classList.add(
      "show"
    );


  document
    .getElementById(
      "confirmArea"
    )
    .scrollIntoView({

      behavior: "smooth",

      block: "start"

    });

}


/* ==================================================
   申し込み
   ================================================== */

function applyCourse() {


  if (!selectedCourse) {

    alert(
      "先に講座を選択してください。"
    );

    return;

  }


  if (!selectedProductId) {

    alert(
      "教材を選択してください。"
    );

    return;

  }


  /* ==================================================
     STEP 4
     tryit.htmlへ渡すデータ
     ================================================== */

  const cartData = {

    courseId:
      String(
        selectedCourse.courseId
      )
      .trim()
      .toUpperCase(),

    productId:
      String(
        selectedProductId
      )
      .trim()
      .toUpperCase(),

    price:
      selectedPrice

  };


  /* ==================================================
     localStorage
     ================================================== */

  localStorage.setItem(

    "cart",

    JSON.stringify(
      cartData
    )

  );


  /* ==================================================
     tryit.html
     ================================================== */

  const url =

    "tryit.html"

    + "?courseId="

    + encodeURIComponent(
        cartData.courseId
      )

    + "&productId="

    + encodeURIComponent(
        cartData.productId
      )

    + "&price="

    + encodeURIComponent(
        cartData.price
      );


  console.log(
    "tryit.htmlへ移動：",
    url
  );


  window.location.href =
    url;

}


/* ==================================================
   HTMLエスケープ
   ================================================== */

function escapeHtml(value) {

  return String(
    value == null
      ? ""
      : value
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}


/* ==================================================
   JavaScript文字列エスケープ
   ================================================== */

function escapeJs(value) {

  return String(
    value == null
      ? ""
      : value
  )

  .replace(
    /\\/g,
    "\\\\"
  )

  .replace(
    /'/g,
    "\\'"
  )

  .replace(
    /"/g,
    '\\"'
  )

  .replace(
    /\r/g,
    "\\r"
  )

  .replace(
    /\n/g,
    "\\n"
  );

}
