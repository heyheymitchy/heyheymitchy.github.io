<!-- わくわくプログラミング工房　平兵道　のホームページ -->
<!-- ++++++++++++++++++++++++++++++++++++++++++++++++++ -->
<!-- Check.html -->
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Check List</title>
  <link rel="stylesheet" href="style.css">

<style>
/* ==================================================
   このページ専用CSS
   ================================================== */

/* 全体の表示エリア */
#content {
  display: grid;
  grid-template-columns: 180px 1fr;
  grid-template-rows: auto auto;
  column-gap: 40px;
  align-items: start;
  margin: 20px;
}

/* ------------------------------------------
   アイコン
   左上に表示
   ------------------------------------------ */
.icon {
  width: 180px;
  display: block;
  grid-column: 1;
  grid-row: 1;
}

/* ------------------------------------------
   タイトル
   アイコンの下、左側に表示
   ------------------------------------------ */
.title {
  font-size: 36px;
  color: #0000FF;  /* タイトルを青色にする */
  text-align: center;
  margin-top: 10px;
  font-weight: bold;
  grid-column: 1;
  grid-row: 2;
}

/* ------------------------------------------
   説明文
   アイコンの右側に表示
   ------------------------------------------ */
.desc {
  font-size: 28px;
  line-height: 1.6;
  margin: 0;
  grid-column: 2;
  grid-row: 1 / 3;
}

/* ==================================================
   講座ID
   ================================================== */

.course-id {
  font-size: 26px;
  font-weight: bold;
  margin-top: 25px;
  margin-bottom: 20px;
}


/* ==================================================
   カートボタン
   ================================================== */

.cart-button {
  font-size: 24px;
  font-weight: bold;

  padding: 12px 30px;

  border: none;
  border-radius: 10px;

  cursor: pointer;

  background-color: #ffcc00;
  color: #000000;

  margin-top: 10px;
}

.cart-button:hover {
  opacity: 0.8;
}

</style>
</head>

<body>
<!-- ここからは全html共用の記述にする -->
<!-- ================================================== -->
<!-- 共通ヘッダー -->
<!-- ================================================== -->
  <div id="header"></div>
<!-- ここまで -->   

<!-- ここからはこのページだけの内容 -->
<div id="content"></div>

<!-- ここまで -->

<!-- ここからは全html共用の記述にする -->
  <!-- ================================================== -->
  <!-- 共通フッター -->
  <!-- ================================================== -->
  <div id="footer"></div>
  
  <!-- ================================================== -->
  <!-- 共通JavaScript -->
  <!-- ================================================== -->
  <script src="script.js"></script>
<!-- ここまで -->

  <script>
    /* ==================================================
       CHECK_GASからデータを取得して表示する
       ================================================== */

    // ▼ URLパラメータ
    const params = new URLSearchParams(location.search);

    // ▼ ptを取得
    const pt = params.get("pt") || "101";

    // ▼ 言語
    // URLに lang=ja / lang=en があればそれを使用
    // なければ日本語
    const lang = params.get("lang") || "ja";



// ==================================================
// カートに講座IDを保存
// ==================================================

function addToCart(courseId) {

  // 講座IDがない場合
  if (!courseId) {

    alert("講座IDがありません。");

    return;
  }


  // ------------------------------------------
  // カートに保存
  // ------------------------------------------

  localStorage.setItem(
    "cart",
    JSON.stringify({
      courseId: String(courseId).trim()
    })
  );

// ▼ CHECK_GASのウェブアプリURL(デプロイしたらＵＲＬ上塗りすること0910)
    const CHECK_GAS_URL = "https://script.google.com/macros/s/AKfycbwmMgJqKEp-s55UQqnIceSSTjcsKYuHyjOPkp6zPpQCEcJmgv5YmqiqvO0huLW-tQemqw/exec";

    // ▼ 表示エリア
    const content = document.getElementById("content");

    // ▼ GASからデータ取得
    fetch(
      CHECK_GAS_URL +
      "?pt=" + encodeURIComponent(pt) +
      "&lang=" + encodeURIComponent(lang)
    )
      .then(response => {
        if (!response.ok) {
          throw new Error("HTTPエラー：" + response.status);
        }
        return response.json();
      })
      .then(item => {

        // ▼ データがない場合
        if (!item || item.error) {
          content.innerHTML =
            `<div class="title">データがありません（pt=${pt}）</div>`;
          return;
        }

        // ▼ HTML表示
        content.innerHTML = `
        <img src="${item.icon}" class="icon" alt="${item.title}">
        <div class="title">［講座名］${escapeHtml(item.title)}</div>
        <div class="desc">${escapeHtml(item.desc).replace(/&lt;br&gt;/gi, "<br>")}<hr>
        <div class="course-id">［講座ID］${escapeHtml(item.courseId)}</div>
        <button class="cart-button" onclick="addToCart('${escapeHtml(item.courseId)}')"
        >カートに入れる</button>
        </div>
      `;        
    })
  
  // ==================================================
  // HTML特殊文字対策
  // ==================================================
    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

}
  </script>
</body>
</html>
