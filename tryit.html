<main>
  <!-- =============================== -->
  <!-- 有料講座（Productsシート連携） -->
  <!-- =============================== -->
  <section class="form-section card">
    <h2>こちらは、［有料講座お申込みフォーム］です</h2>
    <h2>有料講座申し込み前には［利用規約］をご確認ください</h2>

    <div class="section">
      <p>有料講座は、選択後「申し込む（購入へ進む）」ボタンを押すと料金徴収（Stripe決済）へ進みます。</p>

      <form id="paidForm">
        <label for="memberID">会員番号</label>
        <input type="text" id="memberID" name="memberID" required placeholder="（例）WKS0001">

        <label for="name">申込者氏名</label>
        <input type="text" id="name" name="name" required placeholder="日本　一郎">

        <label>希望講座名（有料）</label>
        <select id="paidCourse"></select>

        <div class="form-row terms-row">
          <input type="checkbox" id="agree" required>
          <label for="agree"><a href="terms.html" target="_blank">利用規約</a>に同意します</label>
        </div>

        <button type="button" class="btn" onclick="submitPaid()">申し込む（購入へ進む）</button>

        <p class="note">※決済完了後、案内ページ（mypage.html）へ戻ります。</p>
      </form>
    </div>
  </section>
</main>

<script>
// ===============================
// GAS URL設定（CORS対応済み）
// ===============================
const MAIN_GAS_URL = "https://script.google.com/macros/s/AKfycbxYW6KEyjFyMUZCkoHIg-h7z0cc6VkL21oOxdqPBKSycHTB91d5aeBBTsG7I4ZyGoRh/exec";
const STRIPE_GAS_URL = "https://script.google.com/macros/s/AKfycbyntsbMK9mBNLNdA24x3AQTlrYcYQ2k7oFsbbsWbMncOH0ddJWwIdGKFlvcnn1sorISnw/exec";

// ===============================
// 会員番号チェック（MAIN_GAS）
// ===============================
function checkMember(memberID) {
  return fetch(`${MAIN_GAS_URL}?memberID=${memberID}`)
    .then(res => res.json());
}

// ===============================
// Products JSON（GET）
// ===============================
fetch(STRIPE_GAS_URL)
  .then(res => res.json())
  .then(data => {
    const select = document.getElementById("paidCourse");
    select.innerHTML = '<option value="">選択してください</option>';

    data.products.forEach(p => {
      if (p.active) {
        const opt = document.createElement("option");
        opt.value = p.price_id;
        opt.textContent = `${p.product_name}（${p.price}円）`;
        select.appendChild(opt);
      }
    });
  })
  .catch(err => {
    console.error("Products fetch error:", err);
    alert("商品情報の取得に失敗しました。\n" + err);
  });

// ===============================
// Stripe Checkout（POST）
// ===============================
function submitPaid() {
  const priceId  = document.getElementById("paidCourse").value;
  const memberID = document.getElementById("memberID").value;
  const name     = document.getElementById("name").value;

  if (!priceId || !memberID) {
    alert("会員番号と講座を選択してください");
    return;
  }

  // ① 会員番号チェック
  checkMember(memberID).then(result => {
    if (!result.valid) {
      alert("会員番号が存在しません");
      return;
    }

    const email = result.email;

    // ② Stripe決済へ進む
    fetch(STRIPE_GAS_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        price_id: priceId,
        memberID: memberID,
        email: email
      })
    })
      .then(res => res.json())
      .then(data => {
        if (data.url) {
          window.location.href = data.url; // Stripe Checkoutへ遷移
        } else {
          alert("決済処理に失敗しました。\n" + JSON.stringify(data));
        }
      })
      .catch(err => {
        console.error("通信エラー:", err);
        alert("通信エラー: " + err);
      });
  });
}
</script>
