<main>
  <section class="site-header">
    <h1>無料体験講座 お申込みのページ</h1>
    <p class="subtitle">［わくわく無料キャンペーン］特典として入会費・年会費が無料になります。</p>
  </section>

  <section class="form-section card">
    <h2>オンライン講座お申し込みフォーム</h2>
    <p id="formMessage" class="form-message"></p>

    <form id="form">
      <label for="name">申込者氏名</label>
      <input type="text" id="name" name="name" required placeholder="日本　一郎">

      <label for="kana">ふりがな</label>
      <input type="text" id="kana" name="kana" required placeholder="にほん　いちろう">

      <label for="email">メールアドレス</label>
      <input type="email" id="email" name="email" required placeholder="sample@gmail.com">

      <label for="tel">電話番号</label>
      <input type="text" id="tel" name="tel" required placeholder="01234567890">

      <label for="post">郵便番号</label>
      <input type="text" id="post" name="post" required placeholder="0123456">

      <label for="courseId">希望講座名</label>
      <select id="courseId" name="courseId" required>
        <option value="">選択してください</option>
        <option value="kssc00">Scratch体験講座（無料）</option>
      </select>

      <div class="form-row terms-row">
        <input type="checkbox" id="agree" name="agree" required>
        <label for="agree"><a href="terms.html" target="_blank">利用規約</a>に同意します</label>
      </div>

      <button type="submit"><b>無料体験講座</b>に申し込む</button>
      <button type="button" onclick="history.back()">前の画面に戻る</button>
    </form>

    <p id="msg"></p>
  </section>
</main>

<script>
// --------------------------------------------------
// ① MAIN_GAS（会員登録）
// --------------------------------------------------
const MAIN_GAS_URL = "https://script.google.com/macros/s/AKfycbyvFx7BkmdJ97I-kkU9ctb3sBBZyAPCJJsT-S1hGEDuNOwtl_55NvSeijeh7QgQPBu_/exec";


// --------------------------------------------------
// ② STRIPE_GAS（Checkout セッション生成）
// --------------------------------------------------
const STRIPE_GAS_URL = "https://script.google.com/macros/s/AKfycbwxIp68wBpg5SH0px2cqSQLy5HChgEuM618NHE3KvI-kVUPVQdWckL3Hp1Ov54n0N66Vg/exec";


document.getElementById("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const formData = Object.fromEntries(new FormData(e.target));

  document.getElementById("msg").innerText = "送信中…";

  try {
    // --------------------------------------------------
    // MAIN_GAS に送信（会員登録）
    // --------------------------------------------------
    const res = await fetch(MAIN_GAS_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(formData)
    });

    const json = await res.json();

    // 会員番号の表示
    if (json.memberId) {
      document.getElementById("formMessage").innerText =
        `［申込確認できました。ありがとうございました］\n` +
        `［あなたの会員番号は “${json.memberId}” です］`;
    }

    // --------------------------------------------------
    // Stripe Checkout を開始
    // --------------------------------------------------
    const stripeRes = await fetch(STRIPE_GAS_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        email: formData.email,
        priceId: "price_0000"   // ←あなたの priceId に変更
      })
    });

    const stripeJson = await stripeRes.json();

    if (stripeJson.url) {
      window.location.href = stripeJson.url;  // Stripe Checkoutへ移動
    } else {
      document.getElementById("msg").innerText =
        "Stripe Checkout の URL が取得できませんでした（GAS側のエラーの可能性）";
    }

  } catch (err) {
    document.getElementById("msg").innerText =
      "送信エラーが発生しました。時間をおいて再度お試しください。";
  }
});
</script>
