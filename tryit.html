<!-- ++++++++++++++++++++++++++++++++++++++++++++++++++ -->
<!-- わくわくプログラミング工房　平兵道 -->
<!-- tryit.html -->
<!-- courseId + productId + price 対応 -->
<!-- 会員番号確認 + Stripe決済連携 -->
<!-- ++++++++++++++++++++++++++++++++++++++++++++++++++ -->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>有料講座お申込みフォーム｜わくわくプログラミング工房</title>

<style>
/* ============================================================
   全体
   ============================================================ */
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 16px;
  font-family: "Yu Gothic", "Meiryo", sans-serif;
  background: linear-gradient( 135deg, #fff0fb, #f8eaff );
  color: #222;
}

/* ============================================================
   コンテナ（表示領域）
   ============================================================ */
.container { max-width: 720px; margin: 0 auto; }

/* ============================================================
   タイトル
   ============================================================ */
.title {
  background: #ffc8f2;
  border-radius: 8px;
  padding: 10px 14px;
  margin-bottom: 14px;
  font-size: 20px;
  font-weight: bold;
}

/* ============================================================
   カード
   ============================================================ */
.card {
  background: #fff;
  border-radius: 10px;
  padding: 18px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

/* ============================================================
   ラベル
   ============================================================ */
label {
  display: block;
  margin-top: 12px;
  font-size: 14px;
  font-weight: bold;
}

/* ============================================================
   入力
   ============================================================ */
input {
  width: 100%;
  margin-top: 5px;
  padding: 10px;
  border: 1px solid #ff8bcf;
  border-radius: 8px;
  background: #fff;
  font-size: 16px;
}

/* ============================================================
   ボタン
   ============================================================ */
button {
  border: none;
  border-radius: 8px;
  padding: 12px 18px;
  margin-top: 16px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

#checkBtn {
  background: #777;
  color: #fff;
}

#checkoutBtn {
  background: #e85ac0;
  color: #fff;
  width: 100%;
}

#checkoutBtn:disabled {
  background: #ccc;
  cursor: not-allowed;
}

/* ============================================================
   講座情報
   ============================================================ */
.courseInfo {
  margin-top: 14px;
  padding: 14px;
  border-radius: 8px;
  background: #fff8fd;
  border: 1px solid #ffc8f2;
}

/* ============================================================
   講座ID
   ============================================================ */
.courseId {
  font-size: 14px;
  color: #666;
}

/* ============================================================
   商品ID
   ============================================================ */
.productId {
  margin-top: 5px;
  font-size: 16px;
  font-weight: bold;
  color: #333;
}

/* ============================================================
   商品名
   ============================================================ */
.courseName {
  margin-top: 8px;
  font-size: 20px;
  font-weight: bold;
  color: #0000FF;
}

/* ============================================================
   料金
   ============================================================ */
.price {
  margin-top: 10px;
  font-size: 20px;
  font-weight: bold;
}

/* ============================================================
   ステータス
   ============================================================ */
.status {
  margin-top: 14px;
  padding: 10px;
  border-radius: 8px;
  background: #fafafa;
  white-space: pre-wrap;
}

/* ============================================================
   エラー
   ============================================================ */
.error {
  color: #d00000;
  font-weight: bold;
}

/* ============================================================
   OK
   ============================================================ */
.ok {
  color: #087a28;
  font-weight: bold;
}

/* ============================================================
   小さい説明
   ============================================================ */
.small {
  font-size: 12px;
  color: #666;
  margin-top: 8px;
}

/* ============================================================
   商品内容
   ============================================================ */
.productDetail {
  margin-top: 12px;
  padding: 10px;
  background: #ffffff;
  border-radius: 8px;
  border: 1px solid #dddddd;
  font-size: 14px;
  line-height: 1.7;
}
</style>
</head>

<body>

<div class="container">
  <!-- ========================================================
       タイトル
       ======================================================== -->
  <div class="title">有料講座お申込みフォーム</div>

  <div class="card">
    <!-- ======================================================
         選択された講座情報
         ====================================================== -->
    <div id="courseInfo" class="courseInfo" style="display:none;" >
      <!-- ----------------------------------------------
           講座ID
           ---------------------------------------------- -->
      <div id="courseIdDisplay" class="courseId" ></div>

      <!-- ----------------------------------------------
        商品ID
        ---------------------------------------------- -->
      <div id="productIdDisplay" class="productId"></div>

      <!-- ----------------------------------------------
           商品名
           ---------------------------------------------- -->
      <div id="courseNameDisplay" class="courseName" ></div>

      <!-- ----------------------------------------------
           商品内容
           ---------------------------------------------- -->
      <div id="productDetail" class="productDetail" ></div>

      <!-- ----------------------------------------------
           料金
           ---------------------------------------------- -->
      <div id="price" class="price"></div>

    </div>

    <!-- ======================================================
         会員番号
         ====================================================== -->
    <label for="memberID">会員番号</label>

    <input
      id="memberID"
      type="text"
      placeholder="（例）WKS0001"
      autocomplete="off"
    >

    <!-- ======================================================
         申込者氏名
         ====================================================== -->
    <label for="name">申込者氏名</label>
    <input
      id="name"
      type="text"
      placeholder="日本 一郎"
    >

    <!-- ======================================================
         メールアドレス
         ====================================================== -->
    <label for="email">メールアドレス</label>

    <input
      id="email"
      type="email"
      placeholder="example@gmail.com"
    >

    <!-- ======================================================
         会員情報確認
         ====================================================== -->
    <button type="button" id="checkBtn">会員情報を確認</button>

    <!-- ======================================================
         Stripe決済
         ====================================================== -->
    <button type="button" id="checkoutBtn" disabled>Stripeで決済へ進む</button>

    <!-- ======================================================
         状態表示
         ====================================================== -->
    <div id="status" class="status">講座情報を読み込んでいます...</div>

    <div class="small">※ 決済はStripeの安全な決済画面で行います。</div>

  </div>
</div>

<script>

// ============================================================
// API設定
// ============================================================
// MAIN_GAS_URL（会員番号を確認する）
// STRIPE_GAS_URL（Products取得・Stripe Checkout作成を行う）
// 2026/09/16　デプロイ確認　現在使用中のURL
// ============================================================
const MAIN_GAS_URL = "https://script.google.com/macros/s/AKfycbwFwU_HJBkvf_6bHJXDljKqMJqknIkKJHdhfoKTkLUDnKDMprohAtEK2WJLTJj3R_RR/exec";
const STRIPE_GAS_URL = "https://script.google.com/macros/s/AKfycbzmo9wxmSvSlspB2OryCGAnCdEixmogKq9S3T0rLcLYOrG4URPcg1QHdeNfJfnOyFBPYw/exec";

// ============================================================
// STEP 4
// URLパラメータ取得
// ============================================================
// 例:tryit.html?courseId=SC01&productId=KS&price=1200
// courseId  = SC01
// productId = KS
// price     = 1200
// ============================================================
const urlParams =
  new URLSearchParams(
    window.location.search
  );

// ------------------------------------------------------------
// 講座ID
// ------------------------------------------------------------
const courseId =
  String(
    urlParams.get("courseId") || ""
  )
  .trim()
  .toUpperCase();

// ------------------------------------------------------------
// 商品ID
// ------------------------------------------------------------
const productId =
  String(
    urlParams.get("productId") || ""
  )
  .trim()
  .toUpperCase();

// ------------------------------------------------------------
// URLから渡された価格
// ------------------------------------------------------------
const urlPrice =
  Number(
    urlParams.get("price")
  );

// ============================================================
// DOM
// ============================================================
const courseInfo =
  document.getElementById(
    "courseInfo"
  );

const courseIdDisplay =
  document.getElementById(
    "courseIdDisplay"
  );

const productIdDisplay =
  document.getElementById(
    "productIdDisplay"
  );

const courseNameDisplay =
  document.getElementById(
    "courseNameDisplay"
  );

const productDetail =
  document.getElementById(
    "productDetail"
  );

const priceElement =
  document.getElementById(
    "price"
  );

const memberIDInput =
  document.getElementById(
    "memberID"
  );

const nameInput =
  document.getElementById(
    "name"
  );

const emailInput =
  document.getElementById(
    "email"
  );

const checkBtn =
  document.getElementById(
    "checkBtn"
  );

const checkoutBtn =
  document.getElementById(
    "checkoutBtn"
  );

const statusElement =
  document.getElementById(
    "status"
  );

// ============================================================
// 商品情報
// ============================================================
let products = [];

// ------------------------------------------------------------
// 選択された商品
// ------------------------------------------------------------
let selectedProduct = null;

// ------------------------------------------------------------
// 会員確認済み
// ------------------------------------------------------------
let memberChecked = false;

// ============================================================
// 初期処理
// ============================================================
init();


// ============================================================
// 初期化
// ============================================================
function init() {

  // ----------------------------------------------------------
  // courseId確認
  // ----------------------------------------------------------
  if (!courseId) {
    setStatus(
      "講座IDが指定されていません。\n" +
      "URLを確認してください。",
      true
    );

    return;
  }

  // ----------------------------------------------------------
  // productId確認
  // ----------------------------------------------------------
  if (!productId) {
    setStatus(
      "販売商品IDが指定されていません。\n" +
      "KS / PS / KP のいずれかを選択してください。",
      true
    );

    return;
  }

  // ----------------------------------------------------------
  // productId確認
  // ----------------------------------------------------------
  if (
    productId !== "KS" &&
    productId !== "PS" &&
    productId !== "KP"
  ) {

    setStatus(
      "販売商品IDが正しくありません。\n" +
      "productId：" +
      productId,
      true
    );

    return;
  }

  // ----------------------------------------------------------
  // price確認
  // ----------------------------------------------------------
  if (
    !Number.isFinite(urlPrice) ||
    urlPrice <= 0
  ) {

    setStatus(

      "料金情報が正しくありません。\n" +
      "price：" +
      urlParams.get("price"),

      true

    );

    return;

  }

  // ----------------------------------------------------------
  // URLから受け取った情報を一旦表示
  // ----------------------------------------------------------
  courseIdDisplay.textContent =
    "講座ID：" +
    courseId;


  productIdDisplay.textContent =
    "販売商品ID：" +
    productId;

  priceElement.textContent =
    "料金：" +
    formatPrice(urlPrice) +
    "円";

  // ----------------------------------------------------------
  // Products取得
  // ----------------------------------------------------------
  loadProducts();

}

// ============================================================
// Products取得
// ============================================================
function loadProducts() {

  // ----------------------------------------------------------
  // URL確認
  // ----------------------------------------------------------

  if (
    !STRIPE_GAS_URL ||
    STRIPE_GAS_URL.indexOf("ここに") !== -1
  ) {

    setStatus(

      "STRIPE_GASのウェブアプリURLを設定してください。",

      true

    );
    return;

  }

  setStatus(
    "選択された講座の商品情報を確認しています..."
  );

  // ==========================================================
  // STRIPE_GASからProducts取得
  // ==========================================================
  fetch(

    STRIPE_GAS_URL +
    "?getProducts=1"

  )

  .then(
    async response => {


      const text =
        await response.text();

      console.log(
        "Products RAW:",
        text
      );

      let json;

      try {

        json =
          JSON.parse(text);

      }

      catch (error) {

        throw new Error(
          "Products情報がJSONを返していません。"
        );
      }

      if (!response.ok) {

        throw new Error(
          "HTTPエラー：" +
          response.status
        );

      }

      return json;
    }

  )


  .then(
    json => {

      console.log(
        "Products:",
        json
      );

      // ------------------------------------------------------
      // APIエラー
      // ------------------------------------------------------
      if (!json.success) {
        throw new Error(
          json.error ||
          "商品情報を取得できませんでした。"
        );

      }

      // ------------------------------------------------------
      // Products配列
      // ------------------------------------------------------
      products =
        Array.isArray(
          json.products
        )

          ? json.products

          : [];

      // ------------------------------------------------------
      // active商品のみ
      // ------------------------------------------------------
      products =
        products.filter(
          product =>
            isActive(
              product.active
            )
        );

      // ======================================================
      // STEP 4
      // courseId + productId の両方で検索
      // ======================================================
      //
      // ここが今回の重要な変更です。
      //
      // SC01だけではなく、
      //
      // SC01 + KS
      // SC01 + PS
      // SC01 + KP
      //
      // を区別します。
      // ======================================================

      selectedProduct =
        products.find(
          product => {


            const productCourseId =

              String(
                product.courseId ||
                product.course_id ||
                ""
              )
              .trim()
              .toUpperCase();


            const productProductId =

              String(
                product.productId ||
                product.product_id ||
                ""
              )
              .trim()
              .toUpperCase();


            return (

              productCourseId ===
              courseId

              &&

              productProductId ===
              productId

            );

          }

        )
        || null;


      // ------------------------------------------------------
      // 該当商品がない
      // ------------------------------------------------------
      if (!selectedProduct) {
        courseInfo.style.display =
          "none";

        throw new Error(

          "指定された商品がProductsシートにありません。\n" +

          "courseId：" +
          courseId +

          "\n" +

          "productId：" +
          productId

        );

      }

      // ======================================================
      // Productsシートの価格
      // ======================================================
      const sheetPrice =

        Number(
          selectedProduct.price
        );

      // ------------------------------------------------------
      // Productsの価格確認
      // ------------------------------------------------------
      if (
        !Number.isFinite(sheetPrice) ||
        sheetPrice <= 0
      ) {

        throw new Error(

          "Productsシートの価格が正しくありません。\n" +

          "courseId：" +
          courseId +

          "\n" +

          "productId：" +
          productId

        );

      }

      // ======================================================
      // URLのpriceとProductsのpriceを比較
      // ======================================================
      // URLを書き換えて料金を変更されることを防ぐため、
      // Productsシートの価格を正式な価格として使用します。
      // ======================================================
      if (
        sheetPrice !== urlPrice
      ) {

        console.error(
          "価格不一致",
          {
            urlPrice:
              urlPrice,

            sheetPrice:
              sheetPrice
          }
        );


        throw new Error(

          "料金情報が一致しません。\n" +

          "URL料金：" +
          formatPrice(urlPrice) +
          "円\n" +

          "Products料金：" +
          formatPrice(sheetPrice) +
          "円"

        );

      }

      // ------------------------------------------------------
      // 講座情報表示
      // ------------------------------------------------------
      displayCourse();

      // ------------------------------------------------------
      // 会員番号入力を促す
      // ------------------------------------------------------
      setStatus(

        "講座情報を確認しました。\n" +

        "会員番号を入力して「会員情報を確認」を押してください。"

      );

    }

  )

  .catch(
    error => {

      console.error(
        "Products取得エラー：",
        error
      );

      setStatus(

        "講座情報の取得に失敗しました。\n" +

        error.message,

        true

      );
    }

  );

}

// ============================================================
// 講座情報表示
// ============================================================
function displayCourse() {

  if (!selectedProduct) {

    return;

  }

  courseInfo.style.display =
    "block";

  // ----------------------------------------------------------
  // 講座ID
  // ----------------------------------------------------------
  courseIdDisplay.textContent =

    "講座ID：" +

    (

      selectedProduct.courseId ||

      selectedProduct.course_id ||

      courseId

    );


  // ----------------------------------------------------------
  // 商品ID
  // ----------------------------------------------------------
  productIdDisplay.textContent =

    "販売商品ID：" +

    (

      selectedProduct.productId ||

      selectedProduct.product_id ||

      productId

    );


  // ----------------------------------------------------------
  // 商品名
  // ----------------------------------------------------------
  courseNameDisplay.textContent =

    selectedProduct.product_name ||

    selectedProduct.productName ||

    "商品名未設定";


  // ----------------------------------------------------------
  // 商品タイプ
  // ----------------------------------------------------------
  const productType =

    selectedProduct.product_type ||

    selectedProduct.productType ||

    "";


  let typeText = "";

  if (productType === "video") {

    typeText =
      "動画教材";

  }

  else if (productType === "pdf") {

    typeText =
      "PDF教材";

  }

  else if (productType === "both") {

    typeText =
      "動画＋PDF教材";

  }

  else if (productType) {

    typeText =
      productType;

  }

  if (typeText) {

    productDetail.textContent =
      "教材：" +
      typeText;

  }

  else {

    productDetail.textContent =
      "";

  }

  // ----------------------------------------------------------
  // Productsシートの価格を表示
  // ----------------------------------------------------------
  priceElement.textContent =

    "料金：" +

    formatPrice(
      selectedProduct.price
    ) +

    "円";


}

// ============================================================
// 会員情報確認ボタン
// ============================================================
checkBtn.addEventListener(
  "click",
  checkMember
);

// ============================================================
// 会員情報確認
// ============================================================
function checkMember() {


  const memberID =
    memberIDInput.value
      .trim();

  // ----------------------------------------------------------
  // 会員番号入力確認
  // ----------------------------------------------------------

  if (!memberID) {

    setStatus(

      "会員番号を入力してください。",

      true

    );

    return;

  }

  // 会員番号＋氏名＋メールアドレスを
  // MAIN_GASへ送信して本人確認します。
  const name =
    nameInput.value
      .trim();

  const email =
    emailInput.value
      .trim();


  if (!name) {

    setStatus(
      "申込者氏名を入力してください。",
      true
    );

    return;

  }


  if (!email) {

    setStatus(
      "メールアドレスを入力してください。",
      true
    );

    return;

  }


  setStatus(
    "会員情報を確認しています..."
  );

  memberChecked =
    false;


  checkoutBtn.disabled =
    true;

  // ==========================================================
  // MAIN_GASへ会員情報を送信
  // ==========================================================
  // でMAIN_GAS側を、会員番号＋氏名＋メールアドレスで確認する方式へ変更します。
  // 認証キーはtryit.htmlから送信しません。
  // ==========================================================
  fetch(

    MAIN_GAS_URL +
    "?verifyPurchase=1" +
    "&memberID=" +
    encodeURIComponent(memberID) +
    "&name=" +
    encodeURIComponent(name) +
    "&email=" +
    encodeURIComponent(email)

  )


  .then(
    async response => {


      const text =
        await response.text();


      console.log(
        "MAIN RAW:",
        text
      );


      let json;


      try {

        json =
          JSON.parse(text);

      }


      catch (error) {

        throw new Error(
          "会員情報APIがJSONを返していません。"
        );

      }


      if (!response.ok) {

        throw new Error(
          "HTTPエラー：" +
          response.status
        );

      }


      return json;

    }

  )


  .then(
    json => {


      console.log(
        "Member:",
        json
      );


      // ------------------------------------------------------
      // 会員番号が存在しない
      // ------------------------------------------------------
      if (!json.valid || json.authenticated === false) {

        throw new Error(

          json.error ||

          "会員番号・氏名・メールアドレスが正しくありません。"

        );

      }

      // ------------------------------------------------------
      // 名前
      // ------------------------------------------------------
      if (json.name) {

        nameInput.value =
          json.name;

      }

      // ------------------------------------------------------
      // メール
      // ------------------------------------------------------
      if (json.email) {

        emailInput.value =
          json.email;

      }

      // ------------------------------------------------------
      // 会員確認済み
      // ------------------------------------------------------
      memberChecked =
        true;

      // ------------------------------------------------------
      // Stripe決済ボタンを有効化
      // ------------------------------------------------------
      checkoutBtn.disabled =
        !(
          memberChecked &&
          selectedProduct
        );

      // ------------------------------------------------------
      // 確認結果表示
      // ------------------------------------------------------
      setStatus(

        "会員情報を確認しました。\n" +

        "お名前：" +
        (json.name || "") +

        "\n" +

        "メール：" +
        (json.email || "") +

        "\n\n" +

        "講座ID：" +
        courseId +

        "\n" +

        "販売商品ID：" +
        productId +

        "\n" +

        "料金：" +
        formatPrice(
          selectedProduct.price
        ) +
        "円" +

        "\n\n" +

        "内容を確認して「Stripeで決済へ進む」を押してください。",

        false,

        true

      );

    }

  )

  .catch(
    error => {


      console.error(
        "会員情報確認エラー：",
        error
      );

      checkoutBtn.disabled =
        true;


      setStatus(

        error.message,

        true

      );

    }

  );

}

// ============================================================
// Stripe Checkoutボタン
// ============================================================
checkoutBtn.addEventListener(
  "click",
  startCheckout
);


// ============================================================
// Stripe Checkout開始
// ============================================================
function startCheckout() {

  // ----------------------------------------------------------
  // 会員確認チェック
  // ----------------------------------------------------------
  if (!memberChecked) {

    alert(
      "先に会員情報を確認してください。"
    );

    return;

  }

  // ----------------------------------------------------------
  // 商品チェック
  // ----------------------------------------------------------
  if (!selectedProduct) {

    alert(
      "講座情報が取得できていません。"
    );

    return;

  }

  // ----------------------------------------------------------
  // 会員番号
  // ----------------------------------------------------------
  const memberID =

    memberIDInput.value
      .trim();


  // ----------------------------------------------------------
  // 名前
  // ----------------------------------------------------------
  const name =

    nameInput.value
      .trim();

  // ----------------------------------------------------------
  // メール
  // ----------------------------------------------------------
  const email =
    emailInput.value
      .trim();


  // ----------------------------------------------------------
  // 必須チェック
  // ----------------------------------------------------------
  if (
    !memberID ||
    !email
  ) {

    alert(
      "会員番号とメールアドレスを確認してください。"
    );

    return;

  }

  // ==========================================================
  // Productsシートの正式な情報を取得
  // ==========================================================
  const finalCourseId =
    String(

      selectedProduct.courseId ||

      selectedProduct.course_id ||

      courseId

    )
    .trim()
    .toUpperCase();

  const finalProductId =
    String(

      selectedProduct.productId ||

      selectedProduct.product_id ||

      productId

    )
    .trim()
    .toUpperCase();


  const finalPrice =
    Number(
      selectedProduct.price
    );


  const finalPriceId =
    String(

      selectedProduct.price_id ||

      selectedProduct.priceId ||

      ""

    )
    .trim();

  // ----------------------------------------------------------
  // price_id確認
  // ----------------------------------------------------------
  if (!finalPriceId) {
    alert(

      "Stripe Price IDが取得できません。\n" +

      "Productsシートを確認してください。"

    );

    return;

  }

  // ----------------------------------------------------------
  // 金額確認
  // ----------------------------------------------------------
  if (
    !Number.isFinite(finalPrice) ||
    finalPrice <= 0
  ) {

    alert(
      "料金情報が正しくありません。"
    );

    return;

  }

  // ----------------------------------------------------------
  // ボタン無効化
  // ----------------------------------------------------------
  checkoutBtn.disabled =
    true;

  setStatus(
    "Stripe決済画面を準備しています..."
  );

  // ==========================================================
  // STRIPE_GASへ送信
  // ==========================================================
  // course_id
  // product_id
  // price
  // price_id
  // memberID
  // name
  // email
  //
  // を送信します。
  //
  // STRIPE_GAS側では、
  // course_id + product_id
  // を使ってProductsシートを確認します。
  // ==========================================================
  const requestData = {

    // --------------------------------------------------------
    // 講座ID
    // --------------------------------------------------------
    course_id:
      finalCourseId,

    // --------------------------------------------------------
    // 販売商品ID
    // --------------------------------------------------------

    product_id:
      finalProductId,

    // --------------------------------------------------------
    // 税込価格
    // --------------------------------------------------------
    price:
      finalPrice,

    // --------------------------------------------------------
    // Stripe Price ID
    // --------------------------------------------------------
    price_id:
      finalPriceId,


    // --------------------------------------------------------
    // 会員番号
    // --------------------------------------------------------
    memberID:
      memberID,

    // --------------------------------------------------------
    // 申込者氏名
    // --------------------------------------------------------
    name:
      name,

    // --------------------------------------------------------
    // メールアドレス
    // --------------------------------------------------------

    email:
      email,

  };


  console.log(
    "Checkout REQUEST:",
    requestData
  );

  // ==========================================================
  // STRIPE_GASへPOST
  // ==========================================================
  fetch(
    STRIPE_GAS_URL,

    {

      method:
        "POST",


      headers: {

        "Content-Type":
          "text/plain;charset=utf-8"

      },

      body:

        JSON.stringify(
          requestData
        )

    }

  )

  .then(
    async response => {

      const text =
        await response.text();


      console.log(
        "Checkout RAW:",
        text
      );


      let json;

      try {

        json =
          JSON.parse(text);

      }


      catch (error) {

        throw new Error(
          "Checkout APIがJSONを返していません。"
        );

      }

      if (!response.ok) {

        throw new Error(

          "HTTPエラー：" +

          response.status

        );

      }


      return json;

    }

  )

  .then(
    json => {

      console.log(
        "Checkout:",
        json
      );

      // ------------------------------------------------------
      // API成功確認
      // ------------------------------------------------------
      if (!json.success) {
        throw new Error(

          json.error ||

          "決済画面を作成できませんでした。"

        );

      }

      // ------------------------------------------------------
      // Stripe URL確認
      // ------------------------------------------------------
      if (!json.url) {

        throw new Error(
          "Stripe Checkout URLがありません。"
        );

      }

      setStatus(
        "Stripe決済画面へ移動します..."
      );

      // ------------------------------------------------------
      // Stripe Checkoutへ移動
      // ------------------------------------------------------
      window.location.href =
        json.url;

    }

  )

  .catch(
    error => {


      console.error(
        "Checkout ERROR:",
        error
      );


      checkoutBtn.disabled =
        false;


      setStatus(

        "決済画面の作成に失敗しました。\n" +

        error.message,

        true

      );

    }

  );

}

// ============================================================
// active判定
// ============================================================
function isActive(value) {
  if (
    value === true
  ) {

    return true;

  }

  const s =

    String(
      value || ""
    )
    .trim()
    .toLowerCase();


  return (
    s === "true" ||

    s === "1" ||

    s === "yes" ||

    s === "販売中" ||

    s === "有効"

  );

}


// ============================================================
// 金額表示
// ============================================================
function formatPrice(value) {

  const n =
    Number(value);


  if (
    !Number.isFinite(n)
  ) {

    return "0";

  }

  return Math.round(n)
    .toLocaleString();

}

// ============================================================
// ステータス表示
// ============================================================
function setStatus(
  message,
  isError = false,
  isOk = false

) {


  statusElement.textContent =
    message;

  statusElement.className =
    "status"
    +
    (
      isError
        ? " error"
        : ""
    )
    +
    (
      isOk
        ? " ok"
        : ""
    );
}

</script>
