<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>やってみようのページ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      font-family: "Rounded Mplus 1c", sans-serif;
      background: #fdf6ff;
      padding: 20px;
      color: #444;
    }
    h2 {
      background: #ffccf5;
      padding: 10px 15px;
      border-radius: 10px;
      color: #333;
    }
    .section {
      margin-bottom: 30px;
      padding: 20px;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 0 8px rgba(0,0,0,0.1);
    }
    label {
      font-weight: bold;
      margin-bottom: 8px;
      display: block;
    }
    select, input {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 2px solid #ff99dd;
      font-size: 16px;
      background: #fff7fc;
      box-sizing: border-box;
    }
    .btn {
      display: block;
      width: 100%;
      margin-top: 20px;
      padding: 15px;
      background: #ff66c4;
      color: white;
      font-size: 18px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      font-weight: bold;
      text-align: center;
    }
    .btn:hover {
      background: #ff4fb8;
    }
    .note {
      margin-top: 10px;
      font-size: 14px;
      color: #666;
    }
  </style>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
  <div class="logo-box"><img src="images/logo.png" alt="ロゴ"></div>
  <div class="lang-switch">
    <a href="#ja" class="lang-btn">日本語</a>
    <a href="#en" class="lang-btn">English</a>
  </div>
  <nav class="menu ja">
    <a href="hello.html" class="btn">はじめまして</a>
    <a href="course.html" class="btn">なにがあるの</a>
    <a href="tryit.html" class="btn">やってみよう</a>
    <a href="faqans.html" class="btn">しつもんする</a>
    <a href="check.html" class="btn">かくにんする</a>
  </nav>
</header>

<main>

  <!-- =============================== -->
  <!-- 無料体験講座申込フォーム -->
  <!-- =============================== -->
  <section class="form-section card">
    <h2>特別会員様登録フォーム　兼　無料体験講座お申込みフォーム</h2>

    <form id="form">
      <label for="name">申込者氏名</label>
      <input type="text" id="name" name="name" required>

      <label for="kana">ふりがな</label>
      <input type="text" id="kana" name="kana" required>

      <label for="email">メールアドレス</label>
      <input type="email" id="email" name="email" required>

      <label for="tel">電話番号</label>
      <input type="text" id="tel" name="tel" required>

      <label for="post">郵便番号</label>
      <input type="text" id="post" name="post" required>

      <label for="trialCourse">希望講座名（無料）</label>
      <select id="trialCourse" name="trialCourse" required>
        <option value="">選択してください</option>
        <option value="kssc00">Scratch体験講座（無料）</option>
      </select>

      <div class="form-row terms-row">
        <input type="checkbox" id="agree" name="agree" required>
        <label for="agree"><a href="terms.html" target="_blank">利用規約</a>に同意します</label>
      </div>

      <button type="submit" class="btn">無料体験講座に申し込む</button>
    </form>
  </section>

  <!-- =============================== -->
  <!-- 有料講座（Productsシート連携） -->
  <!-- =============================== -->
  <h2>有料講座（自動生成）</h2>
  <div class="section">
    <p>有料講座は、選択後「申し込む（購入へ進む）」ボタンを押すと Stripe 決済へ進みます。</p>

    <form id="paidForm">
      <label>希望講座名（有料）</label>
      <select id="paidCourse"></select>

      <button type="button" class="btn" onclick="submitPaid()">申し込む（購入へ進む）</button>

      <p class="note">※決済完了後、案内ページ（mypage.html）へ戻ります。</p>
    </form>
  </div>

</main>

<script>
// --------------------------------------------------
// GAS URL設定（あなたの環境に合わせて）
// --------------------------------------------------
const STRIPE_GAS_URL = "https://script.google.com/macros/s/AKfycbyy9wyD6m6S8QVgftf1WihUj8PV0YmynaXE7d2zxJRhiWZAFHxdZRw6Mq_lK3Jde88/exec";

// --------------------------------------------------
// Products シート → JSON を読み込む
// --------------------------------------------------
fetch(STRIPE_GAS_URL)
  .then(res => res.json())
  .then(data => {
    console.log("Products JSON:", data);
    const select = document.getElementById("paidCourse");
    select.innerHTML = '<option value="">選択してください</option>';

    data.products.forEach(p => {
      if (p.active) {
        const opt = document.createElement("option");
        opt.value = p.price_id;
        opt.textContent = `${p.product_name}（${p.price}円）`;
        select.appendChild(opt);
      }
    });
  })
  .catch(err => console.error("Products fetch error:", err));

// --------------------------------------------------
// Stripe Checkout（doPostCheckout へ POST）
// --------------------------------------------------
function submitPaid() {
  const priceId = document.getElementById("paidCourse").value;
  const email = document.getElementById("email").value;

  if (!priceId) {
    alert("有料講座を選択してください");
    return;
  }

  fetch(STRIPE_GAS_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ price_id: priceId, email: email })
  })
  .then(res => res.json())
  .then(data => {
    console.log("Checkout Response:", data);
    if (data.url && !data.url.startsWith("Stripeエラー")) {
      window.location.href = data.url;
    } else {
      alert("決済ページの取得に失敗しました\n" + (data.error || data.url));
    }
  })
  .catch(err => alert("通信エラー: " + err));
}
</script>
