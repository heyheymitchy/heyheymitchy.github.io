<!-- ++++++++++++++++++++++++++++++++++++++++++++++++++ -->
<!-- わくわくプログラミング工房 平兵道 -->
<!-- tryit.html（courseId対応・会員番号チェック・Stripe決済連携 完全版） -->
<!-- ++++++++++++++++++++++++++++++++++++++++++++++++++ -->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>
<title>有料講座お申込みフォーム｜わくわくプログラミング工房</title>
<style>

/* ============================================================
   全体
   ============================================================ */
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 16px;
  font-family:
    "Yu Gothic",
    "Meiryo",
    sans-serif;

  background:
    linear-gradient(
      135deg,
      #fff0fb,
      #f8eaff
    );

  color: #222;
}


/* ============================================================
   コンテナ
   ============================================================ */
.container {
  max-width: 720px;
  margin: 0 auto;
}


/* ============================================================
   タイトル
   ============================================================ */
.title {
  background: #ffc8f2;
  border-radius: 8px;
  padding: 10px 14px;
  margin-bottom: 14px;
  font-size: 20px;
  font-weight: bold;

}


/* ============================================================
   カード
   ============================================================ */

.card {

  background: #fff;

  border-radius: 10px;

  padding: 18px;

  box-shadow:
    0 2px 8px rgba(0,0,0,0.08);

}


/* ============================================================
   ラベル
   ============================================================ */

label {

  display: block;

  margin-top: 12px;

  font-size: 14px;

  font-weight: bold;

}


/* ============================================================
   入力・選択
   ============================================================ */

input,
select {

  width: 100%;

  margin-top: 5px;

  padding: 10px;

  border: 1px solid #ff8bcf;

  border-radius: 8px;

  background: #fff;

  font-size: 16px;

}


/* ============================================================
   ボタン
   ============================================================ */

button {

  border: none;

  border-radius: 8px;

  padding: 12px 18px;

  margin-top: 16px;

  font-size: 16px;

  font-weight: bold;

  cursor: pointer;

}


#checkBtn {

  background: #777;

  color: #fff;

}


#checkoutBtn {

  background: #e85ac0;

  color: #fff;

  width: 100%;

}


#checkoutBtn:disabled {

  background: #ccc;

  cursor: not-allowed;

}


/* ============================================================
   ステータス
   ============================================================ */

.status {

  margin-top: 14px;

  padding: 10px;

  border-radius: 8px;

  background: #fafafa;

  white-space: pre-wrap;

}


.error {

  color: #d00000;

  font-weight: bold;

}


.ok {

  color: #087a28;

  font-weight: bold;

}


/* ============================================================
   講座情報
   ============================================================ */

.courseInfo {

  margin-top: 14px;

  padding: 14px;

  border-radius: 8px;

  background: #fff8fd;

  border: 1px solid #ffc8f2;

}


.courseId {

  font-size: 13px;

  color: #666;

}


.courseName {

  margin-top: 5px;

  font-size: 20px;

  font-weight: bold;

  color: #0000FF;

}


.price {

  margin-top: 10px;

  font-size: 17px;

  font-weight: bold;

}


.small {

  font-size: 12px;

  color: #666;

  margin-top: 8px;

}

</style>

</head>


<body>


<div class="container">


  <!-- ========================================================
       タイトル
       ======================================================== -->

  <div class="title">

    有料講座お申込みフォーム

  </div>


  <div class="card">


    <!-- ======================================================
         講座情報
         ====================================================== -->

    <div
      id="courseInfo"
      class="courseInfo"
      style="display:none;"
    >

      <div
        id="courseIdDisplay"
        class="courseId"
      ></div>


      <div
        id="courseNameDisplay"
        class="courseName"
      ></div>


      <div
        id="price"
        class="price"
      ></div>

    </div>


    <!-- ======================================================
         会員番号
         ====================================================== -->

    <label for="memberID">

      会員番号

    </label>


    <input
      id="memberID"
      type="text"
      placeholder="（例）WKS0001"
      autocomplete="off"
    >


    <button
      type="button"
      id="checkBtn"
    >

      会員情報を確認

    </button>


    <!-- ======================================================
         申込者氏名
         ====================================================== -->

    <label for="name">

      申込者氏名

    </label>


    <input
      id="name"
      type="text"
      placeholder="日本 一郎"
    >


    <!-- ======================================================
         メールアドレス
         ====================================================== -->

    <label for="email">

      メールアドレス

    </label>


    <input
      id="email"
      type="email"
      placeholder="example@gmail.com"
    >


    <!-- ======================================================
         Stripe決済
         ====================================================== -->

    <button
      type="button"
      id="checkoutBtn"
      disabled
    >

      Stripeで決済へ進む

    </button>


    <!-- ======================================================
         状態表示
         ====================================================== -->

    <div
      id="status"
      class="status"
    >

      講座情報を読み込んでいます...

    </div>


    <div class="small">

      ※ 決済はStripeの安全な決済画面で行います。

    </div>


  </div>


</div>


<script>


// ============================================================
// API設定
// ============================================================
//
// MAIN_GAS_URL
// 会員番号を確認するMAIN_GAS
//
// STRIPE_GAS_URL
// Products取得・Stripe Checkout作成を行うSTRIPE_GAS
//
// 最新デプロイURLに差し替えること20260911
// ============================================================
const MAIN_GAS_URL = "https://script.google.com/macros/s/AKfycbz0yOo4gU4amN7e9CLYp4qafcnuHd3dqNV7-0D9387UKX7b0zsq9IcL5eb2G5f8ngkG/exec";
const STRIPE_GAS_URL = "https://script.google.com/macros/s/AKfycbwCpfRDO5Wsp2cZ946fvvDzxnkTEddZvVlEENPo1ZDAFcPUiUmTxoqZ03u8_sLymqULhg/exec";

// ============================================================
// URLからcourseIdを取得
// ============================================================
//
// 例：
//
// tryit.html?courseId=SC01
//
// ↓
//
// courseId = "SC01"
//
// ============================================================


const urlParams =
  new URLSearchParams(
    window.location.search
  );


const courseId =
  urlParams.get("courseId");



// ============================================================
// DOM
// ============================================================


const courseInfo =
  document.getElementById(
    "courseInfo"
  );


const courseIdDisplay =
  document.getElementById(
    "courseIdDisplay"
  );


const courseNameDisplay =
  document.getElementById(
    "courseNameDisplay"
  );


const priceElement =
  document.getElementById(
    "price"
  );


const memberIDInput =
  document.getElementById(
    "memberID"
  );


const nameInput =
  document.getElementById(
    "name"
  );


const emailInput =
  document.getElementById(
    "email"
  );


const checkBtn =
  document.getElementById(
    "checkBtn"
  );


const checkoutBtn =
  document.getElementById(
    "checkoutBtn"
  );


const statusElement =
  document.getElementById(
    "status"
  );



// ============================================================
// 商品情報
// ============================================================


let products = [];

let selectedProduct = null;

let memberChecked = false;



// ============================================================
// 初期処理
// ============================================================


init();



// ============================================================
// 初期化
// ============================================================


function init() {


  // ----------------------------------------------------------
  // courseIdがURLにない場合
  // ----------------------------------------------------------

  if (!courseId) {

    setStatus(
      "講座IDが指定されていません。\n" +
      "URLを確認してください。",
      true
    );

    return;

  }


  // ----------------------------------------------------------
  // courseIdを画面に表示
  // ----------------------------------------------------------

  courseIdDisplay.textContent =
    "講座ID：" + courseId;


  // ----------------------------------------------------------
  // Products取得
  // ----------------------------------------------------------

  loadProducts();

}



// ============================================================
// Products取得
// ============================================================


function loadProducts() {


  if (
    !STRIPE_GAS_URL ||
    STRIPE_GAS_URL.indexOf("ここに") !== -1
  ) {

    setStatus(
      "STRIPE_GASのウェブアプリURLを設定してください。",
      true
    );

    return;

  }


  setStatus(
    "講座情報を読み込み中..."
  );


  fetch(
    STRIPE_GAS_URL +
    "?getProducts=1"
  )


  .then(
    async response => {


      const text =
        await response.text();


      let json;


      try {

        json =
          JSON.parse(text);

      }


      catch (error) {

        console.error(
          "Products RAW:",
          text
        );


        throw new Error(
          "Products情報がJSONを返していません。"
        );

      }


      if (!response.ok) {

        throw new Error(
          "HTTPエラー: " +
          response.status
        );

      }


      return json;

    }
  )


  .then(
    json => {


      console.log(
        "Products:",
        json
      );


      if (!json.success) {

        throw new Error(
          json.error ||
          "商品情報を取得できませんでした。"
        );

      }


      products =
        Array.isArray(
          json.products
        )
          ? json.products
          : [];


      // ------------------------------------------------------
      // activeの商品だけを対象にする
      // ------------------------------------------------------

      products =
        products.filter(
          product =>
            isActive(
              product.active
            )
        );


      // ------------------------------------------------------
      // URLのcourseIdと一致する商品を検索
      //
      // Productsシートのcourse_idを使用
      // ------------------------------------------------------

      selectedProduct =
        products.find(
          product =>
            String(
              product.course_id || ""
            ).trim() ===
            String(
              courseId
            ).trim()
        )
        || null;


      // ------------------------------------------------------
      // 講座が見つからない場合
      // ------------------------------------------------------

      if (!selectedProduct) {

        courseInfo.style.display =
          "none";


        throw new Error(
          "指定された講座がProductsシートにありません。\n" +
          "courseId：" +
          courseId
        );

      }


      // ------------------------------------------------------
      // 講座情報を表示
      // ------------------------------------------------------

      displayCourse();


      // ------------------------------------------------------
      // 会員番号入力を促す
      // ------------------------------------------------------

      setStatus(
        "講座情報を確認しました。\n" +
        "会員番号を入力して「会員情報を確認」を押してください。",
        false
      );

    }
  )


  .catch(
    error => {


      console.error(
        "Products取得エラー:",
        error
      );


      setStatus(
        "講座情報の取得に失敗しました。\n" +
        error.message,
        true
      );

    }
  );

}



// ============================================================
// 講座情報表示
// ============================================================


function displayCourse() {


  if (!selectedProduct) {

    return;

  }


  courseInfo.style.display =
    "block";


  courseIdDisplay.textContent =
    "講座ID：" +
    (
      selectedProduct.course_id ||
      courseId
    );


  courseNameDisplay.textContent =
    selectedProduct.product_name ||
    selectedProduct.course_name ||
    "講座名未設定";


  priceElement.textContent =
    "料金：" +
    formatPrice(
      selectedProduct.price
    ) +
    "円";

}



// ============================================================
// 会員情報確認
// ============================================================


checkBtn.addEventListener(
  "click",
  checkMember
);



function checkMember() {


  const memberID =
    memberIDInput.value
      .trim();


  if (!memberID) {

    setStatus(
      "会員番号を入力してください。",
      true
    );

    return;

  }


  setStatus(
    "会員情報を確認しています..."
  );


  memberChecked =
    false;


  checkoutBtn.disabled =
    true;


  fetch(
    MAIN_GAS_URL +
    "?memberID=" +
    encodeURIComponent(
      memberID
    )
  )


  .then(
    async response => {


      const text =
        await response.text();


      let json;


      try {

        json =
          JSON.parse(text);

      }


      catch (error) {

        console.error(
          "MAIN RAW:",
          text
        );


        throw new Error(
          "会員情報APIがJSONを返していません。"
        );

      }


      if (!response.ok) {

        throw new Error(
          "HTTPエラー: " +
          response.status
        );

      }


      return json;

    }
  )


  .then(
    json => {


      console.log(
        "Member:",
        json
      );


      if (!json.valid) {

        throw new Error(
          json.error ||
          "会員番号が見つかりません。"
        );

      }


      // ------------------------------------------------------
      // 名前
      // ------------------------------------------------------

      if (json.name) {

        nameInput.value =
          json.name;

      }


      // ------------------------------------------------------
      // メール
      // ------------------------------------------------------

      if (json.email) {

        emailInput.value =
          json.email;

      }


      // ------------------------------------------------------
      // 会員確認済み
      // ------------------------------------------------------

      memberChecked =
        true;


      // ------------------------------------------------------
      // 決済ボタン
      // ------------------------------------------------------

      checkoutBtn.disabled =
        !(
          memberChecked &&
          selectedProduct
        );


      setStatus(
        "会員情報を確認しました。\n" +
        "お名前：" +
        (json.name || "") +
        "\n" +
        "メール：" +
        (json.email || "") +
        "\n\n" +
        "内容を確認して「Stripeで決済へ進む」を押してください。",
        false,
        true
      );

    }
  )


  .catch(
    error => {


      console.error(
        "会員情報確認エラー:",
        error
      );


      checkoutBtn.disabled =
        true;


      setStatus(
        error.message,
        true
      );

    }
  );

}



// ============================================================
// Checkout
// ============================================================


checkoutBtn.addEventListener(
  "click",
  startCheckout
);



function startCheckout() {


  // ----------------------------------------------------------
  // 会員確認チェック
  // ----------------------------------------------------------

  if (!memberChecked) {

    alert(
      "先に会員情報を確認してください。"
    );

    return;

  }


  // ----------------------------------------------------------
  // 商品チェック
  // ----------------------------------------------------------

  if (!selectedProduct) {

    alert(
      "講座情報が取得できていません。"
    );

    return;

  }


  // ----------------------------------------------------------
  // 会員番号
  // ----------------------------------------------------------

  const memberID =
    memberIDInput.value
      .trim();


  // ----------------------------------------------------------
  // メール
  // ----------------------------------------------------------

  const email =
    emailInput.value
      .trim();


  if (
    !memberID ||
    !email
  ) {

    alert(
      "会員番号とメールアドレスを確認してください。"
    );

    return;

  }


  // ----------------------------------------------------------
  // ボタン無効化
  // ----------------------------------------------------------

  checkoutBtn.disabled =
    true;


  setStatus(
    "Stripe決済画面を準備しています..."
  );


  // ==========================================================
  // STRIPE_GASへ送信するデータ
  // ==========================================================
  //
  // 今回から courseId も送信します。
  //
  // STEP 4のSTRIPE_GAS変更時に
  // このデータ構造と合わせます。
  //
  // ==========================================================


  const requestData = {


    // 講座ID
    course_id:
      courseId,


    // Stripe Price ID
    price_id:
      selectedProduct.price_id,


    // 会員番号
    memberID:
      memberID,


    // メールアドレス
    email:
      email

  };



  console.log(
    "Checkout REQUEST:",
    requestData
  );



  // ==========================================================
  // STRIPE_GASへPOST
  // ==========================================================


  fetch(
    STRIPE_GAS_URL,
    {

      method:
        "POST",


      headers: {

        "Content-Type":
          "text/plain;charset=utf-8"

      },


      body:
        JSON.stringify(
          requestData
        )

    }
  )


  .then(
    async response => {


      const text =
        await response.text();


      console.log(
        "Checkout RAW:",
        text
      );


      let json;


      try {

        json =
          JSON.parse(text);

      }


      catch (error) {

        throw new Error(
          "Checkout APIがJSONを返していません。"
        );

      }


      if (!response.ok) {

        throw new Error(
          "HTTPエラー: " +
          response.status
        );

      }


      return json;

    }
  )


  .then(
    json => {


      console.log(
        "Checkout:",
        json
      );


      if (!json.success) {

        throw new Error(
          json.error ||
          "決済画面を作成できませんでした。"
        );

      }


      if (!json.url) {

        throw new Error(
          "Stripe Checkout URLがありません。"
        );

      }


      setStatus(
        "Stripe決済画面へ移動します..."
      );


      window.location.href =
        json.url;

    }
  )


  .catch(
    error => {


      console.error(
        "Checkout ERROR:",
        error
      );


      checkoutBtn.disabled =
        false;


      setStatus(
        "決済画面の作成に失敗しました。\n" +
        error.message,
        true
      );

    }
  );

}



// ============================================================
// active判定
// ============================================================


function isActive(value) {


  if (
    value === true
  ) {

    return true;

  }


  const s =
    String(
      value || ""
    )
      .trim()
      .toLowerCase();


  return (

    s === "true" ||

    s === "1" ||

    s === "yes" ||

    s === "販売中" ||

    s === "有効"

  );

}



// ============================================================
// 金額表示
// ============================================================


function formatPrice(value) {


  const n =
    Number(value);


  if (
    !Number.isFinite(n)
  ) {

    return "0";

  }


  return Math.round(n)
    .toLocaleString();

}



// ============================================================
// ステータス表示
// ============================================================


function setStatus(
  message,
  isError = false,
  isOk = false
) {


  statusElement.textContent =
    message;


  statusElement.className =
    "status" +

    (
      isError
        ? " error"
        : ""
    ) +

    (
      isOk
        ? " ok"
        : ""
    );

}
</script>
</body>
</html>
