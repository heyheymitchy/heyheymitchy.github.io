<main>
  <section class="site-header">
    <h1>無料体験講座 お申込みのページ</h1>
    <p class="subtitle">［わくわく無料キャンペーン］特典として入会費・年会費が無料になります。</p>
  </section>

  <section class="form-section card">
    <h2>オンライン講座お申し込みフォーム</h2>
    <p id="formMessage" class="form-message"></p>

    <!-- ? IDを「form」に変更 -->
    <form id="form">
      <label for="name">申込者氏名</label>
      <input type="text" id="name" name="name" required placeholder="日本　一郎">

      <label for="kana">ふりがな</label>
      <input type="text" id="kana" name="kana" required placeholder="にほん　いちろう">

      <label for="email">メールアドレス</label>
      <input type="email" id="email" name="email" required placeholder="sample@gmail.com">

      <label for="tel">電話番号</label>
      <input type="text" id="tel" name="tel" required placeholder="01234567890">

      <label for="post">郵便番号</label>
      <input type="text" id="post" name="post" required placeholder="0123456">

      <label for="courseId">希望講座名</label>
      <select id="courseId" name="courseId" required>
        <option value="">選択してください</option>
        <option value="kssc00">Scratch体験講座（無料）</option>
      </select>

      <div class="form-row terms-row">
        <input type="checkbox" id="agree" name="agree" required>
        <label for="agree"><a href="terms.html" target="_blank">利用規約</a>に同意します</label>
      </div>

      <button type="submit"><b>無料体験講座</b>に申し込む</button>
      <button type="button" onclick="history.back()">前の画面に戻る</button>
    </form>

    <p id="msg"></p>
  </section>
</main>

<script>
const WORKER_URL = "https://f60a2577.member-awn.pages.dev";

document.getElementById("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const formData = new FormData(e.target);

  try {
    const res = await fetch(WORKER_URL, {
      method: "POST",
      body: formData
    });

    const json = await res.json();
    console.log("Worker → GAS 結果:", json);
    alert("送信成功！");
  } catch (err) {
    console.error("送信エラー:", err);
    alert("送信に失敗しました。時間をおいて再度お試しください。");
  }
});
</script>
