<!-- ++++++++++++++++++++++++++++++++++++++++++++++++++ -->
<!-- わくわくプログラミング工房　平兵道 -->
<!-- tryit.html -->
<!-- courseId + productId + price 対応 -->
<!-- 会員番号確認 + Stripe決済連携 -->
<!-- 完全修正版 -->
<!-- ++++++++++++++++++++++++++++++++++++++++++++++++++ -->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>
有料講座お申込みフォーム｜わくわくプログラミング工房
</title>

<style>

/* ============================================================
   全体
   ============================================================ */

* {
  box-sizing: border-box;
}

body {

  margin: 0;

  padding: 16px;

  font-family:
    "Yu Gothic",
    "Meiryo",
    sans-serif;

  background:
    linear-gradient(
      135deg,
      #fff0fb,
      #f8eaff
    );

  color: #222;

}


/* ============================================================
   コンテナ
   ============================================================ */

.container {

  max-width: 720px;

  margin: 0 auto;

}


/* ============================================================
   タイトル
   ============================================================ */

.title {

  background: #ffc8f2;

  border-radius: 8px;

  padding: 10px 14px;

  margin-bottom: 14px;

  font-size: 20px;

  font-weight: bold;

}


/* ============================================================
   カード
   ============================================================ */

.card {

  background: #fff;

  border-radius: 10px;

  padding: 18px;

  box-shadow:
    0 2px 8px rgba(0,0,0,0.08);

}


/* ============================================================
   ラベル
   ============================================================ */

label {

  display: block;

  margin-top: 12px;

  font-size: 14px;

  font-weight: bold;

}


/* ============================================================
   入力
   ============================================================ */

input {

  width: 100%;

  margin-top: 5px;

  padding: 10px;

  border:
    1px solid #ff8bcf;

  border-radius: 8px;

  background: #fff;

  font-size: 16px;

}


/* ============================================================
   ボタン
   ============================================================ */

button {

  border: none;

  border-radius: 8px;

  padding: 12px 18px;

  margin-top: 16px;

  font-size: 16px;

  font-weight: bold;

  cursor: pointer;

}


#checkBtn {

  background: #777;

  color: #fff;

}


#checkoutBtn {

  background: #e85ac0;

  color: #fff;

  width: 100%;

}


#checkoutBtn:disabled {

  background: #ccc;

  cursor: not-allowed;

}


/* ============================================================
   購入前注意
   ============================================================ */

.purchaseWarning {

  display: none;

  margin-top: 16px;

  padding: 14px;

  border:
    2px solid #e05a00;

  border-radius: 8px;

  background: #fff4e8;

  color: #7a2f00;

  line-height: 1.7;

}


.purchaseWarningTitle {

  font-size: 17px;

  font-weight: bold;

  margin-bottom: 8px;

}


.purchaseWarningText {

  white-space: pre-wrap;

}


.purchaseConfirm {

  margin-top: 12px;

  display: flex;

  align-items: flex-start;

  gap: 8px;

  font-weight: bold;

}


.purchaseConfirm input {

  width: auto;

  margin-top: 3px;

  transform: scale(1.2);

}


/* ============================================================
   講座情報
   ============================================================ */

.courseInfo {

  margin-top: 14px;

  padding: 14px;

  border-radius: 8px;

  background: #fff8fd;

  border:
    1px solid #ffc8f2;

}


/* ============================================================
   講座ID
   ============================================================ */

.courseId {

  font-size: 14px;

  color: #666;

}


/* ============================================================
   商品ID
   ============================================================ */

.productId {

  margin-top: 5px;

  font-size: 16px;

  font-weight: bold;

  color: #333;

}


/* ============================================================
   商品名
   ============================================================ */

.courseName {

  margin-top: 8px;

  font-size: 20px;

  font-weight: bold;

  color: #0000FF;

}


/* ============================================================
   料金
   ============================================================ */

.price {

  margin-top: 10px;

  font-size: 20px;

  font-weight: bold;

}


/* ============================================================
   ステータス
   ============================================================ */

.status {

  margin-top: 14px;

  padding: 10px;

  border-radius: 8px;

  background: #fafafa;

  white-space: pre-wrap;

  line-height: 1.6;

}


/* ============================================================
   エラー
   ============================================================ */

.error {

  color: #d00000;

  font-weight: bold;

}


/* ============================================================
   OK
   ============================================================ */

.ok {

  color: #087a28;

  font-weight: bold;

}


/* ============================================================
   小さい説明
   ============================================================ */

.small {

  font-size: 12px;

  color: #666;

  margin-top: 8px;

}


/* ============================================================
   商品内容
   ============================================================ */

.productDetail {

  margin-top: 12px;

  padding: 10px;

  background: #ffffff;

  border:
    1px solid #dddddd;

  border-radius: 8px;

  font-size: 14px;

  line-height: 1.7;

}

</style>

</head>


<body>


<div class="container">


  <!-- ========================================================
       タイトル
       ======================================================== -->

  <div class="title">
    有料講座お申込みフォーム
  </div>


  <div class="card">


    <!-- ======================================================
         選択された講座情報
         ====================================================== -->

    <div
      id="courseInfo"
      class="courseInfo"
      style="display:none;"
    >

      <div
        id="courseIdDisplay"
        class="courseId"
      ></div>


      <div
        id="productIdDisplay"
        class="productId"
      ></div>


      <div
        id="courseNameDisplay"
        class="courseName"
      ></div>


      <div
        id="productDetail"
        class="productDetail"
      ></div>


      <div
        id="price"
        class="price"
      ></div>

    </div>


    <!-- ======================================================
         購入前注意
         ====================================================== -->

    <div
      id="purchaseWarning"
      class="purchaseWarning"
    >

      <div class="purchaseWarningTitle">
        購入前の注意
      </div>


      <div
        id="purchaseWarningText"
        class="purchaseWarningText"
      ></div>


      <label class="purchaseConfirm">

        <input
          type="checkbox"
          id="purchaseConfirm"
        >

        <span>
          上記の内容を確認しました。
          新しい講座を購入すると、現在の講座は新しい講座へ切り替わることを了承します。
        </span>

      </label>

    </div>


    <!-- ======================================================
         会員番号
         ====================================================== -->

    <label for="memberID">
      会員番号
    </label>


    <input
      id="memberID"
      type="text"
      placeholder="（例）WKS0001"
      autocomplete="off"
    >


    <!-- ======================================================
         氏名
         ====================================================== -->

    <label for="name">
      申込者氏名
    </label>


    <input
      id="name"
      type="text"
      placeholder="日本 一郎"
    >


    <!-- ======================================================
         メール
         ====================================================== -->

    <label for="email">
      メールアドレス
    </label>


    <input
      id="email"
      type="email"
      placeholder="example@gmail.com"
    >


    <!-- ======================================================
         会員確認
         ====================================================== -->

    <button
      type="button"
      id="checkBtn"
    >
      会員情報を確認
    </button>


    <!-- ======================================================
         Stripe決済
         ====================================================== -->

    <button
      type="button"
      id="checkoutBtn"
      disabled
    >
      Stripeで決済へ進む
    </button>


    <!-- ======================================================
         状態
         ====================================================== -->

    <div
      id="status"
      class="status"
    >
      講座情報を読み込んでいます...
    </div>


    <div class="small">
      ※ 決済はStripeの安全な決済画面で行います。
    </div>


  </div>

</div>


<script>


// ============================================================
// API設定
// ============================================================
const MAIN_GAS_URL =
"https://script.google.com/macros/s/AKfycbzMvrlP__tgv8HqjkX_nYFPq5v2skuTd45flf-ltGa1vF2L4P-pljXHlaxbLpUEXlGg/exec";

const STRIPE_GAS_URL =
"https://script.google.com/macros/s/AKfycbw_9bn5qeOtAvLQmQuMJzwCz9kR2IgaJJlv8JG4SW_ccTQyDBjIdeur7YBuj-z8ci33BA/exec";

// ============================================================
// URLパラメータ
// ============================================================

const urlParams =
  new URLSearchParams(
    window.location.search
  );


const courseId =
  String(
    urlParams.get("courseId") || ""
  )
  .trim()
  .toUpperCase();


const productId =
  String(
    urlParams.get("productId") || ""
  )
  .trim()
  .toUpperCase();


const urlPrice =
  Number(
    urlParams.get("price")
  );


// ============================================================
// DOM
// ============================================================

const courseInfo =
  document.getElementById(
    "courseInfo"
  );


const courseIdDisplay =
  document.getElementById(
    "courseIdDisplay"
  );


const productIdDisplay =
  document.getElementById(
    "productIdDisplay"
  );


const courseNameDisplay =
  document.getElementById(
    "courseNameDisplay"
  );


const productDetail =
  document.getElementById(
    "productDetail"
  );


const priceElement =
  document.getElementById(
    "price"
  );


const memberIDInput =
  document.getElementById(
    "memberID"
  );


const nameInput =
  document.getElementById(
    "name"
  );


const emailInput =
  document.getElementById(
    "email"
  );


const checkBtn =
  document.getElementById(
    "checkBtn"
  );


const checkoutBtn =
  document.getElementById(
    "checkoutBtn"
  );


const purchaseWarning =
  document.getElementById(
    "purchaseWarning"
  );


const purchaseWarningText =
  document.getElementById(
    "purchaseWarningText"
  );


const purchaseConfirm =
  document.getElementById(
    "purchaseConfirm"
  );


const statusElement =
  document.getElementById(
    "status"
  );


// ============================================================
// 状態
// ============================================================

let products = [];

let selectedProduct = null;

let memberChecked = false;

let currentPurchaseStatus = null;

let warningAcknowledged = false;


// ============================================================
// 初期処理
// ============================================================

init();


// ============================================================
// 初期化
// ============================================================

function init() {


  if (!courseId) {

    setStatus(

      "講座IDが指定されていません。\n" +
      "URLを確認してください。",

      true

    );

    return;

  }


  if (!productId) {

    setStatus(

      "販売商品IDが指定されていません。\n" +
      "KS / PS / KP のいずれかを選択してください。",

      true

    );

    return;

  }


  if (
    productId !== "KS" &&
    productId !== "PS" &&
    productId !== "KP"
  ) {

    setStatus(

      "販売商品IDが正しくありません。\n" +
      "productId：" +
      productId,

      true

    );

    return;

  }


  if (
    !Number.isFinite(urlPrice) ||
    urlPrice <= 0
  ) {

    setStatus(

      "料金情報が正しくありません。\n" +
      "price：" +
      urlParams.get("price"),

      true

    );

    return;

  }


  courseIdDisplay.textContent =
    "講座ID：" +
    courseId;


  productIdDisplay.textContent =
    "販売商品ID：" +
    productId;


  priceElement.textContent =
    "料金：" +
    formatPrice(urlPrice) +
    "円";


  loadProducts();

}


// ============================================================
// Products取得
// ============================================================

async function loadProducts() {


  try {


    setStatus(
      "選択された講座の商品情報を確認しています..."
    );


    const response =
      await fetch(

        STRIPE_GAS_URL +
        "?getProducts=1"

      );


    const text =
      await response.text();


    console.log(
      "Products HTTP:",
      response.status
    );


    console.log(
      "Products Content-Type:",
      response.headers.get(
        "content-type"
      )
    );


    console.log(
      "Products RAW:",
      text
    );


    const json =
      parseApiResponse(
        response,
        text,
        "Products API"
      );


    if (!json.success) {

      throw new Error(

        json.error ||
        "商品情報を取得できませんでした。"

      );

    }


    products =
      Array.isArray(
        json.products
      )
        ? json.products
        : [];


    products =
      products.filter(
        product =>
          isActive(
            product.active
          )
      );


    // ========================================================
    // courseId + productId
    // ========================================================

    selectedProduct =
      products.find(
        product => {


          const productCourseId =

            String(
              product.courseId ||
              product.course_id ||
              ""
            )
            .trim()
            .toUpperCase();


          const productProductId =

            String(
              product.productId ||
              product.product_id ||
              ""
            )
            .trim()
            .toUpperCase();


          return (

            productCourseId ===
            courseId

            &&

            productProductId ===
            productId

          );

        }
      )
      || null;


    if (!selectedProduct) {

      throw new Error(

        "指定された商品がProductsシートにありません。\n" +

        "courseId：" +
        courseId +

        "\n" +

        "productId：" +
        productId

      );

    }


    const sheetPrice =
      Number(
        selectedProduct.price
      );


    if (
      !Number.isFinite(sheetPrice) ||
      sheetPrice <= 0
    ) {

      throw new Error(

        "Productsシートの価格が正しくありません。"

      );

    }


    // --------------------------------------------------------
    // URL料金とProducts料金確認
    // --------------------------------------------------------

    if (
      sheetPrice !==
      urlPrice
    ) {

      throw new Error(

        "料金情報が一致しません。\n" +

        "URL料金：" +
        formatPrice(urlPrice) +
        "円\n" +

        "Products料金：" +
        formatPrice(sheetPrice) +
        "円"

      );

    }


    displayCourse();


    setStatus(

      "講座情報を確認しました。\n" +
      "会員番号・氏名・メールアドレスを入力して\n" +
      "「会員情報を確認」を押してください。"

    );


  } catch (error) {


    console.error(
      "Products取得エラー：",
      error
    );


    setStatus(

      "講座情報の取得に失敗しました。\n\n" +
      error.message,

      true

    );

  }

}


// ============================================================
// APIレスポンス解析
//
// 今回の重要修正
//
// JSONでない場合に、実際の返却内容を表示する。
// ============================================================

function parseApiResponse(
  response,
  text,
  apiName
) {


  if (!response.ok) {

    throw new Error(

      apiName +
      " HTTPエラー：" +
      response.status +
      "\n\n" +

      "返却内容：\n" +
      text.substring(
        0,
        1000
      )

    );

  }


  if (!text) {

    throw new Error(

      apiName +
      "が空のレスポンスを返しました。"

    );

  }


  try {

    return JSON.parse(
      text
    );

  } catch (error) {


    console.error(
      apiName +
      " JSON解析失敗：",
      text
    );


    throw new Error(

      apiName +
      "がJSONを返していません。\n\n" +

      "HTTP：" +
      response.status +

      "\n\n" +

      "返却内容：\n" +

      text.substring(
        0,
        1000
      )

    );

  }

}


// ============================================================
// 講座情報表示
// ============================================================

function displayCourse() {


  if (!selectedProduct) {

    return;

  }


  courseInfo.style.display =
    "block";


  courseIdDisplay.textContent =

    "講座ID：" +

    (

      selectedProduct.courseId ||

      selectedProduct.course_id ||

      courseId

    );


  productIdDisplay.textContent =

    "販売商品ID：" +

    (

      selectedProduct.productId ||

      selectedProduct.product_id ||

      productId

    );


  courseNameDisplay.textContent =

    selectedProduct.productName ||

    selectedProduct.product_name ||

    "商品名未設定";


  const productType =

    selectedProduct.productType ||

    selectedProduct.product_type ||

    "";


  let typeText = "";


  if (
    productType === "video"
  ) {

    typeText =
      "動画教材";

  }

  else if (
    productType === "pdf"
  ) {

    typeText =
      "PDF教材";

  }

  else if (
    productType === "both"
  ) {

    typeText =
      "動画＋PDF教材";

  }

  else if (productType) {

    typeText =
      productType;

  }


  productDetail.textContent =
    typeText
      ? "教材：" + typeText
      : "";


  priceElement.textContent =

    "料金：" +

    formatPrice(
      selectedProduct.price
    ) +

    "円";

}


// ============================================================
// 購入前注意チェック
// ============================================================

purchaseConfirm.addEventListener(
  "change",
  function() {

    warningAcknowledged =
      purchaseConfirm.checked;

    updateCheckoutButton();

  }
);


// ============================================================
// 会員確認ボタン
// ============================================================

checkBtn.addEventListener(
  "click",
  checkMember
);


// ============================================================
// 会員情報確認
// ============================================================

async function checkMember() {


  const memberID =
    memberIDInput.value.trim();


  const name =
    nameInput.value.trim();


  const email =
    emailInput.value.trim();


  if (!memberID) {

    setStatus(
      "会員番号を入力してください。",
      true
    );

    return;

  }


  if (!name) {

    setStatus(
      "申込者氏名を入力してください。",
      true
    );

    return;

  }


  if (!email) {

    setStatus(
      "メールアドレスを入力してください。",
      true
    );

    return;

  }


  memberChecked =
    false;

  checkoutBtn.disabled =
    true;


  setStatus(
    "会員情報を確認しています..."
  );


  try {


    const response =
      await fetch(

        MAIN_GAS_URL +
        "?verifyPurchase=1" +
        "&memberID=" +
        encodeURIComponent(
          memberID
        ) +
        "&name=" +
        encodeURIComponent(
          name
        ) +
        "&email=" +
        encodeURIComponent(
          email
        )

      );


    const text =
      await response.text();


    console.log(
      "MAIN HTTP:",
      response.status
    );


    console.log(
      "MAIN RAW:",
      text
    );


    const json =
      parseApiResponse(
        response,
        text,
        "会員情報API"
      );


    if (
      !json.valid ||
      json.authenticated === false
    ) {

      throw new Error(

        json.error ||

        "会員番号・氏名・メールアドレスが正しくありません。"

      );

    }


    if (json.name) {

      nameInput.value =
        json.name;

    }


    if (json.email) {

      emailInput.value =
        json.email;

    }


    memberChecked =
      true;


    warningAcknowledged =
      false;


    purchaseConfirm.checked =
      false;


    purchaseWarning.style.display =
      "none";


    setStatus(
      "会員情報を確認しました。\n" +
      "現在の受講状況を確認しています..."
    );


    await checkCurrentPurchaseStatus(

      memberID,

      json.name || name,

      json.email || email

    );


  } catch (error) {


    console.error(
      "会員情報確認エラー：",
      error
    );


    checkoutBtn.disabled =
      true;


    setStatus(
      error.message,
      true
    );

  }

}


// ============================================================
// 現在の受講状況
// ============================================================

async function checkCurrentPurchaseStatus(

  memberID,
  name,
  email

) {


  try {


    const response =
      await fetch(

        STRIPE_GAS_URL +
        "?getCurrentPurchase=1" +
        "&memberID=" +
        encodeURIComponent(
          memberID
        ) +
        "&name=" +
        encodeURIComponent(
          name
        ) +
        "&email=" +
        encodeURIComponent(
          email
        )

      );


    const text =
      await response.text();


    console.log(
      "CURRENT PURCHASE HTTP:",
      response.status
    );


    console.log(
      "CURRENT PURCHASE RAW:",
      text
    );


    const json =
      parseApiResponse(

        response,
        text,
        "現在の受講状況API"

      );


    if (
      !json.success ||
      json.authenticated === false
    ) {

      throw new Error(

        json.error ||
        "現在の受講状況を確認できませんでした。"

      );

    }


    currentPurchaseStatus =
      json;


    // ========================================================
    // 現在の講座が有効
    // ========================================================

    if (
      json.hasCurrentCourse === true &&
      json.active === true
    ) {


      const expireText =

        json.expireDate

          ? formatDateTime(
              new Date(
                json.expireDate
              )
            )

          : "確認できません";


      purchaseWarningText.textContent =

        "現在、次の講座を受講中です。\n\n" +

        "現在の講座：" +
        (
          json.courseName ||
          json.courseId ||
          "講座情報なし"
        ) +

        "\n講座ID：" +
        (
          json.courseId ||
          ""
        ) +

        "\n視聴期限：" +
        expireText +

        "\n残り日数：" +
        String(
          json.remainDays !== undefined
            ? json.remainDays
            : "-"
        ) +
        "日\n\n" +

        "現在の視聴期限が残っている状態で新しい講座を購入すると、" +
        "決済完了後に現在の講座は新しい講座へ切り替わります。\n" +

        "現在の講座は受講履歴として保存されます。";


      purchaseWarning.style.display =
        "block";


      purchaseConfirm.checked =
        false;


      warningAcknowledged =
        false;


      updateCheckoutButton();


      setStatus(

        "会員情報を確認しました。\n" +
        "購入前の注意事項を確認してください。",

        false,

        true

      );


      return;

    }


    // ========================================================
    // 現在受講中の講座なし
    // ========================================================

    purchaseWarning.style.display =
      "none";


    purchaseConfirm.checked =
      false;


    warningAcknowledged =
      true;


    updateCheckoutButton();


    setStatus(

      "会員情報を確認しました。\n\n" +

      "お名前：" +
      (
        json.name ||
        name
      ) +

      "\n" +

      "メール：" +
      (
        json.email ||
        email
      ) +

      "\n\n" +

      "講座ID：" +
      courseId +

      "\n" +

      "販売商品ID：" +
      productId +

      "\n" +

      "料金：" +
      formatPrice(
        selectedProduct.price
      ) +
      "円\n\n" +

      "内容を確認して「Stripeで決済へ進む」を押してください。",

      false,

      true

    );


  } catch (error) {


    console.error(
      "現在の受講状況確認エラー：",
      error
    );


    currentPurchaseStatus =
      null;


    warningAcknowledged =
      false;


    checkoutBtn.disabled =
      true;


    setStatus(

      "現在の受講状況を確認できませんでした。\n\n" +

      error.message +

      "\n\n" +

      "安全のため、決済へ進めない状態にしています。",

      true

    );

  }

}


// ============================================================
// 決済ボタン状態
// ============================================================

function updateCheckoutButton() {


  if (
    !memberChecked ||
    !selectedProduct ||
    !currentPurchaseStatus
  ) {

    checkoutBtn.disabled =
      true;

    return;

  }


  const hasActiveCourse =

    currentPurchaseStatus.hasCurrentCourse === true &&

    currentPurchaseStatus.active === true;


  if (hasActiveCourse) {

    checkoutBtn.disabled =
      !warningAcknowledged;

  }

  else {

    checkoutBtn.disabled =
      false;

  }

}


// ============================================================
// Stripe Checkout
// ============================================================

checkoutBtn.addEventListener(
  "click",
  startCheckout
);


// ============================================================
// Stripe Checkout開始
// ============================================================

async function startCheckout() {


  if (!memberChecked) {

    alert(
      "先に会員情報を確認してください。"
    );

    return;

  }


  if (!selectedProduct) {

    alert(
      "講座情報が取得できていません。"
    );

    return;

  }


  if (!currentPurchaseStatus) {

    alert(
      "現在の受講状況を確認してください。"
    );

    return;

  }


  if (

    currentPurchaseStatus.hasCurrentCourse === true &&

    currentPurchaseStatus.active === true &&

    !warningAcknowledged

  ) {

    alert(
      "購入前の注意事項を確認し、チェックを入れてください。"
    );

    purchaseConfirm.focus();

    return;

  }


  const memberID =
    memberIDInput.value.trim();


  const name =
    nameInput.value.trim();


  const email =
    emailInput.value.trim();


  if (
    !memberID ||
    !name ||
    !email
  ) {

    alert(
      "会員番号・氏名・メールアドレスを確認してください。"
    );

    return;

  }


  // ==========================================================
  // Productsシートの正式情報
  // ==========================================================

  const finalCourseId =

    String(

      selectedProduct.courseId ||

      selectedProduct.course_id ||

      courseId

    )
    .trim()
    .toUpperCase();


  const finalProductId =

    String(

      selectedProduct.productId ||

      selectedProduct.product_id ||

      productId

    )
    .trim()
    .toUpperCase();


  const finalPrice =

    Number(
      selectedProduct.price
    );


  const finalPriceId =

    String(

      selectedProduct.priceId ||

      selectedProduct.price_id ||

      ""

    )
    .trim();


  if (!finalPriceId) {

    alert(

      "Stripe Price IDが取得できません。\n\n" +

      "Productsシートを確認してください。"

    );

    return;

  }


  if (
    !Number.isFinite(finalPrice) ||
    finalPrice <= 0
  ) {

    alert(
      "料金情報が正しくありません。"
    );

    return;

  }


  checkoutBtn.disabled =
    true;


  setStatus(
    "Stripe決済画面を準備しています..."
  );


  // ==========================================================
  // Stripeへ送るデータ
  // ==========================================================

  const requestData = {

    course_id:
      finalCourseId,

    product_id:
      finalProductId,

    price:
      finalPrice,

    price_id:
      finalPriceId,

    memberID:
      memberID,

    name:
      name,

    email:
      email

  };


  console.log(
    "===================================="
  );


  console.log(
    "Checkout REQUEST:"
  );


  console.log(
    requestData
  );


  console.log(
    "===================================="
  );


  try {


    // ========================================================
    // STRIPE_GASへPOST
    // ========================================================

    const response =
      await fetch(

        STRIPE_GAS_URL,

        {

          method:
            "POST",

          headers: {

            /*
             * text/plainを使用。
             *
             * Google Apps Script Web Appとの
             * CORS問題を避けるため、
             * application/jsonではなく
             * text/plainで送信します。
             */

            "Content-Type":
              "text/plain;charset=utf-8"

          },

          body:
            JSON.stringify(
              requestData
            )

        }

      );


    // ========================================================
    // まずtextとして取得
    // ========================================================

    const text =
      await response.text();


    console.log(
      "===================================="
    );


    console.log(
      "Checkout HTTP:",
      response.status
    );


    console.log(
      "Checkout Content-Type:",
      response.headers.get(
        "content-type"
      )
    );


    console.log(
      "Checkout RAW:"
    );


    console.log(
      text
    );


    console.log(
      "===================================="
    );


    // ========================================================
    // JSON解析
    // ========================================================

    const json =
      parseApiResponse(

        response,

        text,

        "Checkout API"

      );


    console.log(
      "Checkout JSON:",
      json
    );


    // ========================================================
    // APIエラー
    // ========================================================

    if (!json.success) {

      throw new Error(

        json.error ||

        "決済画面を作成できませんでした。"

      );

    }


    // ========================================================
    // Stripe URL
    // ========================================================

    if (!json.url) {

      throw new Error(

        "Stripe Checkout URLがありません。\n" +

        "Session ID：" +
        (
          json.sessionId ||
          "なし"
        )

      );

    }


    setStatus(
      "Stripe決済画面へ移動します..."
    );


    // ========================================================
    // Stripeへ移動
    // ========================================================

    window.location.href =
      json.url;


  } catch (error) {


    console.error(
      "===================================="
    );


    console.error(
      "Checkout ERROR:"
    );


    console.error(
      error
    );


    console.error(
      "===================================="
    );


    checkoutBtn.disabled =
      false;


    setStatus(

      "決済画面の作成に失敗しました。\n\n" +

      error.message,

      true

    );

  }

}


// ============================================================
// active判定
// ============================================================

function isActive(value) {


  if (
    value === true
  ) {

    return true;

  }


  const s =

    String(
      value || ""
    )
    .trim()
    .toLowerCase();


  return (

    s === "true" ||

    s === "1" ||

    s === "yes" ||

    s === "on" ||

    s === "販売中" ||

    s === "有効"

  );

}


// ============================================================
// 金額表示
// ============================================================

function formatPrice(value) {


  const n =
    Number(value);


  if (
    !Number.isFinite(n)
  ) {

    return "0";

  }


  return Math.round(n)
    .toLocaleString();

}


// ============================================================
// 日付表示
// ============================================================

function formatDateTime(date) {


  if (
    !date ||
    isNaN(
      date.getTime()
    )
  ) {

    return "日付不明";

  }


  return (

    date.getFullYear() +
    "年" +

    String(
      date.getMonth() + 1
    ).padStart(
      2,
      "0"
    ) +
    "月" +

    String(
      date.getDate()
    ).padStart(
      2,
      "0"
    ) +
    "日"

  );

}


// ============================================================
// ステータス表示
// ============================================================

function setStatus(

  message,

  isError = false,

  isOk = false

) {


  statusElement.textContent =
    message;


  statusElement.className =
    "status" +

    (
      isError
        ? " error"
        : ""
    ) +

    (
      isOk
        ? " ok"
        : ""
    );

}
