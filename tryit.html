<!-- ++++++++++++++++++++++++++++++++++++++++++++++++++ -->
<!-- わくわくプログラミング工房 平兵道 -->
<!-- tryit.html（CORS対応・会員番号チェック・Stripe決済連携 完全版） -->
<!-- ++++++++++++++++++++++++++++++++++++++++++++++++++ -->
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>やってみようのページ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: "Rounded Mplus 1c", sans-serif;
      background: #fdf6ff;
      padding: 20px;
      color: #444;
    }
    h2 {
      background: #ffccf5;
      padding: 10px 15px;
      border-radius: 10px;
      color: #333;
    }
    .section {
      margin-bottom: 30px;
      padding: 20px;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 0 8px rgba(0,0,0,0.1);
    }
    label {
      font-weight: bold;
      margin-bottom: 8px;
      display: block;
    }
    select, input {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 2px solid #ff99dd;
      font-size: 16px;
      background: #fff7fc;
      box-sizing: border-box;
    }
    .btn {
      display: block;
      width: 100%;
      margin-top: 20px;
      padding: 15px;
      background: #ff66c4;
      color: white;
      font-size: 18px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      font-weight: bold;
      text-align: center;
    }
    .btn:hover {
      background: #ff4fb8;
    }
    .note {
      margin-top: 10px;
      font-size: 14px;
      color: #666;
    }
  </style>
</head>

<body>
  <h2>有料講座お申込みフォーム</h2>

  <div class="section">
    <form id="paidForm">
      <label for="memberID">会員番号</label>
      <input type="text" id="memberID" name="memberID" required placeholder="（例）WKS0001">

      <label for="name">申込者氏名</label>
      <input type="text" id="name" name="name" required placeholder="日本　一郎">

      <label>希望講座名（有料）</label>
      <select id="paidCourse"></select>

      <div class="form-row terms-row">
        <input type="checkbox" id="agree" required>
        <label for="agree"><a href="terms.html" target="_blank">利用規約</a>に同意します</label>
      </div>

      <button type="button" class="btn" onclick="submitPaid()">申し込む（購入へ進む）</button>
      <p class="note">※決済完了後、案内ページ（mypage.html）へ戻ります。</p>
    </form>
  </div>

  <script>
    // ===============================
    // GAS URL設定（最新デプロイURLを貼る）
    // ===============================
    const MAIN_GAS_URL = "https://script.google.com/macros/s/AKfycbwfC0NCNIOuRz8yXmA0T_t_e6LnSw51Wn6Tgpx-gYSvRXkR34gczdCezbG7jtIgbQq3/exec";
    const STRIPE_GAS_URL = "https://script.google.com/macros/s/AKfycbx3F3vOK6td_EGLPvojbjLL0ULEXLo9xkiH0H_gvzQBzLTR9eWa8ZkikML13NhkvMldDg/exec";

    // ===============================
    // 会員番号チェック（MAIN_GAS）
    // ===============================
    async function checkMember(memberID) {
      const res = await fetch(`${MAIN_GAS_URL}?memberID=${memberID}`);
      return res.json();
    }

    // ===============================
    // Products JSON（STRIPE_GAS）
    // ===============================
    async function loadProducts() {
      try {
        const res = await fetch(STRIPE_GAS_URL);
        const data = await res.json();
        const select = document.getElementById("paidCourse");
        select.innerHTML = '<option value="">選択してください</option>';

        data.products.forEach(p => {
          if (p.active) {
            const opt = document.createElement("option");
            opt.value = p.price_id;
            opt.textContent = `${p.product_name}（${p.price}円）`;
            select.appendChild(opt);
          }
        });
      } catch (err) {
        console.error("Products fetch error:", err);
        alert("商品情報の取得に失敗しました。\n" + err);
      }
    }

    // ===============================
    // Stripe Checkout（POST）
    // ===============================
    async function submitPaid() {
      const priceId  = document.getElementById("paidCourse").value;
      const memberID = document.getElementById("memberID").value;
      const name     = document.getElementById("name").value;

      if (!priceId || !memberID) {
        alert("会員番号と講座を選択してください");
        return;
      }

      try {
        const result = await checkMember(memberID);
        if (!result.valid) {
          alert("会員番号が存在しません");
          return;
        }

        const email = result.email;

        const res = await fetch(STRIPE_GAS_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            price_id: priceId,
            memberID: memberID,
            email: email
          })
        });

        const data = await res.json();
        if (data.url) {
          window.location.href = data.url;
        } else {
          alert("決済処理に失敗しました。\n" + JSON.stringify(data));
        }
      } catch (err) {
        console.error("通信エラー:", err);
        alert("通信エラー: " + err);
      }
    }

    // 初期化
    loadProducts();
  </script>
</body>
</html>
