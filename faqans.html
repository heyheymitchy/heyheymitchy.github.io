<!-- faqans.html -->
<!DOCTYPE html >
<html lang="ja">

<!-- head -->
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ＦＡＱＡＮＳ</title>
<link rel="stylesheet" href="style.css">
</head>

<body>
<!-- ここからは全html共用の記述にする -->
  <!-- ================================================== -->
  <!-- 共通ヘッダー -->
  <!-- ================================================== -->
  <div id="header"></div>
<!-- ここまで -->

<!-- ここからはこのページだけの内容 -->

<!-- FAQ一覧（ポップデザイン） -->
<div id="faq" class="faq-list">
  <h1 class="faq-title">ＦＡＱ（しつもん と こたえ）</h1>
  <p>画面表示までに少々時間が掛かっています・・</p>
</div>


<!-- FAQ追加フォーム（HTML → GAS） -->
<!-- FAQ追加は、別ＨＴＭＬにて管理中writte -->


  <!-- ================================================== -->
  <!-- 共通JavaScript -->
  <!-- ================================================== -->
<script src="script.js"></script>

<script>
// GASが返すJSONで一覧表を作成する

fetch("https://script.google.com/macros/s/AKfycbzqAP_j1ebvg8ufstag-EGPY2W71reTW6fqpUu-9jSMlCLZqxqeaj0A6bVLRin3e1_IPA/exec")
  .then(res => res.json())
  .then(data => {
    const box = document.getElementById("faq");
    data.forEach(item => {
      box.innerHTML += `
        <div class="faq-item">
          <div class="faq-q">Q. ${item.q}</div>
          <div class="faq-a">A. ${item.a}</div>
        </div>
      `;
    });
  });

// FAQ追加フォームを送信したときに、GASへデータを送る処理
// ＯＫ－ＮＧを受け取り画面に表示させる

document.getElementById("faqForm").onsubmit = async (e) => {
  e.preventDefault();

  const fd = new FormData(e.target);

// FAQ_GASをデプロイしたらURL更新すること
  
const res = await fetch("https://script.google.com/macros/s/AKfycbxRD2X6Hb6eWMuptCOZ3FGT0q9GQIu9BZw_P0kly3NcNE0PoYu-r7VA3zHAUy7v7JGRVQ/exec",
 {
    method: "POST",
    body: fd
  });

  const text = await res.text();
  document.getElementById("result").innerText = text;

// ★★★ ここが重要：FAQ一覧を再読み込み ★★★
  loadFAQ();

};

</script>
<!-- ここまで このページだけの内容 -->


<!-- ここからは全html共用の記述にする -->
  <!-- ================================================== -->
  <!-- 共通フッター -->
  <!-- ================================================== -->
  <div id="footer"></div>
<!-- ここまで -->


</body>
</html>
