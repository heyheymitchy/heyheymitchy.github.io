<!-- Googleフォーム or 自作フォーム（HTML → GAS）で質問回答を送信 -->
<div id="faq"><h1>ＦＡＱＡＮＳのページです</h1></div>

<!-- FAQ追加フォーム（HTML → GAS） -->
<!-- FAQ追加フォーム -->
<div class="faq-form">
  <h2>FAQを追加する</h2>

  <form id="faqForm">
　　<label>※管理者コード</label>
    <input type="password" name="code" required placeholder="管理者コードを入力">

    <label>質問（Q）</label>
    <input type="text" name="q" required placeholder="質問を入力してください">

    <label>回答（A）</label>
    <textarea name="a" required placeholder="回答を入力してください"></textarea>

    <button type="submit">FAQを追加する</button>
  </form>

  <p id="result"></p>
</div>


<script>
fetch("https://script.google.com/macros/s/AKfycbymeS5eigVWCt4e65mSox4BQEKoLOSl0VNTe4pskXiZTewlHj8HG50vLG7D34adw5WfAA/exec
") // GASが返すJSON
  .then(res => res.json())
  .then(data => {
    const box = document.getElementById("faq");
    data.forEach(item => {
      box.innerHTML += `
        <div class="faq-item">
          <h3>${item.q}</h3>
          <p>${item.a}</p>
        </div>
      `;
    });
  });

document.getElementById("faqForm").onsubmit = async (e) => {
  e.preventDefault();

  const fd = new FormData(e.target);

  const res = await fetch("https://script.google.com/macros/s/AKfycbymeS5eigVWCt4e65mSox4BQEKoLOSl0VNTe4pskXiZTewlHj8HG50vLG7D34adw5WfAA/exec", {
    method: "POST",
    body: fd
  });

  const text = await res.text();
  document.getElementById("result").innerText = text;
};



</script>
