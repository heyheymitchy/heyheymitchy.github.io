<!-- 自作フォーム（HTML → GAS）で質問回答を手動で送信します -->
<!-- ＳＴＥＰ２では全自動反映されるようにコード修正予定です -->

<div id="faq"><h1>※ここは、スタッフの管理用のページです（触らないでね）</h1>
              <h2>ＦＡＱの追加情報をスタッフが日々管理しています</h2>
</div>

<!-- FAQ追加フォーム（HTML → GAS） -->
<!-- FAQ追加フォーム -->
<div class="faq-form">
  <h2>FAQを追加する</h2>

  <form id="faqForm">
　　<label>※管理者コード</label><input type="password" name="code" required placeholder="管理者コードを入力">
    <label>質問（Q）</label><input type="text" name="q" required placeholder="質問を入力してください">
    <label>回答（A）</label><textarea name="a" required placeholder="回答を入力してください"></textarea>
    <button type="submit">FAQを追加する</button>
  </form>

  <p id="result"></p>
</div>


<script>
// GASが返すJSONで一覧表を作成する

fetch("https://script.google.com/macros/s/AKfycbzqAP_j1ebvg8ufstag-EGPY2W71reTW6fqpUu-9jSMlCLZqxqeaj0A6bVLRin3e1_IPA/exec")
  .then(res => res.json())
  .then(data => {
    const box = document.getElementById("faq");
    data.forEach(item => {
      box.innerHTML += `
        <div class="faq-item">
          <div class="faq-q">Q. ${item.q}</div>
          <div class="faq-a">A. ${item.a}</div>
        </div>
      `;
    });
  });

// FAQ追加フォームを送信したときに、GASへデータを送る処理
// ＯＫ－ＮＧを受け取り画面に表示させる

document.getElementById("faqForm").onsubmit = async (e) => {
  e.preventDefault();

  const fd = new FormData(e.target);

  const res = await fetch("https://script.google.com/macros/s/AKfycbzqAP_j1ebvg8ufstag-EGPY2W71reTW6fqpUu-9jSMlCLZqxqeaj0A6bVLRin3e1_IPA/exec", {
    method: "POST",
    body: fd
  });

  const text = await res.text();
  document.getElementById("result").innerText = text;

// ★★★ ここが重要：FAQ一覧を再読み込み ★★★
  loadFAQ();

};

</script>
