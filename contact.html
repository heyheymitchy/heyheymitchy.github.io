<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>無料体験講座お申込みのページ</title>
  <link rel="stylesheet" href="style2.css">
</head>
<body class="bg-gradient">
  <div class="container">
    <h1>無料体験講座　お申込みのページ</h1>
　　　<p>今回、［無料体験講座］を申込される皆様には<span style="color:red; font-size:18px; font-weight:bold;">［わくわく無料キャンペーン］特典</span>として<br>
　　　<span style="color:red; background: yellow; font-size:18px; font-weight:bold; padding:0px;">［入会費用］［年会費］が無料となる［特別会員］</span>と、させていただきます<br><br>
　　　なお、趣旨にご賛同頂けない場合には<br>お手数をお掛けしますが［前の画面に戻る］（右下ボタン）よりお戻りください<br></p>
    <div class="center-box">
      <a href="campaign.html" class="btn-campaign">特別会員わくわくキャンペーンの内容確認へ</a>
    </div>
<br>
 <form id="entryForm" class="card">
      <label>お名前</label>
      <input type="text" name="name" required>

      <label>メールアドレス</label>
      <input type="email" name="email" required>

      <label>郵便番号</label>
      <input type="post" name="post">

      <label>電話番号</label>
      <input type="tel" name="tel">

      <label>アンケート（興味のある講座）</label>
      <select name="course">
        <option value="scratch">Scratch入門</option>
        <option value="web">Web制作入門</option>
        <option value="python">Python入門</option>
      </select>

      <label>パスワード（任意）</label>
      <input type="password" name="password">
<BR>
      <button type="submit" class="btn-primary">
        <b>無料体験講座</b>に申し込みます（兼特別会員登録）
      </button>
　　　<button class="btn-back" onclick="history.back()">前の画面に戻る</button>
    </form>

    <p id="result" class="message"></p>
  </div>

  <script>
    document.getElementById('entryForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const form = e.target;
      const data = new FormData(form);

      fetch('YOUR_WEB_APP_URL', {
        method: 'POST',
        body: data
      })
      .then(res => res.text())
      .then(text => {
        document.getElementById('result').textContent = text;
        form.reset();
      })
      .catch(() => {
        document.getElementById('result').textContent =
          '送信に失敗しました。時間をおいて再度お試しください。';
      });
    });
  </script>
</body>
</html>
