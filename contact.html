<!-- ++++++++++++++++++++++++++++++++++++++++++++++++++ -->
<!-- わくわくプログラミング工房　平兵道　のホームページ -->
<!-- ++++++++++++++++++++++++++++++++++++++++++++++++++ -->
<!-- contact.html -->

<!DOCTYPE html>
<html lang="ja">


<!-- ================================================== -->
<!-- head -->
<!-- ================================================== -->

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>お問い合わせ</title>

<link
  rel="stylesheet"
  href="style.css"
>


<style>

/* ==================================================
   お問い合わせページ専用CSS
   ================================================== */

.contact-container {

  max-width: 700px;

  margin: 40px auto;

  padding: 30px;

  background-color: #ffffff;

  border-radius: 15px;

  box-shadow:
    0 4px 15px
    rgba(0, 0, 0, 0.15);

}


/* タイトル */

.contact-title {

  text-align: center;

  font-size: 28px;

  color: #228b22;

  margin-bottom: 15px;

}


/* 説明 */

.contact-description {

  text-align: center;

  line-height: 1.8;

  margin-bottom: 30px;

}


/* 入力グループ */

.form-group {

  margin-bottom: 22px;

}


/* ラベル */

.form-group label {

  display: block;

  margin-bottom: 8px;

  font-weight: bold;

  font-size: 16px;

}


/* 必須 */

.required {

  color: red;

  margin-left: 5px;

  font-size: 13px;

}


/* 入力欄 */

.form-group input,
.form-group textarea {

  width: 100%;

  box-sizing: border-box;

  padding: 12px;

  font-size: 16px;

  border: 2px solid #cccccc;

  border-radius: 8px;

  font-family: inherit;

}


/* フォーカス */

.form-group input:focus,
.form-group textarea:focus {

  outline: none;

  border-color: #228b22;

}


/* 問い合わせ内容 */

.form-group textarea {

  min-height: 180px;

  resize: vertical;

  line-height: 1.7;

}


/* ==================================================
   送信ボタン
   ================================================== */

.contact-button-area {

  text-align: center;

  margin-top: 30px;

}


.contact-button {

  padding: 14px 50px;

  border: none;

  border-radius: 30px;

  background-color: #f5b400;

  color: #ffffff;

  font-size: 18px;

  font-weight: bold;

  cursor: pointer;

}


.contact-button:hover {

  background-color: #e0a400;

}


/* 送信中 */

.contact-button:disabled {

  background-color: #aaaaaa;

  cursor: not-allowed;

}


/* ==================================================
   結果表示
   ================================================== */

#result {

  margin-top: 25px;

  text-align: center;

  font-size: 17px;

  font-weight: bold;

  min-height: 30px;

}


/* スマートフォン */

@media (max-width: 600px) {

  .contact-container {

    margin: 20px 10px;

    padding: 20px;

  }


  .contact-title {

    font-size: 24px;

  }


  .contact-button {

    width: 100%;

  }

}

</style>

</head>



<body>


<!-- ここからは全html共用の記述にする -->


<!-- ================================================== -->
<!-- 共通ヘッダー -->
<!-- ================================================== -->

<div id="header"></div>


<!-- ここまで -->



<!-- ここからはこのページだけの内容 -->


<!-- ================================================== -->
<!-- お問い合わせ -->
<!-- ================================================== -->

<div class="contact-container">


  <h1 class="contact-title">

    お問い合わせ

  </h1>


  <p class="contact-description">

    わくわくプログラミング工房 平兵道への<br>

    お問い合わせはこちらからお願いします。

  </p>



  <!-- ==================================================
       お問い合わせフォーム
       ================================================== -->

  <form id="contactForm">


    <!-- GAS処理判定 -->

    <input
      type="hidden"
      name="type"
      value="contact"
    >



    <!-- ==================================================
         会員番号
         ================================================== -->

    <div class="form-group">

      <label for="memberId">

        会員番号

        <span class="required">
          必須
        </span>

      </label>


      <input
        type="text"
        id="memberId"
        name="memberId"
        placeholder="例：WKS1234"
        required
      >

    </div>



    <!-- ==================================================
         氏名
         ================================================== -->

    <div class="form-group">

      <label for="name">

        氏名

        <span class="required">
          必須
        </span>

      </label>


      <input
        type="text"
        id="name"
        name="name"
        placeholder="例：日本 太郎"
        required
      >

    </div>



    <!-- ==================================================
         メールアドレス
         ================================================== -->

    <div class="form-group">

      <label for="email">

        メールアドレス

        <span class="required">
          必須
        </span>

      </label>


      <input
        type="email"
        id="email"
        name="email"
        placeholder="例：sample@gmail.com"
        required
      >

    </div>



    <!-- ==================================================
         問い合わせ内容
         ================================================== -->

    <div class="form-group">

      <label for="message">

        問い合わせ内容

        <span class="required">
          必須
        </span>

      </label>


      <textarea
        id="message"
        name="message"
        placeholder="お問い合わせ内容を入力してください。"
        required
      ></textarea>

    </div>



    <!-- ==================================================
         送信ボタン
         ================================================== -->

    <div class="contact-button-area">

      <button
        type="submit"
        id="sendButton"
        class="contact-button"
      >

        お問い合わせを送信する

      </button>

    </div>


  </form>



  <!-- ==================================================
       送信結果
       ================================================== -->

  <div id="result"></div>


</div>


<!-- ここまで このページだけの内容 -->



<!-- ==================================================
     共通JavaScript
     ================================================== -->

<script src="script.js"></script>



<!-- ==================================================
     お問い合わせ専用JavaScript
     ================================================== -->

<script>


// ==================================================
// FAQ_GAS_URL
// ==================================================

const FAQ_GAS_URL =
  "https://script.google.com/macros/s/AKfycbxRD2X6Hb6eWMuptCOZ3FGT0q9GQIu9BZw_P0kly3NcNE0PoYu-r7VA3zHAUy7v7JGRVQ/exec";

// ==================================================
// お問い合わせフォーム送信
// ==================================================

document
  .getElementById("contactForm")
  .addEventListener(
    "submit",
    async function(e) {


      // --------------------------------------------
      // 通常のフォーム送信を停止
      // --------------------------------------------

      e.preventDefault();



      // --------------------------------------------
      // ボタン
      // --------------------------------------------

      const button =
        document.getElementById(
          "sendButton"
        );


      // --------------------------------------------
      // 結果表示
      // --------------------------------------------

      const result =
        document.getElementById(
          "result"
        );



      // --------------------------------------------
      // 二重送信防止
      // --------------------------------------------

      button.disabled = true;

      button.textContent =
        "送信中・・・";


      result.style.color =
        "#333333";


      result.textContent =
        "お問い合わせを送信しています・・・";



      try {


        // ------------------------------------------
        // フォームデータ
        // ------------------------------------------

        const formData =
          new FormData(e.target);



        // ------------------------------------------
        // GASへPOST
        // ------------------------------------------

        const response =
          await fetch(
            FAQ_GAS_URL,
            {

              method: "POST",

              body: formData

            }
          );



        // ------------------------------------------
        // GASからJSON取得
        // ------------------------------------------

        const data =
          await response.json();



        // ------------------------------------------
        // 正常終了
        // ------------------------------------------

        if (data.success) {


          result.style.color =
            "#008000";


          result.textContent =
            "お問い合わせを送信しました。ありがとうございました。";


          // 入力内容をクリア

          e.target.reset();


        } else {


          // ----------------------------------------
          // GAS側エラー
          // ----------------------------------------

          result.style.color =
            "#ff0000";


          result.textContent =
            "送信できませんでした：" +
            data.message;

        }


      } catch (error) {


        // ------------------------------------------
        // 通信エラー
        // ------------------------------------------

        console.error(
          "お問い合わせ送信エラー:",
          error
        );


        result.style.color =
          "#ff0000";


        result.textContent =
          "送信エラー：" + error.message;


      } finally {


        // ------------------------------------------
        // ボタンを元に戻す
        // ------------------------------------------

        button.disabled = false;


        button.textContent =
          "お問い合わせを送信する";

      }


    }
  );


</script>



<!-- ここからは全html共用の記述にする -->


<!-- ================================================== -->
<!-- 共通フッター -->
<!-- ================================================== -->

<div id="footer"></div>


<!-- ここまで -->

</body>
</html>
