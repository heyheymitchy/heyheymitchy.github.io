<!-- ++++++++++++++++++++++++++++++++++++++++++++++++++ -->
<!-- わくわくプログラミング工房　平兵道　のホームページ -->
<!-- ++++++++++++++++++++++++++++++++++++++++++++++++++ -->
<!-- index.html -->
<!DOCTYPE html>
<html lang="ja">
<!-- head -->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>わくわくプログラミング工房  平兵道</title>
  <link rel="stylesheet" href="style.css">
</head>

<!-- body -->
<body>
  <!-- カウンター　標示用 -->
  <div align="right">
    <!-- FC2カウンター ここから -->
    <script language="javascript" type="text/javascript"
      src="//counter1.fc2.com/counter.php?id=41013370&main=1"></script>
      <noscript>
        <img src="//counter1.fc2.com/counter_img.php?id=41013370&main=1" /></noscript>
    <!-- FC2カウンター ここまで -->
  </div>

  <!-- ▼ ここがポイント：ターゲット要素を header の「前」に置く -->
  <a id="ja"></a>
  <a id="en"></a>

  <!-- ヘッダー -->
  <header class="header">

    <!-- 左にロゴ／右にメニュー　表示させる -->
    <div class="logo-box"><img src="images/logo.png" alt="ロゴ"></div>

    <!-- 言語切り替えボタン -->
    <div class="lang-switch">
      <a href="#ja" class="lang-btn">日本語</a>
      <a href="#en" class="lang-btn">English</a>
    </div>

    <!-- 日本語メニュー -->
    <nav class="menu ja">
      <a href="hello.html#ja" class="btn">はじめまして</a>
      <a href="course.html#ja" class="btn">なにがあるの</a>
      <a href="tryit.html#ja" class="btn">やってみよう</a>
      <a href="faqans.html#ja" class="btn">しつもんする</a>
      <a href="check.html#ja" class="btn">かくにんする</a>
    </nav>

    <!-- 英語メニュー -->
    <nav class="menu en">
      <a href="hello.html#en" class="btn">Hello</a>
      <a href="course.html#en" class="btn">Go</a>
      <a href="tryit.html#en" class="btn">Play</a>
      <a href="faqans.html#en" class="btn">Ask</a>
      <a href="check.html#en" class="btn">Check</a>
    </nav>

  </header>

  <!-- メイン セクション　スタート-->
  <section class="main">

    <!-- 日本語版 -->
    <div id="ja" class="main ja"></div>
    <!-- 英語版 -->
    <div id="en" class="main en"></div>

    <div class="main-text">
      <h1></h1>
      <p></p>
    </div>

  </section>

  <!-- bottom-end -->

  <section id="bottom-end" class="bottom-end">
    <!-- style.css でbottom画像の差し込み -->
  </section>
  <!-- メイン セクション　エンド　-->

  <!-- 削除中 <div class="bottom-end">　-->
  <!-- 無料体験受付中 -->
  <section id="form" class="contact">
    <!-- 日本語版 -->
    <div id="ja" class="contact ja"><a href="register.html#ja" class="btn">無料体験申込み</a></div>
    <!-- 英語版 -->
    <div id="en" class="contact en"><a href="register.html#en" class="btn">Free to Apply</a></div>
  </section>

  <!-- <img src="images/qr.png" alt="QRコード" width="200">　-->

  <!-- フッター -->
  <footer class="footer ja">わくわくプログラミング工房  平兵道  est.2026</footer>
  <footer class="footer en">Wakuwaku Programming Lab Heyheymitchy est.2026</footer>

  <script>
    document.querySelectorAll(".lang-btn").forEach(btn => {
      btn.addEventListener("click", function () {

        // href="#ja" → "ja"
        const id = this.hash.substring(1);

        // sessionStorageへ保存
        sessionStorage.setItem("lang", id);

        // 次のページへ移動する場合
        // location.href = "page2.html";
      });
    });

  </script>
</body>

</html>
