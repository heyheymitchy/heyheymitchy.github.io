<!-- 会員登録＆お試し無料講座申し込みのページ -->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"  content="width=device-width, initial-scale=1.0">
  <title>会員登録＆お試し無料講座申込のページ</title>
  <link rel="stylesheet" href="style.css">
</head>

<style>
    body {
      font-family: "Rounded Mplus 1c", sans-serif;
      background: #fdf6ff;
      padding: 20px;
      color: #444;
    }
    h2 {
      background: #ffccf5;
      padding: 10px 15px;
      border-radius: 10px;
      color: #333;
    }
    .section {
      margin-bottom: 30px;
      padding: 20px;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 0 8px rgba(0,0,0,0.1);
    }
    label {
      font-weight: bold;
      margin-bottom: 8px;
      display: block;
    }
    select, input {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 2px solid #ff99dd;
      font-size: 16px;
      background: #fff7fc;
      box-sizing: border-box;
    }
    .btn2 {
      display: flex;
      width: 80%; /* ← 固定幅にすると完璧 */
      margin-top: 20px;
      padding: 15px;
      background: #ff66c4;
      color: white;
      font-size: 24px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      font-weight: bold;
      text-align: center;
      justify-content:center;
    }
    .btn2:hover {
      background: #ff4fb8;
    }
    .note {
      margin-top: 10px;
      font-size: 14px;
      color: #666;
    }
  </style>
</head>
<body>
<!-- ここからは全html共用の記述にする -->
  <!-- ================================================== -->
  <!-- 共通ヘッダー -->
  <!-- ================================================== -->
  <div id="header"></div>
<!-- ここまで -->

<!-- ここからはこのページだけの内容 -->
  <!-- ================================================== -->
  <!-- メイン -->
  <!-- ================================================== -->
<main>
  <!-- =============================== -->
  <!-- 特別会員様登録＆無料体験講座申込-->
  <!-- =============================== -->
  <section class="form-section card">
    <div class="container">
    <h1>無料体験講座　お申込みのページ</h1>
    <p><span style="color:red; font-size:18px; font-weight:bold;">［特別会員わくわくキャンペーン］特典</span>として<span style="color:red; background: yellow; font-size:18px; font-weight:bold; padding:0px;">［入会費用］［年会費］が無料となります</span><br>
　　趣旨にご賛同頂けない場合には［前の画面に戻る］（左下ボタン）よりお戻りください
    </div>
    <div class="center-box">
      <a href="campaign.html" class="btn-campaign">特別会員わくわくキャンペーンの内容確認へ</a>
    </div>
    <h2>特別会員様登録フォーム　兼　無料体験講座お申込みフォーム</h2>

    <form id="form">
      <label for="name">申込者氏名</label>
      <input type="text" id="name" required>

      <label for="kana">ふりがな</label>
      <input type="text" id="kana" required>

      <label for="email">メールアドレス</label>
      <input type="email" id="email" required>

      <label for="tel">電話番号</label>
      <input type="text" id="tel" required>

      <label for="post">郵便番号</label>
      <input type="text" id="post" required>

      <label for="trialCourse">希望講座名（無料）</label>
      <select id="trialCourse" required>
        <option value="">選択してください</option>
        <option value="kssc00">Scratch体験講座（無料）</option>
      </select>
      <label>利用規約の確認</label>
      <div class="form-row terms-row"><input type="checkbox" id="agree" required>
        <label for="agree"><b><a href="terms.html" target="_blank">利用規約</a>に同意します</b></label>
      </div>
      
      <button type="submit" class="btn2"><b>無料体験講座</b>に申し込みます（兼特別会員登録）</button>
      <button class="btn-back" onclick="history.back()">前の画面に戻る</button>
      
      
   </form>
  </section>
</main>

<script>
// ===============================
// MAIN_GAS_URL 設定
// ===============================
const MAIN_GAS_URL = "https://script.google.com/macros/s/AKfycbzoVx7xtMgeWNJKXX8G3UnO22xuL1XkkegIc_A5fh2-z3cXcuoEj0_0qs-KyCVTXCg2/exec";

// ===============================
// 無料体験フォーム送信（no-cors）
// ===============================
document.getElementById("form").addEventListener("submit", function(event) {
  event.preventDefault();

  const data = {
    name: document.getElementById("name").value,
    kana: document.getElementById("kana").value,
    email: document.getElementById("email").value,
    tel: document.getElementById("tel").value,
    post: document.getElementById("post").value,
    courseId: document.getElementById("trialCourse").value
  };

fetch(MAIN_GAS_URL, {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(data)
  });

  alert("特別会員登録＆お試し無料講座の、お申込みを受け付けました！\nあなたの会員番号はメールにてご確認願います。");
});

</script>

<!-- ここまで このページだけの内容 -->

  <script src="script.js"></script>
<!-- ここまで -->

</body>
</html>
