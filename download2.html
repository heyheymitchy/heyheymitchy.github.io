<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><title>デジタルコンテンツ ダウンロード</title><meta name="viewport" content="width=device-width, initial-scale=1"><style>  body {    font-family: "Helvetica", "Arial", sans-serif;    background: #f5f7fa;    margin: 0;    padding: 20px;  }  .container {    max-width: 720px;    margin: auto;    background: #fff;    padding: 30px;    border-radius: 12px;    box-shadow: 0 4px 20px rgba(0,0,0,0.1);  }  h1 {    text-align: center;    color: #333;  }  .section {    margin-top: 30px;  }  .btn {    display: inline-block;    padding: 12px 20px;    background: #007bff;    color: #fff;    text-decoration: none;    border-radius: 6px;    font-size: 16px;  }  .btn:hover {    background: #0056b3;  }  .error {    color: #d9534f;    font-weight: bold;    text-align: center;    margin-top: 20px;  }  iframe {    width: 100%;    height: 315px;    border-radius: 8px;  }</style></head><body><div class="container">  <h1>デジタルコンテンツ ダウンロード</h1>  <div id="content">読み込み中...</div></div><script>// URLパラメータから session_id を取得const params = new URLSearchParams(window.location.search);const sessionId = params.get("session_id");if (!sessionId) {  document.getElementById("content").innerHTML =    '<p class="error">不正なアクセスです。</p>';} else {  // GAS API に問い合わせ  fetch(`https://script.google.com/macros/s/【あなたのWebApp URL】/exec?session_id=${sessionId}`)    .then(res => res.json())    .then(data => {      if (!data.valid) {        document.getElementById("content").innerHTML =          '<p class="error">購入が確認できません。</p>';        return;      }      // 動画      const videoHtml = `        <div class="section">          <h2>動画</h2>          <iframe src="https://www.youtube.com/embed/${data.youtube_id}" allowfullscreen></iframe>        </div>      `;      // PDF      const pdfHtml = `        <div class="section">          <h2>PDF教材</h2>          <a class="btn" href="${data.pdf_dl_url}">PDFをダウンロード</a>        </div>      `;      document.getElementById("content").innerHTML = videoHtml + pdfHtml;    })    .catch(() => {      document.getElementById("content").innerHTML =        '<p class="error">データの取得に失敗しました。</p>';    });}</script></body></html>
