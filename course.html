<!-- ++++++++++++++++++++++++++++++++++++++++++++++++++ -->
<!-- わくわくプログラミング工房　平兵道 -->
<!-- course.html -->
<!-- ==================================================
     ★講座データはCHECK_GASの「check」シートから取得
     ★course.html内に25講座の固定データは持たない
     ★SC固定は使用しない
     ================================================== -->
<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Course List</title>
  <link rel="stylesheet" href="style.css">

  <style>
    .course-list {
      display: grid;
      grid-template-columns: repeat(7, 130px);
      gap: 0;
      padding: 0;
      margin: 0 auto;
      justify-content: center;
    }

    .course-item {
      width: 120px;
      text-align: center;
      cursor: pointer;
      transition: 0.2s;
    }

    .course-item img {
      display: block;
      width: 120px;
      height: 120px;
      border-radius: 12px;
      transition: 0.2s;
      margin: 0;
      object-fit: contain;
    }

    .course-item:active img {
      transform: scale(0.9);
      filter: brightness(1.3) saturate(1.4);
      border-radius: 20px;
      box-shadow: 0 0 12px rgba(255, 105, 180, 0.6);
    }

    .course-item:hover img {
      transform: scale(1.12);
      filter: brightness(1.2) saturate(1.3);
      border-radius: 20px;
      box-shadow: 0 0 12px rgba(255, 105, 180, 0.6);
      transition: 0.25s ease;
    }

    .course-item:hover .course-title {
      color: #ff66cc;
      transform: scale(1.05);
      transition: 0.25s ease;
    }

    .course-id {
      font-size: 12px;
      color: #666666;
      margin-top: 2px;
    }

    .message {
      grid-column: 1 / -1;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
      margin: 40px 20px;
    }

    .message-error {
      color: #cc0000;
    }

    @media (max-width: 1000px) {
      .course-list {
        grid-template-columns: repeat(5, 130px);
      }
    }

    @media (max-width: 700px) {
      .course-list {
        grid-template-columns: repeat(3, 130px);
      }
    }

    @media (max-width: 450px) {
      .course-list {
        grid-template-columns: repeat(2, 130px);
      }
    }
  </style>
</head>

<body>

<div id="header"></div>

<h1 style="text-align:center;">
  なにがあるの　
  <font color="#ff66cc">
    気になる講座アイコンをクリックしてみてね
  </font>
</h1>

<div id="courseList" class="course-list"></div>

<div id="footer"></div>

<script src="script.js"></script>

<script>
/* ============================================================
   course.html
   ============================================================
   ★25講座のデータはHTMLに書かない
   ★CHECK_GASのcheckシートから取得する
   ★SC固定は使用しない
   ============================================================ */

/* ------------------------------------------------------------
   CHECK_GAS URL
   ------------------------------------------------------------ */
const CHECK_GAS_URL =
  "https://script.google.com/macros/s/AKfycbwQ3SNqsIAovU7ZJc_KX4BXodZYrGaGQ_zMBWX0CsD4aklcjZ9eUGL4GQqn3wSdOeIdAQ/exec";

/* ------------------------------------------------------------
   言語
   sessionStorageのlangを使用
   ------------------------------------------------------------ */
const lang =
  (
    sessionStorage.getItem("lang") || "ja"
  )
  .trim()
  .toLowerCase() === "en"
    ? "en"
    : "ja";


/* ------------------------------------------------------------
   表示エリア
   ------------------------------------------------------------ */
const courseList =
  document.getElementById("courseList");


/* ------------------------------------------------------------
   HTMLエスケープ
   ------------------------------------------------------------ */
function escapeHtml(value) {

  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* ------------------------------------------------------------
   画面エラー表示
   ------------------------------------------------------------ */
function showMessage(message, isError) {

  courseList.innerHTML = "";

  const div =
    document.createElement("div");

  div.className =
    "message" +
    (isError ? " message-error" : "");

  div.innerHTML =
    escapeHtml(message);

  courseList.appendChild(div);

}


/* ------------------------------------------------------------
   講座1件を画面に追加
   ------------------------------------------------------------ */
function addCourseItem(item) {

  const courseId =
    String(item.courseId || "")
      .trim()
      .toUpperCase();

  const title =
    String(item.title || "").trim();

  const icon =
    String(item.icon || "").trim();

  const pt =
    String(item.pt || "").trim();


  /* ----------------------------------------------------------
     courseIdがないデータは表示しない
     ---------------------------------------------------------- */
  if (!courseId) {
    return;
  }


  const div =
    document.createElement("div");

  div.className =
    "course-item";


  /* ----------------------------------------------------------
     アイコン＋タイトル
     ---------------------------------------------------------- */
  div.innerHTML = `

    <img
      src="${escapeHtml(icon)}"
      alt="${escapeHtml(title)}"
      loading="lazy"
    >

    <div class="course-title">
      ${escapeHtml(title)}
    </div>

    <div class="course-id">
      ${escapeHtml(courseId)}
    </div>

  `;


  /* ----------------------------------------------------------
     check.htmlへ移動
     ----------------------------------------------------------
     ★courseIdはitem.courseId
     ★SC固定値は使用しない
     ---------------------------------------------------------- */
  div.addEventListener(
    "click",
    function() {

      const params =
        new URLSearchParams();

      params.set(
        "courseId",
        courseId
      );

      params.set(
        "lang",
        lang
      );

      /*
       * 親講座の情報も渡す。
       * check.html側で使用可能。
       */
      params.set(
        "title",
        title
      );

      params.set(
        "icon",
        icon
      );

      if (pt) {

        params.set(
          "pt",
          pt
        );

      }


      window.location.href =
        "check.html?" +
        params.toString();

    }
  );


  courseList.appendChild(div);

}


/* ------------------------------------------------------------
   CHECK_GASから25講座を取得
   ------------------------------------------------------------ */
function loadCourses() {

  showMessage(
    "講座データを読み込んでいます……",
    false
  );


  const url =
    CHECK_GAS_URL +
    "?mode=groups" +
    "&lang=" +
    encodeURIComponent(lang);


  fetch(url)

    .then(function(response) {

      if (!response.ok) {

        throw new Error(
          "HTTPエラー：" +
          response.status
        );

      }

      return response.json();

    })


    .then(function(data) {

      /* ------------------------------------------------------
         GASがエラーを返した場合
         ------------------------------------------------------ */
      if (!data) {

        throw new Error(
          "CHECK_GASからデータが返されませんでした。"
        );

      }


      /* ------------------------------------------------------
         itemsを確認
         ------------------------------------------------------ */
      if (
        !Array.isArray(data.items)
      ) {

        throw new Error(
          data.error ||
          "講座一覧データがありません。"
        );

      }


      /* ------------------------------------------------------
         いったん画面をクリア
         ------------------------------------------------------ */
      courseList.innerHTML = "";


      /* ------------------------------------------------------
         GASから返った講座を表示
         ------------------------------------------------------ */
      data.items.forEach(function(item) {

        addCourseItem(item);

      });


      /* ------------------------------------------------------
         0件の場合
         ------------------------------------------------------ */
      if (
        data.items.length === 0
      ) {

        showMessage(
          data.error ||
          "講座データがありません。",
          true
        );

        return;

      }


      /* ------------------------------------------------------
         件数表示
         ------------------------------------------------------ */
      console.log(
        "CHECK_GAS 講座数：",
        data.items.length
      );

      console.log(
        "CHECK_GAS courseId：",
        data.items.map(function(item) {
          return item.courseId;
        })
      );


      /* ------------------------------------------------------
         25件未満の場合は警告を表示
         ------------------------------------------------------ */
      if (
        data.count !== undefined &&
        Number(data.count) < 25
      ) {

        const warning =
          document.createElement("div");

        warning.style.gridColumn =
          "1 / -1";

        warning.style.textAlign =
          "center";

        warning.style.color =
          "#cc6600";

        warning.style.fontWeight =
          "bold";

        warning.style.margin =
          "10px";

        warning.textContent =
          "CHECK_GASから取得できた講座は " +
          data.count +
          " 件です。checkシートの25講座データを確認してください。";

        courseList.appendChild(
          warning
        );

      }

    })


    .catch(function(error) {

      console.error(
        "course.html エラー：",
        error
      );


      showMessage(
        "講座データの取得に失敗しました。" +
        "\n" +
        String(error.message || error),
        true
      );

    });

}

/* ------------------------------------------------------------
   開始
   ------------------------------------------------------------ */
loadCourses();
</script>
</body>
</html>
