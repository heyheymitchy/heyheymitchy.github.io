<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Course List</title>

<style>
.course-list {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 20px;
  padding: 20px;
}
.course-item {
  text-align: center;
  cursor: pointer;
  transition: 0.2s;
}

.course-item img {
  width: 120px;
  height: 120px;
  border-radius: 12px;
  transition: 0.2s;
}

/* ▼クリックした瞬間のポップUI */
.course-item:active img {
  transform: scale(0.9);
  filter: brightness(1.3) saturate(1.4);
  border-radius: 20px;
  box-shadow: 0 0 12px rgba(255, 105, 180, 0.6); /* ピンク光 */
}
/* ▼ホバーしたときのポップUI */
.course-item:hover img {
  transform: scale(1.12);              /* 少し大きくなる */
  filter: brightness(1.2) saturate(1.3); /* 色が明るくなる */
  border-radius: 20px;                 /* 角を少し丸く */
  box-shadow: 0 0 12px rgba(255, 105, 180, 0.6); /* ピンクの光 */
  transition: 0.25s ease;              /* ふわっと変化 */
}

/* ▼ホバー時のタイトルも少しポップに */
.course-item:hover div {
  color: #ff66cc;                      /* ピンク色に変化 */
  transform: scale(1.05);
  transition: 0.25s ease;
}
</style>
</head>

<body>

<div id="courseList" class="course-list"></div>

<script>
// ▼ 日本語＋英語データ（data.js 不要）

// ▼ 言語判定
const lang = sessionStorage.getItem("lang") || "ja";
const start = lang === "ja" ? 101 : 901;
const end   = lang === "ja" ? 125 : 925;

// ▼ アイコン生成
const courseList = document.getElementById("courseList");

for (let pt = start; pt <= end; pt++) {
    const item = data_jaen[pt];
    if (!item) continue;

    const div = document.createElement("div");
    div.className = "course-item";

    div.innerHTML = `
        <img src="${item.icon}" alt="${item.title}">
        <div>${item.title}</div>
    `;

    div.addEventListener("click", () => {
        window.location.href = `check.html?pt=${pt}`;
    });

    courseList.appendChild(div);
}
</script>
