<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Course List</title>
<style>
.course-list {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 20px;
  justify-items: center;
  align-items: center;
  padding: 20px;
}
.course-item {
  text-align: center;
  cursor: pointer;
}
.course-item img {
  width: 120px;
  height: 120px;
  border-radius: 12px;
}
</style>
</head>
<body>

<div id="courseList" class="course-list"></div>

<script src="data.js"></script>
<script>
const lang = sessionStorage.getItem("lang") || "ja";
const start = lang === "ja" ? 101 : 901;
const end   = lang === "ja" ? 125 : 925;

const courseList = document.getElementById("courseList");

for (let pt = start; pt <= end; pt++) {
  const item = data_jaen[pt];
  if (!item) continue;

  const div = document.createElement("div");
  div.className = "course-item";
  div.innerHTML = `
    <img src="${item.icon}" alt="${item.title}">
    <div>${item.title}</div>
  `;
  div.addEventListener("click", () => {
    window.location.href = `check.html?pt=${pt}`;
  });
  courseList.appendChild(div);
}
</script>

</body>
</html>
