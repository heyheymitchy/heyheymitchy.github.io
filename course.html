<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- ================================================== -->
<!-- 共通ヘッダー -->
<!-- ================================================== -->

<!-- ================================================== -->
<!-- このページだけの内容 -->
<!-- ================================================== -->
<style>

/* 横方向の隙間 → 0px */
/* 縦方向の隙間 → 0px */
/* 外側の余白 → 0px */
/* 画像サイズ → 120px × 120px */
/* 7個並ぶ → 130px × 130px */

.course-list {

  display: grid;

  grid-template-columns:
    repeat(7, 130px);

  gap: 0;

  padding: 0;

  margin: 0 auto;

  justify-content: center;

}


.course-item {

  width: 120px;

  text-align: center;

  cursor: pointer;

  transition: 0.2s;

}


.course-item img {

  display: block;

  width: 120px;

  height: 120px;

  border-radius: 12px;

  transition: 0.2s;

  margin: 0;

}


/* ==================================================
   クリックした瞬間のポップUI
   ================================================== */

.course-item:active img {

  transform: scale(0.9);

  filter:
    brightness(1.3)
    saturate(1.4);

  border-radius: 20px;

  box-shadow:
    0 0 12px
    rgba(255, 105, 180, 0.6);

}


/* ==================================================
   マウスを乗せたときのポップUI
   ================================================== */

.course-item:hover img {

  transform: scale(1.12);

  filter:
    brightness(1.2)
    saturate(1.3);

  border-radius: 20px;

  box-shadow:
    0 0 12px
    rgba(255, 105, 180, 0.6);

  transition:
    0.25s ease;

}


/* ==================================================
   タイトル
   ================================================== */

.course-item:hover div {

  color: #ff66cc;

  transform: scale(1.05);

  transition:
    0.25s ease;

}

</style>


<!-- ================================================== -->
<!-- タイトル -->
<!-- ================================================== -->

  なにがあるの

    ? 101
    : 901;


const end =
  lang === "ja"
    ? 125
    : 925;


/* ==================================================
   アイコン生成
   ================================================== */

const courseList =
  document.getElementById(
    "courseList"
  );


/* ==================================================
   25講座を表示
   ================================================== */

  let pt = start;
  pt <= end;
  pt++
) {


  const item =
    data_jaen[pt];


  if (!item) {

    continue;

  }


  /* ==================================================
     講座アイテム作成
     ================================================== */

  const div =
    document.createElement(
      "div"
    );


  div.className =
    "course-item";


  /* ==================================================
     アイコン＋タイトル
     ================================================== */

  div.innerHTML = `

    <img
      src="${item.icon}"
      alt="${item.title}"
    >

    <div>
      ${item.title}
    </div>

  `;


  /* ==================================================
     クリック処理
     
     重要：
     
     以前：
     check.html?pt=101
     
     今回：
     check.html?courseId=SC
     
     25講座それぞれのcourseIdを
     check.htmlへ渡します。
     ================================================== */

    "click",
    function() {


      /* ==================================================
         courseId確認
         ================================================== */

      if (!item.courseId) {

        alert(
          "講座IDが設定されていません。"
        );

        return;

      }


      /* ==================================================
         check.htmlへ移動
         ================================================== */

      window.location.href =

        "check.html"

        + "?courseId="

        + encodeURIComponent(
            item.courseId
          );

    }
  );

     講座一覧へ追加
     ================================================== */

    div
  );
