<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>マイページ</title>

<style>
  body {
    font-family: "Rounded Mplus 1c", sans-serif;
    background: linear-gradient(135deg, #a8d8ff, #d0eaff);
    padding: 20px;
  }

  .box {
    background: #fff;
    padding: 20px;
    border-radius: 16px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    margin-bottom: 20px;
  }

  .btn {
    display: inline-block;
    background: #4da9ff;
    color: #fff;
    padding: 12px 20px;
    border-radius: 12px;
    text-decoration: none;
    font-size: 18px;
    margin-top: 10px;
    border: none;
    cursor: pointer;
  }

  .btn:hover {
    background: #1e90ff;
  }

  .error {
    color: #d00;
    font-weight: bold;
  }

  .loading {
    color: #666;
  }
</style>
</head>

<body>

<div class="box">
  <h2>会員情報</h2>

  <p>
    会員番号：
    <span id="memberID" class="loading">
      読み込み中...
    </span>
  </p>

  <p>
    お名前：
    <span id="name" class="loading">
      読み込み中...
    </span>
  </p>

  <p>
    受講講座：
    <span id="courseName" class="loading">
      読み込み中...
    </span>
  </p>
</div>


<div class="box">
  <h2>視聴期限</h2>

  <p>
    お申し込み日：
    <span id="createdAt">
      読み込み中...
    </span>
  </p>

  <p>
    視聴期限：
    <span id="expireDate">
      読み込み中...
    </span>
  </p>

  <p>
    残り日数：
    <span id="remainDays">
      読み込み中...
    </span>
    日
  </p>
</div>


<div class="box">
  <h2>動画プレイヤー</h2>

  <button
    class="btn"
    id="playVideoBtn">
    動画を再生する
  </button>

  <div
    id="videoUrl"
    style="margin-top:20px;">
  </div>
</div>


<div class="box">
  <h2>PDFビューア</h2>

  <button
    class="btn"
    id="viewPdfBtn">
    PDFを表示する
  </button>

  <div
    id="pdfUrl"
    style="margin-top:20px;">
  </div>
</div>


<div class="box">
  <h2>受講履歴</h2>

  <ul id="historyList">
    <li class="loading">
      読み込み中...
    </li>
  </ul>
</div>


<div class="box">
  <h2>次のおすすめ講座</h2>

  <p id="nextCourseName">
    読み込み中...
  </p>
</div>


<script>

// ==================================================
// GAS Web API(API_URL = MAIN_GAS_URLのことです)
// ==================================================

const API_URL =
  "https://script.google.com/macros/s/AKfycbzoVx7xtMgeWNJKXX8G3UnO22xuL1XkkegIc_A5fh2-z3cXcuoEj0_0qs-KyCVTXCg2/exec";
  
// ==================================================
// 認証キー取得
//
// メールからのリンクは
//
// mypage.html#key=xxxxxxxx
//
// となる。
// URLの # 部分はサーバーへ送信されない。
// ==================================================

const searchParams =
  new URLSearchParams(
    window.location.search
  );

const hashParams =
  new URLSearchParams(
    window.location.hash.replace(/^#/, "")
  );


// 新方式：#key=
// 互換：?key=
// ※ ?member= は認証には使用しない。
const authKey =
  hashParams.get("key") ||
  searchParams.get("key") ||
  searchParams.get("authKey") ||
  "";


// ==================================================
// 認証キーを取得した直後にURLを通常表示へ戻す
//
// 重要：これは「見た目」の処理。
// 実際の認証はMAIN_GAS側でauthKeyを検証する。
// ==================================================

if (authKey) {

  try {

    window.history.replaceState(
      {},
      document.title,
      window.location.pathname
    );

  } catch (e) {

    console.warn(
      "URL表示の変更に失敗しました。",
      e
    );

  }

}


// ==================================================
// 受講講座の動画/PDF情報を保持
// ==================================================

let currentResources = {
  videoUrl: "",
  pdfUrl: ""
};


// ==================================================
// API URL作成
//
// authKeyをURLに付けてMAIN_GASへ送る。
// memberIDは送らない。
// ==================================================

function buildApiUrl(params = {}) {

  const query =
    new URLSearchParams();

  query.set(
    "key",
    authKey
  );

  Object.keys(params).forEach(key => {

    query.set(
      key,
      params[key]
    );

  });

  return (
    API_URL +
    "?" +
    query.toString()
  );

}


// ==================================================
// 認証キー確認
// ==================================================

if (!authKey) {

  console.error(
    "認証キーがありません。"
  );

  showAuthenticationError();

} else {

  // ==================================================
  // ① マイページ基本情報取得
  // ==================================================

  loadMemberInfo();


  // ==================================================
  // ② 受講講座取得
  // ==================================================

  loadResources();


  // ==================================================
  // ③ 受講履歴取得
  // ==================================================

  loadHistory();


  // ==================================================
  // ④ 次のおすすめ講座
  // ==================================================

  loadNextCourse();

}


// ==================================================
// 認証エラー表示
// ==================================================

function showAuthenticationError() {

  document.getElementById(
    "memberID"
  ).textContent =
    "認証情報がありません";

  document.getElementById(
    "memberID"
  ).className =
    "error";


  document.getElementById(
    "name"
  ).textContent =
    "登録完了メールのマイページリンクからアクセスしてください。";

  document.getElementById(
    "name"
  ).className =
    "error";


  document.getElementById(
    "courseName"
  ).textContent =
    "認証できません";


  document.getElementById(
    "courseName"
  ).className =
    "error";


  document.getElementById(
    "historyList"
  ).innerHTML =
    "<li class='error'>認証情報がありません。</li>";


  document.getElementById(
    "nextCourseName"
  ).textContent =
    "認証情報がありません";

}


// ==================================================
// ① マイページ情報取得
// ==================================================

function loadMemberInfo() {

  const url =
    buildApiUrl();

  fetch(url)

    .then(res => {

      if (!res.ok) {
        throw new Error(
          "HTTPエラー: " +
          res.status
        );
      }

      return res.json();

    })

    .then(json => {

      // ------------------------------------------
      // 認証エラー
      // ------------------------------------------

      if (
        json.authenticated === false ||
        json.success === false
      ) {

        throw new Error(
          json.error ||
          "認証に失敗しました。"
        );

      }


      // ------------------------------------------
      // 会員番号
      // ------------------------------------------

      document.getElementById(
        "memberID"
      ).textContent =
        json.memberID ||
        "登録情報なし";


      // ------------------------------------------
      // 氏名
      // ------------------------------------------

      document.getElementById(
        "name"
      ).textContent =
        json.name ||
        "登録情報なし";


      // ------------------------------------------
      // 受講講座
      // ------------------------------------------

      document.getElementById(
        "courseName"
      ).textContent =
        json.courseName ||
        "講座情報なし";


      // ------------------------------------------
      // 申し込み日
      // ------------------------------------------

      if (json.createdAt) {

        const createdDate =
          new Date(
            json.createdAt
          );

        if (
          !isNaN(
            createdDate.getTime()
          )
        ) {

          document.getElementById(
            "createdAt"
          ).textContent =
            formatDate(createdDate);

        } else {

          document.getElementById(
            "createdAt"
          ).textContent =
            json.createdAt;

        }

      } else {

        document.getElementById(
          "createdAt"
        ).textContent =
          "登録情報なし";

      }


      // ------------------------------------------
      // 視聴期限
      // ------------------------------------------

      if (json.expireDate) {

        const expireDate =
          new Date(
            json.expireDate
          );

        if (
          !isNaN(
            expireDate.getTime()
          )
        ) {

          document.getElementById(
            "expireDate"
          ).textContent =
            formatDate(expireDate);


          // MAIN_GASから返された値を優先
          if (
            typeof json.remainDays ===
            "number"
          ) {

            document.getElementById(
              "remainDays"
            ).textContent =
              json.remainDays;

          } else {

            const today =
              new Date();

            const remainDays =
              Math.ceil(
                (
                  expireDate -
                  today
                ) /
                (1000 * 60 * 60 * 24)
              );

            document.getElementById(
              "remainDays"
            ).textContent =
              remainDays;

          }

        } else {

          document.getElementById(
            "expireDate"
          ).textContent =
            "日付エラー";

          document.getElementById(
            "remainDays"
          ).textContent =
            "-";

        }

      } else {

        document.getElementById(
          "expireDate"
        ).textContent =
          "登録情報なし";

        document.getElementById(
          "remainDays"
        ).textContent =
          "-";

      }

    })

    .catch(error => {

      console.error(
        "会員情報取得エラー:",
        error
      );

      document.getElementById(
        "name"
      ).textContent =
        "認証エラー";

      document.getElementById(
        "name"
      ).className =
        "error";

      document.getElementById(
        "courseName"
      ).textContent =
        "マイページを開く権限を確認できません。";

      document.getElementById(
        "courseName"
      ).className =
        "error";

    });

}


// ==================================================
// ② 受講講座取得
// ==================================================

function loadResources() {

  const url =
    buildApiUrl({
      getResources: "1"
    });

  fetch(url)

    .then(async res => {

      const text =
        await res.text();

      let json;

      try {

        json =
          JSON.parse(text);

      } catch (e) {

        throw new Error(
          "MAIN_GASからJSONではないデータが返りました。"
        );

      }

      if (
        !res.ok ||
        json.success === false
      ) {

        throw new Error(
          json.error ||
          "受講講座取得エラー"
        );

      }

      return json;

    })

    .then(json => {

      currentResources = {

        videoUrl:
          json.videoUrl || "",

        pdfUrl:
          json.pdfUrl || ""

      };


      document.getElementById(
        "courseName"
      ).textContent =
        json.courseName ||
        "受講講座なし";

    })

    .catch(error => {

      console.error(
        "受講講座取得エラー:",
        error
      );

      currentResources = {
        videoUrl: "",
        pdfUrl: ""
      };

      document.getElementById(
        "courseName"
      ).textContent =
        "取得エラー";

      document.getElementById(
        "courseName"
      ).className =
        "error";

    });

}


// ==================================================
// ③ 受講履歴
// ==================================================

function loadHistory() {

  const url =
    buildApiUrl({
      getHistory: "1"
    });

  fetch(url)

    .then(res => {

      if (!res.ok) {

        throw new Error(
          "HTTPエラー: " +
          res.status
        );

      }

      return res.json();

    })

    .then(list => {

      const ul =
        document.getElementById(
          "historyList"
        );

      ul.innerHTML = "";


      if (
        !Array.isArray(list) ||
        list.length === 0
      ) {

        const li =
          document.createElement(
            "li"
          );

        li.textContent =
          "受講履歴はありません";

        ul.appendChild(li);

        return;

      }


      list.forEach(item => {

        const d =
          new Date(
            item.createdAt
          );

        const dateStr =
          !isNaN(d.getTime())
            ? formatDate(d)
            : item.createdAt;


        const li =
          document.createElement(
            "li"
          );


        li.textContent =
          dateStr +
          "：" +
          (
            item.courseId ||
            item.courseName ||
            "講座情報なし"
          );


        ul.appendChild(li);

      });

    })

    .catch(error => {

      console.error(
        "受講履歴取得エラー:",
        error
      );

      const ul =
        document.getElementById(
          "historyList"
        );

      ul.innerHTML =
        "<li class='error'>" +
        "受講履歴を取得できませんでした" +
        "</li>";

    });

}


// ==================================================
// ④ 次のおすすめ講座
// ==================================================

function loadNextCourse() {

  const url =
    buildApiUrl({
      getNextCourse: "1"
    });

  fetch(url)

    .then(res => {

      if (!res.ok) {

        throw new Error(
          "HTTPエラー: " +
          res.status
        );

      }

      return res.json();

    })

    .then(next => {

      const element =
        document.getElementById(
          "nextCourseName"
        );


      if (
        next &&
        next.success !== false &&
        next.nextCourseName
      ) {

        element.textContent =
          "次におすすめの講座：「" +
          next.nextCourseName +
          "」";

      } else {

        element.textContent =
          "現在おすすめの講座はありません";

      }

    })

    .catch(error => {

      console.error(
        "次講座取得エラー:",
        error
      );

      document.getElementById(
        "nextCourseName"
      ).textContent =
        "おすすめ講座を取得できませんでした";

    });

}


// ==================================================
// ⑤ 動画再生
//
// MAIN_GASからvideoUrlを取得し、YouTubeの場合は
// watch?v=... → /embed/... に変換してiframe表示。
// ==================================================

document
  .getElementById("playVideoBtn")
  .addEventListener(
    "click",
    async () => {

      if (!authKey) {

        alert(
          "認証情報を取得できません。"
        );

        return;

      }


      const button =
        document.getElementById(
          "playVideoBtn"
        );

      button.disabled = true;

      button.textContent =
        "動画を読み込み中...";


      try {

        const url =
          buildApiUrl({
            downloadVideo: "1"
          });


        const res =
          await fetch(url);

        const text =
          await res.text();


        let json;

        try {

          json =
            JSON.parse(text);

        } catch (e) {

          throw new Error(
            "MAIN_GASから動画URLのJSONを取得できませんでした。"
          );

        }


        if (
          json.error ===
          "expired"
        ) {

          alert(
            "視聴期限が終了しています。"
          );

          return;

        }


        if (
          !res.ok ||
          json.success === false ||
          !json.videoUrl
        ) {

          throw new Error(
            json.error ||
            "動画URLを取得できませんでした。"
          );

        }


        const embedUrl =
          toYouTubeEmbedUrl(
            json.videoUrl
          );


        document.getElementById(
          "videoUrl"
        ).innerHTML = `

          <iframe
            src="${escapeHtmlAttribute(embedUrl)}"
            width="100%"
            height="450"
            style="border:none;border-radius:12px;"
            title="受講動画"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen>
          </iframe>

        `;


        document.getElementById(
          "videoUrl"
        ).scrollIntoView({
          behavior: "smooth",
          block: "start"
        });


      } catch (error) {

        console.error(
          "動画取得エラー:",
          error
        );

        alert(
          "動画の再生に失敗しました。\n" +
          error.message
        );


      } finally {

        button.disabled = false;

        button.textContent =
          "動画を再生する";

      }

    }
  );


// ==================================================
// YouTube URLをiframe用URLへ変換
// ==================================================

function toYouTubeEmbedUrl(url) {

  const value =
    String(
      url || ""
    ).trim();


  // すでにembed URL
  if (
    value.includes(
      "youtube.com/embed/"
    )
  ) {

    return value;

  }


  // watch?v=VIDEO_ID
  const match =
    value.match(
      /[?&]v=([^&]+)/
    );


  if (match) {

    return (
      "https://www.youtube.com/embed/" +
      encodeURIComponent(
        match[1]
      )
    );

  }


  // youtu.be/VIDEO_ID
  const shortMatch =
    value.match(
      /youtu\.be\/([^?&]+)/
    );


  if (shortMatch) {

    return (
      "https://www.youtube.com/embed/" +
      encodeURIComponent(
        shortMatch[1]
      )
    );

  }


  // YouTube以外
  return value;

}


// ==================================================
// HTML属性エスケープ
// ==================================================

function escapeHtmlAttribute(value) {

  return String(
    value || ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    );

}


// ==================================================
// ⑥ PDFビューア
//
// MAIN_GASからpdfUrlを取得してiframe表示。
// ==================================================

document
  .getElementById("viewPdfBtn")
  .addEventListener(
    "click",
    async () => {

      if (!authKey) {

        alert(
          "認証情報を取得できません。"
        );

        return;

      }


      const button =
        document.getElementById(
          "viewPdfBtn"
        );

      button.disabled = true;

      button.textContent =
        "PDFを読み込み中...";


      try {

        const url =
          buildApiUrl({
            downloadPdf: "1"
          });


        const res =
          await fetch(url);

        const text =
          await res.text();


        let json;

        try {

          json =
            JSON.parse(text);

        } catch (e) {

          throw new Error(
            "MAIN_GASからPDF URLのJSONを取得できませんでした。"
          );

        }


        if (
          json.error ===
          "expired"
        ) {

          alert(
            "視聴期限が終了しています。"
          );

          return;

        }


        if (
          !res.ok ||
          json.success === false ||
          !json.pdfUrl
        ) {

          throw new Error(
            json.error ||
            "PDF URLを取得できませんでした。"
          );

        }


        document.getElementById(
          "pdfUrl"
        ).innerHTML = `

          <iframe
            src="${escapeHtmlAttribute(json.pdfUrl)}"
            width="100%"
            height="700px"
            style="border:none;border-radius:12px;background:#fff;"
            title="教材PDF">
          </iframe>

        `;


        document.getElementById(
          "pdfUrl"
        ).scrollIntoView({
          behavior: "smooth",
          block: "start"
        });


      } catch (error) {

        console.error(
          "PDF取得エラー:",
          error
        );

        alert(
          "PDFの表示に失敗しました。\n" +
          error.message
        );


      } finally {

        button.disabled = false;

        button.textContent =
          "PDFを表示する";

      }

    }
  );


// ==================================================
// 日付表示
// ==================================================

function formatDate(date) {

  return (
    date.getFullYear() +
    "年" +
    (date.getMonth() + 1) +
    "月" +
    date.getDate() +
    "日"
  );

}
</script>
</body>
</html>
