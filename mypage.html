<!-- ++++++++++++++++++++++++++++++++++++++++++++++++++ -->
<!-- わくわくプログラミング工房　平兵道　のホームページ -->
<!-- ++++++++++++++++++++++++++++++++++++++++++++++++++ -->
<!--  mypage.html -->
<!-- 会員様の個人専用ページ -->

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>マイページ</title>

<style>
  body {
    font-family: "Rounded Mplus 1c", sans-serif;
    background: linear-gradient(135deg, #a8d8ff, #d0eaff);
    padding: 20px;
  }

  .box {
    background: #fff;
    padding: 20px;
    border-radius: 16px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    margin-bottom: 20px;
  }

  .btn {
    display: inline-block;
    background: #4da9ff;
    color: #fff;
    padding: 12px 20px;
    border-radius: 12px;
    text-decoration: none;
    font-size: 18px;
    margin-top: 10px;
    border: none;
    cursor: pointer;
  }

  .btn:hover {
    background: #1e90ff;
  }

  .error {
    color: #d00;
    font-weight: bold;
  }

  .loading {
    color: #666;
  }
</style>
</head>

<body>

<div class="box">
  <h2>会員情報</h2>
  <p>会員番号：<span id="memberID" class="loading">読み込み中...</span></p>
  <p>お名前：<span id="name" class="loading">読み込み中...</span></p>
  <p>受講講座：<span id="courseName" class="loading">読み込み中...</span></p>
</div>

<div class="box">
  <h2>視聴期限</h2>
  <p>お申し込み日：<span id="createdAt">読み込み中...</span></p>
  <p>視聴期限：<span id="expireDate">読み込み中...</span></p>
  <p>残り日数：<span id="remainDays">読み込み中...</span>日</p>
</div>

<div class="box">
  <h2>動画プレイヤー</h2>
  <button class="btn" id="playVideoBtn">動画を再生する</button>
  <div id="videoExpiredMessage" class="error" style="display:none;margin-top:20px;">
    動画再生できません（視聴期限切れ）
  </div>
  <div id="videoUrl" style="margin-top:20px;"></div>
</div>

<div class="box">
  <h2>PDFビューア</h2>
  <button class="btn" id="viewPdfBtn">PDFを表示する</button>
  <div id="pdfExpiredMessage" class="error" style="display:none;margin-top:20px;">
    PDFを表示できません（表示期限切れ）
  </div>
  <div id="pdfUrl" style="margin-top:20px;"></div>
</div>

<div class="box">
  <h2>受講履歴</h2>
  <ul id="historyList">
    <li class="loading">読み込み中...</li>
  </ul>
</div>

<div class="box">
  <h2>次のおすすめ講座</h2>
  <p id="nextCourseName">読み込み中...</p>
</div>


<script>

// ==================================================
// GAS Web API(API_URL = MAIN_GAS_URLのこと)
// ==================================================

const API_URL =
  "https://script.google.com/macros/s/AKfycbwMtxPxFSsIZHIvcO32sckIGnCuJP9vVeSJ6Op3LzmSlK-FeV7HvknE644VvC3TVDkV/exec";


// ==================================================
// 認証キー取得
//
// 正式方式：mypage.html#key=xxxxxxxx
// 互換方式：mypage.html?key=xxxxxxxx
// mypage.html?authKey=xxxxxxxx
// ==================================================

const searchParams =
  new URLSearchParams(
    window.location.search
  );

const hashText =
  window.location.hash
    .replace(/^#/, "")
    .trim();

const hashParams =
  new URLSearchParams(
    hashText
  );


// 新方式：#key=
// 互換：?key=
// ※ ?member= は認証には使用しない。

let authKey =
  hashParams.get("key") ||
  hashParams.get("authKey") ||
  searchParams.get("key") ||
  searchParams.get("authKey") ||
  "";

authKey =
  String(authKey || "").trim();


// ==================================================
// デバッグ
// ==================================================

console.log(
  "mypage 認証キー取得結果：",
  authKey
    ? "取得成功"
    : "取得失敗"
);


// ==================================================
// 認証キー取得後はsessionStorageにも一時保存
//
// ※ localStorageではなくsessionStorageを使用
// ==================================================

if (authKey) {

  try {

    sessionStorage.setItem(
      "mypage_authKey",
      authKey
    );

  } catch (e) {

    console.warn(
      "sessionStorage保存に失敗しました。",
      e
    );

  }

}


// ==================================================
// URLにキーが無い場合は
// sessionStorageから復元
// ==================================================

if (!authKey) {

  try {

    authKey =
      sessionStorage.getItem(
        "mypage_authKey"
      ) || "";

  } catch (e) {

    console.warn(
      "sessionStorage取得に失敗しました。",
      e
    );

  }

}

authKey =
  String(authKey || "").trim();


// ==================================================
// 認証キー取得後はURLの#keyを非表示にする
// ==================================================

if (authKey) {

  try {

    window.history.replaceState(
      {},
      document.title,
      window.location.pathname
    );

  } catch (e) {

    console.warn(
      "URL表示の変更に失敗しました。",
      e
    );

  }

}


// ==================================================
// 受講講座の動画/PDF情報を保持
// ==================================================

let currentResources = {
  videoUrl: "",
  pdfUrl: ""
};


// 視聴期限切れ状態の時（trueの時）は
// 動画・PDFを表示しない。

let accessExpired = false;


// ==================================================
// API URL作成
//
// authKeyをURLに付けてMAIN_GASへ送る。
// memberIDは送らない。
// ==================================================

function buildApiUrl(params = {}) {

  const query =
    new URLSearchParams();

  query.set(
    "key",
    authKey
  );

  Object.keys(params).forEach(key => {

    query.set(
      key,
      params[key]
    );

  });

  return (
    API_URL +
    "?" +
    query.toString()
  );

}


// ==================================================
// 認証キー確認
//
// ifはエラー処理
// elseは正常処理（各種情報の取得）
// ==================================================

if (!authKey) {

  console.error(
    "認証キーがありません。"
  );

  showAuthenticationError();

} else {

  // ==================================================
  // ① マイページ基本情報取得
  // ==================================================

  loadMemberInfo();


  // ==================================================
  // ② 受講講座取得
  // ==================================================

  loadResources();


  // ==================================================
  // ③ 受講履歴取得
  // ==================================================

  loadHistory();


  // ==================================================
  // ④ 次のおすすめ講座
  // ==================================================

  loadNextCourse();

}


// ==================================================
// 認証エラー表示
// ==================================================

function showAuthenticationError() {

  document.getElementById(
    "memberID"
  ).textContent =
    "認証情報がありません";

  document.getElementById(
    "memberID"
  ).className = "error";


  document.getElementById(
    "name"
  ).textContent =
    "登録完了メールのマイページリンクからアクセスしてください。";

  document.getElementById(
    "name"
  ).className = "error";


  document.getElementById(
    "courseName"
  ).textContent =
    "認証できません";

  document.getElementById(
    "courseName"
  ).className = "error";


  document.getElementById(
    "historyList"
  ).innerHTML =
    "<li class='error'>認証情報がありません。</li>";


  document.getElementById(
    "nextCourseName"
  ).textContent =
    "認証情報がありません";

}


// ==================================================
// ① マイページ情報取得
// ==================================================

function loadMemberInfo() {

  const url =
    buildApiUrl();

  fetch(url)

    .then(res => {

      if (!res.ok) {

        throw new Error(
          "HTTPエラー: " +
          res.status
        );

      }

      return res.json();

    })

    .then(json => {

      // ------------------------------------------
      // 認証エラー
      // ------------------------------------------

      if (
        json.authenticated === false ||
        json.success === false
      ) {

        throw new Error(
          json.error ||
          "認証に失敗しました。"
        );

      }


      // ------------------------------------------
      // 会員番号
      // ------------------------------------------

      document.getElementById(
        "memberID"
      ).textContent =
        json.memberID ||
        "登録情報なし";


      // ------------------------------------------
      // 氏名
      // ------------------------------------------

      document.getElementById(
        "name"
      ).textContent =
        json.name ||
        "登録情報なし";


      // ------------------------------------------
      // 受講講座
      //
      // ★修正：
      // courseNameだけでなくcourseIdも保持する。
      //
      // ここでは表示だけ行う。
      // 最終的な「最新受講講座」の表示は
      // loadResources()側で行う。
      // ------------------------------------------

      let initialCourseName =
        json.courseName ||
        json.courseId ||
        "講座情報なし";

      document.getElementById(
        "courseName"
      ).textContent =
        initialCourseName;


      // ------------------------------------------
      // 申し込み日
      // ------------------------------------------

      if (json.createdAt) {

        const createdDate =
          new Date(
            json.createdAt
          );

        if (
          !isNaN(
            createdDate.getTime()
          )
        ) {

          document.getElementById(
            "createdAt"
          ).textContent =
            formatDate(
              createdDate
            );

        } else {

          document.getElementById(
            "createdAt"
          ).textContent =
            json.createdAt;

        }

      } else {

        document.getElementById(
          "createdAt"
        ).textContent =
          "登録情報なし";

      }


      // ------------------------------------------
      // 視聴期限
      //
      // 例：expire_days = 7
      // 決済日      = 9月23日
      // 視聴期限    = 9月30日
      //
      // 9月29日までは閲覧可能
      // 9月30日になった時点で閲覧不可
      // ------------------------------------------

      let expireDate = null;


      if (json.expireDate) {

        expireDate =
          new Date(
            json.expireDate
          );

      }

      // MAIN_GASがexpireDateを返さない場合の予備処理
      // expire_days / expireDays と createdAt から計算する。

      else if (
        json.createdAt &&
        (
          json.expire_days !== undefined ||
          json.expireDays !== undefined
        )
      ) {

        const expire
