<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>マイページ</title>
<style>
  body {
    font-family: "Rounded Mplus 1c", sans-serif;
    background: linear-gradient(135deg, #a8d8ff, #d0eaff);
    padding: 20px;
  }
  .box {
    background: #fff;
    padding: 20px;
    border-radius: 16px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    margin-bottom: 20px;
  }
  .btn {
    display: inline-block;
    background: #4da9ff;
    color: #fff;
    padding: 12px 20px;
    border-radius: 12px;
    text-decoration: none;
    font-size: 18px;
    margin-top: 10px;
  }
  .btn:hover {
    background: #1e90ff;
  }
</style>
</head>

<body>

<div class="box">
  <h2>会員情報</h2>
  <p>会員番号：<span id="memberId"></span></p>
  <p>お名前：<span id="memberName"></span></p>
  <p>受講講座：<span id="courseName"></span></p>
</div>

<div class="box">
  <h2>視聴期限</h2>
  <p>お申し込み日：<span id="createdAt"></span></p>
  <p>視聴期限：<span id="expireDate"></span></p>
  <p>残り日数：<span id="remainDays"></span> 日</p>
</div>

<div class="box">
  <h2>動画プレイヤー</h2>
  <button class="btn" id="playVideoBtn">動画を再生する</button>
  <div id="videoPlayerArea" style="margin-top:20px;"></div>
</div>

<div class="box">
  <h2>PDFビューア</h2>
  <button class="btn" id="viewPdfBtn">PDFを表示する</button>
  <div id="pdfViewerArea" style="margin-top:20px;"></div>
</div>

<div class="box">
  <h2>受講履歴</h2>
  <ul id="historyList"></ul>
</div>

<div class="box">
  <h2>次のおすすめ講座</h2>
  <p id="nextCourseName"></p>
</div>

<script>
  // GASをデプロイしたらＵＲＬ修正すること８１行目

// URLから memberId を取得
const params = new URLSearchParams(window.location.search);
const memberId = params.get("memberId");

// GAS Web API URL
const API_URL = "https://script.google.com/macros/s/AKfycbwW4xvhJtdcnWtysOwGSfbtB4syxuF3ruLCunKCj6MiTaEry2_9gsASxEZQ5aIJuOE/exec";

// ------------------------------
// ① マイページ情報取得（期限＋講座名）
// ------------------------------
fetch(`${API_URL}?memberId=${memberId}`)
  .then(res => res.json())
  .then(json => {

    // 期限情報
    const expireDate = new Date(json.expireDate);
    const expireStr = `${expireDate.getFullYear()}年${expireDate.getMonth()+1}月${expireDate.getDate()}日`;

    const createdAt = new Date(json.createdAt);
    const createdStr = `${createdAt.getFullYear()}年${createdAt.getMonth()+1}月${createdAt.getDate()}日`;

    const today = new Date();
    const remainDays = Math.ceil((expireDate - today) / (1000 * 60 * 60 * 24));

    // 表示
    document.getElementById("memberId").textContent = json.memberId;
    document.getElementById("createdAt").textContent = createdStr;
    document.getElementById("expireDate").textContent = expireStr;
    document.getElementById("remainDays").textContent = remainDays;

    // 講座名取得（getResources）
    fetch(`${API_URL}?getResources=1&memberId=${memberId}`)
      .then(res => res.json())
      .then(r => {
        document.getElementById("courseName").textContent = r.courseName;
      });
  });


// ------------------------------
// ② 動画ストリーミング再生
// ------------------------------
document.getElementById("playVideoBtn").addEventListener("click", () => {

  fetch(`${API_URL}?downloadVideo=1&memberId=${memberId}`)
    .then(res => {

      if (res.headers.get("Content-Type").includes("application/json")) {
        return res.json().then(json => {
          if (json.error === "expired") {
            alert("視聴期限が終了しています");
          }
        });
      }

      return res.blob();
    })
    .then(blob => {
      if (!blob) return;

      const url = URL.createObjectURL(blob);

      document.getElementById("videoPlayerArea").innerHTML = `
        <video controls autoplay width="100%" style="border-radius: 12px;">
          <source src="${url}" type="video/mp4">
        </video>
      `;
    });
});


// ------------------------------
// ③ PDFビューア（iframe表示）
// ------------------------------
document.getElementById("viewPdfBtn").addEventListener("click", () => {

  fetch(`${API_URL}?downloadPdf=1&memberId=${memberId}`)
    .then(res => {

      if (res.headers.get("Content-Type").includes("application/json")) {
        return res.json().then(json => {
          if (json.error === "expired") {
            alert("視聴期限が終了しています");
          }
        });
      }

      return res.blob();
    })
    .then(blob => {
      if (!blob) return;

      const url = URL.createObjectURL(blob);

      document.getElementById("pdfViewerArea").innerHTML = `
        <iframe src="${url}" width="100%" height="600px"
          style="border:none; border-radius:12px; background:#fff;"></iframe>
      `;
    });
});

// 受講履歴表示
fetch(`${API_URL}?getHistory=1&memberId=${memberId}`)
  .then(res => res.json())
  .then(list => {
    const ul = document.getElementById("historyList");
    ul.innerHTML = "";
    list.forEach(item => {
      const d = new Date(item.createdAt);
      const dateStr = `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
      const li = document.createElement("li");
      li.textContent = `${dateStr}：${item.courseId}`;
      ul.appendChild(li);
    });
  });

// 次の講座案内表示
fetch(`${API_URL}?getNextCourse=1&memberId=${memberId}`)
  .then(res => res.json())
  .then(next => {
    if (!next || !next.nextCourseName) return;
    document.getElementById("nextCourseName").textContent =
      `次におすすめの講座：「${next.nextCourseName}」`;
  });
  
</script>

</body>
</html>
