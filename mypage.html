<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>マイページ</title>
<style>
  body {
    font-family: "Rounded Mplus 1c", sans-serif;
    background: linear-gradient(135deg, #a8d8ff, #d0eaff);
    padding: 20px;
  }
  .box {
    background: #fff;
    padding: 20px;
    border-radius: 16px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    margin-bottom: 20px;
  }
  .btn {
    display: inline-block;
    background: #4da9ff;
    color: #fff;
    padding: 12px 20px;
    border-radius: 12px;
    text-decoration: none;
    font-size: 18px;
    margin-top: 10px;
    border: none;
    cursor: pointer;
  }
  .btn:hover {
    background: #1e90ff;
  }
  .error {
    color: #d00;
    font-weight: bold;
  }
  .loading {
    color: #666;
  }
</style>
</head>
<body>
<div class="box">
  <h2>会員情報</h2>
  <p>会員番号：<span id="memberID" class="loading">読み込み中...</span></p>
  <p>お名前：<span id="name" class="loading">読み込み中...</span></p>
  <p>受講講座：<span id="courseName" class="loading">読み込み中...</span></p>
</div>

<div class="box">
  <h2>視聴期限</h2>
  <p>お申し込み日：<span id="createdAt">読み込み中...</span></p>
  <p> 視聴期限：<span id="expireDate">読み込み中...</span></p>
  <p>残り日数：<span id="remainDays">読み込み中...</span> 日</p>
</div>

<div class="box">
  <h2>動画プレイヤー</h2>
  <button class="btn" id="playVideoBtn">動画を再生する</button>
  <div id="videoUrl" style="margin-top:20px;">
  </div>
</div>

<div class="box">
  <h2>PDFビューア</h2>
  <button class="btn" id="viewPdfBtn">PDFを表示する</button>
  <div id="pdfUrl" style="margin-top:20px;"></div>
</div>

<div class="box">
  <h2>受講履歴</h2>
  <ul id="historyList">
    <li class="loading">読み込み中...</li>
  </ul>
</div>

<div class="box">
  <h2>次のおすすめ講座</h2>
  <p id="nextCourseName">読み込み中...</p>
</div>

<script>
// ==================================================
// GAS Web API(API_URL = MAIN_GAS_URLのことです)
// ==================================================
const API_URL =
  "https://script.google.com/macros/s/AKfycby2dBIY1XiSUUROagoe54SzYs0oIUuXnRiaQdyWTVY7ekZW4tSvaKqm6L1f0Iz5RCg/exec";
  
// ==================================================
// URLから会員番号を取得
// ==================================================
//Stripeのsuccess_urlは:?member=WKS0016（例）
// なので「member」を取得する。
// ==================================================
const params =
  new URLSearchParams(
    window.location.search
  );

const memberID =
  params.get("member");

// 受講講座の動画/PDF情報を保持
let currentResources = {
  videoUrl: "",
  pdfUrl: ""
};

console.log(
  "URL:",
  window.location.href
);

console.log(
  "取得したmemberID:",
  memberID
);

// ==================================================
// 会員番号チェック
// ==================================================
if (!memberID) {

  console.error(
    "URLにmemberがありません。"
  );

  document.getElementById(
    "memberID"
  ).textContent =
    "会員番号が取得できません";

  document.getElementById(
    "memberID"
  ).className =
    "error";

} else {

  // URL取得値をまず表示
  document.getElementById(
    "memberID"
  ).textContent =
    memberID;

  // ==================================================
  // ① マイページ基本情報取得
  // ==================================================
  loadMemberInfo();

  // ==================================================
  // ② 受講講座取得
  // ==================================================
  loadResources();

  // ==================================================
  // ③ 受講履歴取得
  // ==================================================
  loadHistory();

  // ==================================================
  // ④ 次のおすすめ講座
  // ==================================================

  loadNextCourse();
}

// ==================================================
// ① マイページ情報取得
// ==================================================
function loadMemberInfo() {
  const url = API_URL + "?memberID=" + encodeURIComponent(memberID);
  console.log("会員情報API:",url);

  fetch(url)
    .then(res => {
      console.log("会員情報 HTTP:",res.status);

      if (!res.ok) {
        throw new Error("HTTPエラー: " + res.status );
      }

      return res.json();
    })

    .then(json => {
      console.log("会員情報API Response:",json);

      // ------------------------------------------
      // APIエラー
      // ------------------------------------------
      if (json.error) {
        throw new Error(
          json.error
        );
      }

      // ------------------------------------------
      // 会員番号
      // ------------------------------------------
      if (json.memberID) {
        document.getElementById(
          "memberID"
        ).textContent =
          json.memberID;

      } else {

        document.getElementById(
          "memberID"
        ).textContent =
          memberID;
      }

      // ------------------------------------------
      // 氏名
      // ------------------------------------------
      // APIが name を返す場合
      // ------------------------------------------
      document.getElementById(
        "name"
      ).textContent =
        json.name ||
        json.name ||
        "登録情報なし";

      // ------------------------------------------
      // 申し込み日
      // ------------------------------------------
      if (json.createdAt) {
        const createdDate =
          new Date(
            json.createdAt
          );

        if (
          !isNaN(
            createdDate.getTime()
          )
        ) {

          document.getElementById(
            "createdAt"
          ).textContent =
            formatDate(createdDate);

        } else {

          document.getElementById(
            "createdAt"
          ).textContent =
            json.createdAt;
        }

      } else {

        document.getElementById(
          "createdAt"
        ).textContent =
          "登録情報なし";
      }

      // ------------------------------------------
      // 視聴期限
      // ------------------------------------------
      if (json.expireDate) {
        const expireDate =
          new Date(
            json.expireDate
          );

        if (
          !isNaN(
            expireDate.getTime()
          )
        ) {

          document.getElementById(
            "expireDate"
          ).textContent =
            formatDate(expireDate);

          // ----------------------------------------
          // 残り日数
          // ----------------------------------------
          const today = new Date();
          const remainDays =
            Math.ceil(
              (expireDate - today) / (1000 * 60 * 60 * 24 )
            );

          document.getElementById(
            "remainDays"
          ).textContent = remainDays;

        } else {
          document.getElementById(
            "expireDate"
          ).textContent = "日付エラー";

          document.getElementById(
            "remainDays"
          ).textContent = "-";
        }

      } else {
        document.getElementById(
          "expireDate"
        ).textContent = "登録情報なし";

        document.getElementById(
          "remainDays"
        ).textContent = "-";
      }

    })

    .catch(error => {
      console.error(
        "会員情報取得エラー:",
        error
      );

      document.getElementById(
        "name"
      ).textContent = "取得エラー";

      document.getElementById(
        "name"
      ).className = "error";

    });
}

// ==================================================
// ② 受講講座取得
// ==================================================
function loadResources() {

  const url =
    API_URL +
    "?getResources=1" +
    "&memberID=" +
    encodeURIComponent(memberID);

  console.log("受講講座API:", url);

  fetch(url)
    .then(async res => {
      const text = await res.text();

      console.log("受講講座 HTTP:", res.status);
      console.log("受講講座 Response:", text);

      let json;
      try {
        json = JSON.parse(text);
      } catch (e) {
        throw new Error("MAIN_GASからJSONではないデータが返りました。");
      }

      if (!res.ok || json.success === false) {
        throw new Error(json.error || "受講講座取得エラー");
      }

      return json;
    })
    .then(json => {

      currentResources = {
        videoUrl: json.videoUrl || "",
        pdfUrl: json.pdfUrl || ""
      };

      document.getElementById("courseName").textContent =
        json.courseName || "受講講座なし";

      console.log("動画URL:", currentResources.videoUrl);
      console.log("PDF URL:", currentResources.pdfUrl);
    })
    .catch(error => {

      console.error("受講講座取得エラー:", error);

      currentResources = {
        videoUrl: "",
        pdfUrl: ""
      };

      document.getElementById("courseName").textContent =
        "取得エラー";

      document.getElementById("courseName").className = "error";
    });
}

// ==================================================
// ③ 受講履歴
// ==================================================
function loadHistory() {
  const url = API_URL + "?getHistory=1" + "&memberID=" +
    encodeURIComponent(memberID);

  console.log("受講履歴API:", url
  );

  fetch(url)
    .then(res => {
      console.log("受講履歴 HTTP:",res.status
      );

      if (!res.ok) {

        throw new Error(
          "HTTPエラー: " + res.status
        );
      }

      return res.json();
    })

    .then(list => {

      console.log("受講履歴API Response:",list);

      const ul =
        document.getElementById(
          "historyList"
        );

      ul.innerHTML = "";

      if (
        !Array.isArray(list) ||
        list.length === 0
      ) {

        const li =
          document.createElement(
            "li"
          );

        li.textContent = "受講履歴はありません";
        ul.appendChild(li);
        return;
      }

      list.forEach(item => {
        const d =
          new Date(
            item.createdAt
          );

        const dateStr =
          !isNaN(d.getTime())
            ? formatDate(d)
            : item.createdAt;

        const li =
          document.createElement(
            "li"
          );

        li.textContent =
          dateStr +
          "：" +
          (
            item.courseId ||
            item.courseName ||
            "講座情報なし"
          );

        ul.appendChild(li);
      });

    })

    .catch(error => {

      console.error( "受講履歴取得エラー:", error
      );

      const ul =
        document.getElementById(
          "historyList"
        );

      ul.innerHTML =
        "<li class='error'>" +
        "受講履歴を取得できませんでした" +
        "</li>";
    });
}

// ==================================================
// ④ 次のおすすめ講座
// ==================================================
function loadNextCourse() {
  const url = API_URL + "?getNextCourse=1" + "&memberID=" +
    encodeURIComponent(memberID);

  console.log("次の講座API:",url
  );

  fetch(url)
    .then(res => {
      console.log( "次講座 HTTP:",res.status
      );

      if (!res.ok) {

        throw new Error(
          "HTTPエラー: " + res.status
        );
      }

      return res.json();
    })

    .then(next => {

      console.log( "次講座API Response:", next
      );


      const element =
        document.getElementById(
          "nextCourseName"
        );

      if (
        next &&
        next.nextCourseName
      ) {

        element.textContent =
          "次におすすめの講座：「" +
          next.nextCourseName +
          "」";

      } else {
        element.textContent =
          "現在おすすめの講座はありません";
      }
    })

    .catch(error => {
      console.error(
        "次講座取得エラー:",
        error
      );
      document.getElementById(
        "nextCourseName"
      ).textContent =
        "おすすめ講座を取得できませんでした";
    });
}

// ==================================================
// ⑤ 動画再生
//
// MAIN_GASからvideoUrlを取得し、YouTubeの場合は
// watch?v=... → /embed/... に変換してiframe表示します。
// ==================================================
document
  .getElementById("playVideoBtn")
  .addEventListener("click", async () => {

    if (!memberID) {
      alert("会員番号を取得できません。");
      return;
    }

    const button = document.getElementById("playVideoBtn");
    button.disabled = true;
    button.textContent = "動画を読み込み中...";

    try {

      // ボタン押下時にMAIN_GASへ再確認
      const url =
        API_URL +
        "?downloadVideo=1" +
        "&memberID=" +
        encodeURIComponent(memberID);

      console.log("動画API:", url);

      const res = await fetch(url);
      const text = await res.text();

      console.log("動画API Response:", text);

      let json;
      try {
        json = JSON.parse(text);
      } catch (e) {
        throw new Error("MAIN_GASから動画URLのJSONを取得できませんでした。");
      }

      if (json.error === "expired") {
        alert("視聴期限が終了しています。");
        return;
      }

      if (!res.ok || json.success === false || !json.videoUrl) {
        throw new Error(json.error || "動画URLを取得できませんでした。");
      }

      const embedUrl = toYouTubeEmbedUrl(json.videoUrl);

      document.getElementById("videoUrl").innerHTML = `
        <iframe
          src="${escapeHtmlAttribute(embedUrl)}"
          width="100%"
          height="450"
          style="border:none;border-radius:12px;"
          title="受講動画"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          allowfullscreen>
        </iframe>
      `;

      document.getElementById("videoUrl").scrollIntoView({
        behavior: "smooth",
        block: "start"
      });

    } catch (error) {

      console.error("動画取得エラー:", error);

      alert(
        "動画の再生に失敗しました。\n" +
        error.message
      );

    } finally {
      button.disabled = false;
      button.textContent = "動画を再生する";
    }
  });

// YouTube URLをiframe用URLへ変換
function toYouTubeEmbedUrl(url) {

  const value = String(url || "").trim();

  // すでにembed URLならそのまま
  if (value.includes("youtube.com/embed/")) {
    return value;
  }

  // watch?v=VIDEO_ID
  const match = value.match(/[?&]v=([^&]+)/);

  if (match) {
    return "https://www.youtube.com/embed/" +
      encodeURIComponent(match[1]);
  }

  // youtu.be/VIDEO_ID
  const shortMatch = value.match(/youtu\.be\/([^?&]+)/);

  if (shortMatch) {
    return "https://www.youtube.com/embed/" +
      encodeURIComponent(shortMatch[1]);
  }

  // YouTube以外なら元URLを返す
  return value;
}

function escapeHtmlAttribute(value) {
  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/"/g, "&quot;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

// ==================================================
// ⑥ PDFビューア
//
// MAIN_GASからpdfUrlを取得し、iframeで表示します。
// 現在のmasterシートのpdfUrlが
// https://heyheymitchy.github.io/hello.html#ja
// でも、そのまま表示できます。
// ==================================================
document
  .getElementById("viewPdfBtn")
  .addEventListener("click", async () => {

    if (!memberID) {
      alert("会員番号を取得できません。");
      return;
    }

    const button = document.getElementById("viewPdfBtn");
    button.disabled = true;
    button.textContent = "PDFを読み込み中...";

    try {

      const url =
        API_URL +
        "?downloadPdf=1" +
        "&memberID=" +
        encodeURIComponent(memberID);

      console.log("PDF API:", url);

      const res = await fetch(url);
      const text = await res.text();

      console.log("PDF API Response:", text);

      let json;
      try {
        json = JSON.parse(text);
      } catch (e) {
        throw new Error("MAIN_GASからPDF URLのJSONを取得できませんでした。");
      }

      if (json.error === "expired") {
        alert("視聴期限が終了しています。");
        return;
      }

      if (!res.ok || json.success === false || !json.pdfUrl) {
        throw new Error(json.error || "PDF URLを取得できませんでした。");
      }

      document.getElementById("pdfUrl").innerHTML = `
        <iframe
          src="${escapeHtmlAttribute(json.pdfUrl)}"
          width="100%"
          height="700px"
          style="border:none;border-radius:12px;background:#fff;"
          title="教材PDF">
        </iframe>
      `;

      document.getElementById("pdfUrl").scrollIntoView({
        behavior: "smooth",
        block: "start"
      });

    } catch (error) {

      console.error("PDF取得エラー:", error);

      alert(
        "PDFの表示に失敗しました。\n" +
        error.message
      );

    } finally {
      button.disabled = false;
      button.textContent = "PDFを表示する";
    }
  });

// ==================================================
// 日付表示
// ==================================================
function formatDate(date) {
  return (
    date.getFullYear() +
    "年" +
    (date.getMonth() + 1) +
    "月" +
    date.getDate() +
    "日"
  );
}
</script>
</body>
</html>
