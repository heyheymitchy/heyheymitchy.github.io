<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>マイページ</title>
<style>
  body {
    font-family: "Rounded Mplus 1c", sans-serif;
    background: linear-gradient(135deg, #a8d8ff, #d0eaff);
    padding: 20px;
  }
  .box {
    background: #fff;
    padding: 20px;
    border-radius: 16px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    margin-bottom: 20px;
  }
  .btn {
    display: inline-block;
    background: #4da9ff;
    color: #fff;
    padding: 12px 20px;
    border-radius: 12px;
    text-decoration: none;
    font-size: 18px;
    margin-top: 10px;
    border: none;
    cursor: pointer;
  }
  .btn:hover {
    background: #1e90ff;
  }
  .error {
    color: #d00;
    font-weight: bold;
  }
  .loading {
    color: #666;
  }
</style>
</head>
<body>
<div class="box">
  <h2>会員情報</h2>
  <p>会員番号：<span id="memberID" class="loading">読み込み中...</span></p>
  <p>お名前：<span id="name" class="loading">読み込み中...</span></p>
  <p>受講講座：<span id="courseName" class="loading">読み込み中...</span></p>
</div>

<div class="box">
  <h2>視聴期限</h2>
  <p>お申し込み日：<span id="createdAt">読み込み中...</span></p>
  <p> 視聴期限：<span id="expireDate">読み込み中...</span></p>
  <p>残り日数：<span id="remainDays">読み込み中...</span> 日</p>
</div>

<div class="box">
  <h2>動画プレイヤー</h2>
  <button class="btn" id="playVideoBtn">動画を再生する</button>
  <div id="videoUrl" style="margin-top:20px;">
  </div>
</div>

<div class="box">
  <h2>PDFビューア</h2>
  <button class="btn" id="viewPdfBtn">PDFを表示する</button>
  <div id="pdfUrl" style="margin-top:20px;"></div>
</div>

<div class="box">
  <h2>受講履歴</h2>
  <ul id="historyList">
    <li class="loading">読み込み中...</li>
  </ul>
</div>

<div class="box">
  <h2>次のおすすめ講座</h2>
  <p id="nextCourseName">読み込み中...</p>
</div>

<script>
// ==================================================
// GAS Web API
// ==================================================
const API_URL =
  "https://script.google.com/macros/s/AKfycbweOBfdDWjQqXeFCDpzc1mKIQz_LUJrC9FUxsp0ELKc3acU6K-wE0cFuYQyv9FL6dT3/exec";


// ==================================================
// URLから会員番号を取得
// ==================================================
//Stripeのsuccess_urlは:?member=WKS0016
// なので「member」を取得する。
// ==================================================
const params =
  new URLSearchParams(
    window.location.search
  );

const memberID =
  params.get("member");

console.log(
  "URL:",
  window.location.href
);

console.log(
  "取得したmemberID:",
  memberID
);

// ==================================================
// 会員番号チェック
// ==================================================
if (!memberID) {

  console.error(
    "URLにmemberがありません。"
  );

  document.getElementById(
    "memberID"
  ).textContent =
    "会員番号が取得できません";

  document.getElementById(
    "memberID"
  ).className =
    "error";

} else {

  // URL取得値をまず表示
  document.getElementById(
    "memberID"
  ).textContent =
    memberID;

  // ==================================================
  // ① マイページ基本情報取得
  // ==================================================
  loadMemberInfo();

  // ==================================================
  // ② 受講講座取得
  // ==================================================
  loadResources();

  // ==================================================
  // ③ 受講履歴取得
  // ==================================================
  loadHistory();

  // ==================================================
  // ④ 次のおすすめ講座
  // ==================================================

  loadNextCourse();
}

// ==================================================
// ① マイページ情報取得
// ==================================================
function loadMemberInfo() {
  const url = API_URL + "?memberID=" + encodeURIComponent(memberID);
  console.log("会員情報API:",url);

  fetch(url)
    .then(res => {
      console.log("会員情報 HTTP:",res.status);

      if (!res.ok) {
        throw new Error("HTTPエラー: " + res.status );
      }

      return res.json();
    })

    .then(json => {
      console.log("会員情報API Response:",json);

      // ------------------------------------------
      // APIエラー
      // ------------------------------------------
      if (json.error) {
        throw new Error(
          json.error
        );
      }

      // ------------------------------------------
      // 会員番号
      // ------------------------------------------
      if (json.memberID) {
        document.getElementById(
          "memberID"
        ).textContent =
          json.memberID;

      } else {

        document.getElementById(
          "memberID"
        ).textContent =
          memberID;
      }

      // ------------------------------------------
      // 氏名
      // ------------------------------------------
      // APIが name を返す場合
      // ------------------------------------------
      document.getElementById(
        "name"
      ).textContent =
        json.name ||
        json.name ||
        "登録情報なし";

      // ------------------------------------------
      // 申し込み日
      // ------------------------------------------
      if (json.createdAt) {
        const createdDate =
          new Date(
            json.createdAt
          );

        if (
          !isNaN(
            createdDate.getTime()
          )
        ) {

          document.getElementById(
            "createdAt"
          ).textContent =
            formatDate(createdDate);

        } else {

          document.getElementById(
            "createdAt"
          ).textContent =
            json.createdAt;
        }

      } else {

        document.getElementById(
          "createdAt"
        ).textContent =
          "登録情報なし";
      }

      // ------------------------------------------
      // 視聴期限
      // ------------------------------------------
      if (json.expireDate) {
        const expireDate =
          new Date(
            json.expireDate
          );

        if (
          !isNaN(
            expireDate.getTime()
          )
        ) {

          document.getElementById(
            "expireDate"
          ).textContent =
            formatDate(expireDate);

          // ----------------------------------------
          // 残り日数
          // ----------------------------------------
          const today = new Date();
          const remainDays =
            Math.ceil(
              (expireDate - today) / (1000 * 60 * 60 * 24 )
            );

          document.getElementById(
            "remainDays"
          ).textContent = remainDays;

        } else {
          document.getElementById(
            "expireDate"
          ).textContent = "日付エラー";

          document.getElementById(
            "remainDays"
          ).textContent = "-";
        }

      } else {
        document.getElementById(
          "expireDate"
        ).textContent = "登録情報なし";

        document.getElementById(
          "remainDays"
        ).textContent = "-";
      }

    })

    .catch(error => {
      console.error(
        "会員情報取得エラー:",
        error
      );

      document.getElementById(
        "name"
      ).textContent = "取得エラー";

      document.getElementById(
        "name"
      ).className = "error";

    });
}

// ==================================================
// ② 受講講座取得
// ==================================================
function loadResources() {
  const url = API_URL + "?getResources=1" + "&memberID=" +
    encodeURIComponent(memberID);

  console.log(
    "受講講座API:",url
  );

  fetch(url)
    .then(res => {
      console.log("受講講座 HTTP:",res.status
      );

      if (!res.ok) {

        throw new Error(
          "HTTPエラー: " + res.status
        );
      }

      return res.json();
    })

    .then(json => {

      console.log("受講講座API Response:",json
      );

      if (json.error) {

        throw new Error(
          json.error
        );
      }

      document.getElementById(
        "courseName"
      ).textContent =
        json.courseName ||
        json.name ||
        "受講講座なし";

    })

    .catch(error => {
      console.error(
        "受講講座取得エラー:",
        error
      );

      document.getElementById(
        "courseName"
      ).textContent =
        "取得エラー";

      document.getElementById(
        "courseName"
      ).className =
        "error";
    });
}

// ==================================================
// ③ 受講履歴
// ==================================================
function loadHistory() {
  const url = API_URL + "?getHistory=1" + "&memberID=" +
    encodeURIComponent(memberID);

  console.log("受講履歴API:", url
  );

  fetch(url)
    .then(res => {
      console.log("受講履歴 HTTP:",res.status
      );

      if (!res.ok) {

        throw new Error(
          "HTTPエラー: " + res.status
        );
      }

      return res.json();
    })

    .then(list => {

      console.log("受講履歴API Response:",list);

      const ul =
        document.getElementById(
          "historyList"
        );

      ul.innerHTML = "";

      if (
        !Array.isArray(list) ||
        list.length === 0
      ) {

        const li =
          document.createElement(
            "li"
          );

        li.textContent = "受講履歴はありません";
        ul.appendChild(li);
        return;
      }

      list.forEach(item => {
        const d =
          new Date(
            item.createdAt
          );

        const dateStr =
          !isNaN(d.getTime())
            ? formatDate(d)
            : item.createdAt;

        const li =
          document.createElement(
            "li"
          );

        li.textContent =
          dateStr +
          "：" +
          (
            item.courseId ||
            item.courseName ||
            "講座情報なし"
          );

        ul.appendChild(li);
      });

    })

    .catch(error => {

      console.error( "受講履歴取得エラー:", error
      );

      const ul =
        document.getElementById(
          "historyList"
        );

      ul.innerHTML =
        "<li class='error'>" +
        "受講履歴を取得できませんでした" +
        "</li>";
    });
}

// ==================================================
// ④ 次のおすすめ講座
// ==================================================
function loadNextCourse() {
  const url = API_URL + "?getNextCourse=1" + "&memberID=" +
    encodeURIComponent(memberID);

  console.log("次の講座API:",url
  );

  fetch(url)
    .then(res => {
      console.log( "次講座 HTTP:",res.status
      );

      if (!res.ok) {

        throw new Error(
          "HTTPエラー: " + res.status
        );
      }

      return res.json();
    })

    .then(next => {

      console.log( "次講座API Response:", next
      );


      const element =
        document.getElementById(
          "nextCourseName"
        );

      if (
        next &&
        next.nextCourseName
      ) {

        element.textContent =
          "次におすすめの講座：「" +
          next.nextCourseName +
          "」";

      } else {
        element.textContent =
          "現在おすすめの講座はありません";
      }
    })

    .catch(error => {
      console.error(
        "次講座取得エラー:",
        error
      );
      document.getElementById(
        "nextCourseName"
      ).textContent =
        "おすすめ講座を取得できませんでした";
    });
}

// ==================================================
// ⑤ 動画ストリーミング再生
// ==================================================
document
  .getElementById(
    "playVideoBtn"
  )
  .addEventListener(
    "click",
    () => {

      if (!memberID) {

        alert( "会員番号を取得できません。"
        );

        return;
      }


      const url =
        API_URL + "?downloadVideo=1" + "&memberID=" +
        encodeURIComponent(memberID);


      console.log( "動画API:", url
      );

      fetch(url)

        .then(async res => {

          const contentType =
            res.headers.get(
              "Content-Type"
            ) || "";


          console.log( "動画HTTP:",res.status,contentType
          );

          if (
            contentType.includes(
              "application/json"
            )
          ) {

            const json =
              await res.json();

            if (
              json.error ===
              "expired"
            ) {

              alert("視聴期限が終了しています"
              );

              return null;
            }

            throw new Error(
              json.error ||
              "動画取得エラー"
            );
          }


          if (!res.ok) {

            throw new Error(
              "HTTPエラー: " +
              res.status
            );
          }

          return res.blob();
        })

        .then(blob => {
          if (!blob) {
            return;
          }

          const url =
            URL.createObjectURL(
              blob
            );


          document.getElementById(
            "videoUrl"
          ).innerHTML = `

            <video
              controls
              autoplay
              width="100%"
              style="border-radius:12px;"
            >
              <source
                src="${url}"
                type="video/mp4"
              >
            </video>

          `;
        })

        .catch(error => {

          console.error(
            "動画取得エラー:",
            error
          );

          alert(
            "動画の取得に失敗しました。\n" +
            error.message
          );
        });
    }
  );

// ==================================================
// ⑥ PDFビューア
// ==================================================
document
  .getElementById(
    "viewPdfBtn"
  )
  .addEventListener(
    "click",
    () => {

      if (!memberID) {
        alert(
          "会員番号を取得できません。"
        );
        return;
      }

      const url =
        API_URL +
        "?downloadPdf=1" +
        "&memberID=" +
        encodeURIComponent(memberID);

      console.log(
        "PDF API:",
        url
      );

      fetch(url)

        .then(async res => {

          const contentType =
            res.headers.get(
              "Content-Type"
            ) || "";


          console.log(
            "PDF HTTP:",
            res.status,
            contentType
          );

          if (
            contentType.includes(
              "application/json"
            )
          ) {

            const json =
              await res.json();


            if (
              json.error ===
              "expired"
            ) {

              alert(
                "視聴期限が終了しています"
              );

              return null;
            }

            throw new Error(
              json.error ||
              "PDF取得エラー"
            );
          }

          if (!res.ok) {

            throw new Error(
              "HTTPエラー: " +
              res.status
            );
          }

          return res.blob();

        })

        .then(blob => {

          if (!blob) {
            return;
          }

          const url =
            URL.createObjectURL(
              blob
            );

          document.getElementById(
            "pdfUrl"
          ).innerHTML = `

            <iframe
              src="${url}"
              width="100%"
              height="600px"
              style="
                border:none;
                border-radius:12px;
                background:#fff;
              "
            ></iframe>

          `;
        })

        .catch(error => {

          console.error(
            "PDF取得エラー:",
            error
          );

          alert(
            "PDFの取得に失敗しました。\n" +
            error.message
          );
        });
    }
  );

// ==================================================
// 日付表示
// ==================================================
function formatDate(date) {
  return (
    date.getFullYear() +
    "年" +
    (date.getMonth() + 1) +
    "月" +
    date.getDate() +
    "日"
  );
}
</script>
</body>
</html>
