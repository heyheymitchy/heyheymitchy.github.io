<!-- ++++++++++++++++++++++++++++++++++++++++++++++++++ -->
<!-- わくわくプログラミング工房　平兵道 -->
<!-- mypage.html -->
<!-- 会員様の個人専用ページ -->
<!-- ++++++++++++++++++++++++++++++++++++++++++++++++++ -->

<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>
  マイページ｜わくわくプログラミング工房
</title>


<style>

/* ==========================================================
   全体
   ========================================================== */

body {

  font-family:
    "Rounded Mplus 1c",
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    Meiryo,
    sans-serif;

  background:
    linear-gradient(
      135deg,
      #a8d8ff,
      #d0eaff
    );

  padding: 20px;

  margin: 0;

  color: #333;

}


/* ==========================================================
   メイン
   ========================================================== */

.container {

  max-width: 900px;

  margin: 0 auto;

}


/* ==========================================================
   ボックス
   ========================================================== */

.box {

  background: #fff;

  padding: 20px;

  border-radius: 16px;

  box-shadow:
    0 4px 10px rgba(0,0,0,0.1);

  margin-bottom: 20px;

}


.box h2 {

  margin-top: 0;

  color: #333;

}


/* ==========================================================
   ボタン
   ========================================================== */

.btn {

  display: inline-block;

  background: #4da9ff;

  color: #fff;

  padding: 12px 20px;

  border-radius: 12px;

  text-decoration: none;

  font-size: 18px;

  margin-top: 10px;

  border: none;

  cursor: pointer;

}


.btn:hover {

  background: #1e90ff;

}


.btn:disabled {

  background: #aaa;

  cursor: not-allowed;

}


/* ==========================================================
   エラー
   ========================================================== */

.error {

  color: #d00;

  font-weight: bold;

}


/* ==========================================================
   読み込み中
   ========================================================== */

.loading {

  color: #666;

}


/* ==========================================================
   成功表示
   ========================================================== */

.success {

  color: #087f23;

  font-weight: bold;

}


/* ==========================================================
   情報表示
   ========================================================== */

.info {

  background: #f3f9ff;

  border-left:
    5px solid #4da9ff;

  padding: 12px;

  border-radius: 8px;

  margin-top: 10px;

}


/* ==========================================================
   期限表示
   ========================================================== */

.expire-normal {

  color: #087f23;

  font-weight: bold;

}


.expire-warning {

  color: #d87800;

  font-weight: bold;

}


.expire-danger {

  color: #d00000;

  font-weight: bold;

}


/* ==========================================================
   履歴
   ========================================================== */

#historyList {

  padding-left: 25px;

}


#historyList li {

  margin-bottom: 8px;

}


/* ==========================================================
   次講座
   ========================================================== */

.next-course {

  background: #fff9d6;

  border-left:
    5px solid #f5c400;

  padding: 15px;

  border-radius: 10px;

}


.next-course-id {

  font-size: 18px;

  font-weight: bold;

}


.next-course-name {

  font-size: 20px;

  font-weight: bold;

  margin-top: 5px;

}


/* ==========================================================
   動画・PDF
   ========================================================== */

.resource-area {

  margin-top: 20px;

}


.resource-url {

  width: 100%;

}


/* ==========================================================
   スマートフォン
   ========================================================== */

@media (
  max-width: 600px
) {

  body {

    padding: 10px;

  }


  .box {

    padding: 15px;

  }


  .btn {

    width: 100%;

    box-sizing: border-box;

  }


  iframe {

    max-width: 100%;

  }

}

</style>

</head>


<body>


<div class="container">


<!-- ========================================================
     会員情報
     ======================================================== -->

<div class="box">

  <h2>会員情報</h2>

  <p>
    会員番号：
    <span
      id="memberID"
      class="loading">
      読み込み中...
    </span>
  </p>


  <p>
    お名前：
    <span
      id="name"
      class="loading">
      読み込み中...
    </span>
  </p>


  <p>
    受講講座：
    <span
      id="courseName"
      class="loading">
      読み込み中...
    </span>
  </p>

</div>



<!-- ========================================================
     視聴期限
     ======================================================== -->

<div class="box">

  <h2>視聴期限</h2>


  <p>
    お申し込み日：
    <span
      id="createdAt"
      class="loading">
      読み込み中...
    </span>
  </p>


  <p>
    視聴期限：
    <span
      id="expireDate"
      class="loading">
      読み込み中...
    </span>
  </p>


  <p>
    残り日数：
    <span
      id="remainDays"
      class="loading">
      読み込み中...
    </span>
    日
  </p>


  <div
    id="expireStatus"
    class="info"
    style="display:none;">
  </div>

</div>



<!-- ========================================================
     動画プレイヤー
     ======================================================== -->

<div class="box">

  <h2>動画プレイヤー</h2>


  <button
    class="btn"
    id="playVideoBtn"
    disabled>

    視聴期限を確認中...

  </button>


  <div
    id="videoExpiredMessage"
    class="error"
    style="
      display:none;
      margin-top:20px;
    ">

    動画を再生できません
    （視聴期限切れ）

  </div>


  <div
    id="videoUrl"
    class="resource-area"
    style="display:none;">

  </div>

</div>



<!-- ========================================================
     PDFビューア
     ======================================================== -->

<div class="box">

  <h2>PDFビューア</h2>


  <button
    class="btn"
    id="viewPdfBtn"
    disabled>

    視聴期限を確認中...

  </button>


  <div
    id="pdfExpiredMessage"
    class="error"
    style="
      display:none;
      margin-top:20px;
    ">

    PDFを表示できません
    （表示期限切れ）

  </div>


  <div
    id="pdfUrl"
    class="resource-area"
    style="display:none;">

  </div>

</div>



<!-- ========================================================
     受講履歴
     ======================================================== -->

<div class="box">

  <h2>受講履歴</h2>


  <ul id="historyList">

    <li class="loading">
      読み込み中...
    </li>

  </ul>

</div>



<!-- ========================================================
     次のおすすめ講座
     ======================================================== -->

<div class="box">

  <h2>次のおすすめ講座</h2>


  <div
    id="nextCourseBox"
    class="next-course"
    style="display:none;">

    <div
      id="nextCourseId"
      class="next-course-id">
    </div>


    <div
      id="nextCourseName"
      class="next-course-name">
    </div>

  </div>


  <p
    id="nextCourseNone"
    class="loading">

    読み込み中...

  </p>

</div>



</div>


<script>


// ============================================================
// MAIN_GAS Web API
// ============================================================

const API_URL =
  "https://script.google.com/macros/s/AKfycbwMtxPxFSsIZHIvcO32sckIGnCuJP9vVeSJ6Op3LzmSlK-FeV7HvknE644VvC3TVDkV/exec";


// ============================================================
// 認証キー取得
//
// 対応方式
//
// ① mypage.html#key=xxxxxxxx
// ② mypage.html#authKey=xxxxxxxx
// ③ mypage.html?key=xxxxxxxx
// ④ mypage.html?authKey=xxxxxxxx
// ⑤ sessionStorage
//
// ============================================================


// ------------------------------------------------------------
// URL Query
// ------------------------------------------------------------

const searchParams =
  new URLSearchParams(
    window.location.search
  );


// ------------------------------------------------------------
// URL Hash
//
// #key=xxxx
// #authKey=xxxx
// ------------------------------------------------------------

const hashText =
  window.location.hash
    .replace(/^#/, "")
    .trim();


const hashParams =
  new URLSearchParams(
    hashText
  );


// ============================================================
// URLから認証キー取得
// ============================================================

let authKey =

  hashParams.get("key") ||

  hashParams.get("authKey") ||

  searchParams.get("key") ||

  searchParams.get("authKey") ||

  "";


// ============================================================
// 文字列化
// ============================================================

authKey =
  String(
    authKey || ""
  ).trim();


// ============================================================
// Console
//
// 認証キーそのものは表示しない。
// ============================================================

console.log(
  "mypage 認証キー取得：",
  authKey
    ? "URLから取得成功"
    : "URLには認証キーなし"
);


// ============================================================
// sessionStorageから復元
//
// 旧バージョン
//   mypage_authKey
//
// 新バージョン
//   authKey
//
// 両方に対応
// ============================================================

if (!authKey) {

  try {

    authKey =
      sessionStorage.getItem(
        "mypage_authKey"
      ) ||

      sessionStorage.getItem(
        "authKey"
      ) ||

      "";

  } catch (e) {

    console.warn(
      "sessionStorage取得失敗：",
      e
    );

  }

}


// ============================================================
// 文字列化
// ============================================================

authKey =
  String(
    authKey || ""
  ).trim();


// ============================================================
// 認証キーが取得できた場合
//
// 今後のために両方の保存名へ保存
// ============================================================

if (authKey) {

  try {

    sessionStorage.setItem(
      "mypage_authKey",
      authKey
    );


    sessionStorage.setItem(
      "authKey",
      authKey
    );

  } catch (e) {

    console.warn(
      "sessionStorage保存失敗：",
      e
    );

  }

}


// ============================================================
// 最終確認
// ============================================================

console.log(
  "mypage 認証キー最終確認：",
  authKey
    ? "認証キーあり"
    : "認証キーなし"
);


// ============================================================
// URLから認証キーを消す
//
// 重要：
// 認証キー取得・sessionStorage保存が完了してから実行する。
// ============================================================

if (authKey) {

  try {

    window.history.replaceState(
      {},
      document.title,
      window.location.pathname
    );

  } catch (e) {

    console.warn(
      "URL変更失敗：",
      e
    );

  }

}


// ============================================================
// 現在の教材情報
// ============================================================

let currentResources = {

  courseId: "",

  productId: "",

  courseName: "",

  videoUrl: "",

  pdfUrl: "",

  expireDays: 0

};


// ============================================================
// 視聴期限切れ
// ============================================================

let accessExpired =
  false;


// ============================================================
// 認証・期限確認完了
//
// falseの間は動画/PDFを実行しない。
// ============================================================

let accessStateReady =
  false;


// ============================================================
// API URL作成
//
// ★重要
//
// MAIN_GAS側が
//
// key
//
// を読む場合に対応。
//
// さらに
//
// authKey
//
// も送信する。
//
// これにより認証パラメータ名の違いによる
// 認証エラーを防止する。
//
// _ts はキャッシュ防止用。
// ============================================================

function buildApiUrl(
  params = {}
) {

  const query =
    new URLSearchParams();


  // ----------------------------------------------------------
  // MAIN_GAS 認証用
  // ----------------------------------------------------------

  query.set(
    "key",
    authKey
  );


  // ----------------------------------------------------------
  // MAIN_GASがauthKeyを読む場合にも対応
  // ----------------------------------------------------------

  query.set(
    "authKey",
    authKey
  );


  // ----------------------------------------------------------
  // キャッシュ防止
  // ----------------------------------------------------------

  query.set(
    "_ts",
    String(
      Date.now()
    )
  );


  // ----------------------------------------------------------
  // その他パラメータ
  // ----------------------------------------------------------

  Object.keys(params).forEach(
    function(key) {

      query.set(
        key,
        params[key]
      );

    }
  );


  return (
    API_URL +
    "?" +
    query.toString()
  );

}


// ============================================================
// ページ開始
// ============================================================

if (!authKey) {

  showAuthenticationError();

} else {


  console.log(
    "mypage API通信開始"
  );


  // ----------------------------------------------------------
  // ① 会員情報
  // ----------------------------------------------------------

  loadMemberInfo();


  // ----------------------------------------------------------
  // ② 受講講座
  // ----------------------------------------------------------

  loadResources();


  // ----------------------------------------------------------
  // ③ 受講履歴
  // ----------------------------------------------------------

  loadHistory();


  // ----------------------------------------------------------
  // ④ 次のおすすめ
  // ----------------------------------------------------------

  loadNextCourse();

}


// ============================================================
// 認証エラー
// ============================================================

function showAuthenticationError() {

  document.getElementById(
    "memberID"
  ).textContent =
    "認証情報がありません";


  document.getElementById(
    "memberID"
  ).className =
    "error";


  document.getElementById(
    "name"
  ).textContent =
    "登録完了メールのマイページリンクからアクセスしてください。";


  document.getElementById(
    "name"
  ).className =
    "error";


  document.getElementById(
    "courseName"
  ).textContent =
    "認証できません";


  document.getElementById(
    "courseName"
  ).className =
    "error";


  document.getElementById(
    "historyList"
  ).innerHTML =
    "<li class='error'>" +
    "認証情報がありません。" +
    "</li>";


  document.getElementById(
    "nextCourseNone"
  ).textContent =
    "認証情報がありません";


  // ----------------------------------------------------------
  // 認証できない場合は教材ボタンを停止
  // ----------------------------------------------------------

  document.getElementById(
    "playVideoBtn"
  ).disabled =
    true;


  document.getElementById(
    "viewPdfBtn"
  ).disabled =
    true;

}


// ============================================================
// ① 会員情報取得
// ============================================================

function loadMemberInfo() {

  const url =
    buildApiUrl();


  console.log(
    "MAIN_GAS 会員情報URL：",
    "認証キー送信済み"
  );


  fetch(
    url,
    {
      cache:
        "no-store"
    }
  )

    .then(
      async function(res) {

        const text =
          await res.text();


        console.log(
          "MAIN_GAS 会員情報 response:",
          text
        );


        let json;


        try {

          json =
            JSON.parse(
              text
            );

        } catch (e) {

          throw new Error(
            "MAIN_GASからJSONではないデータが返りました。\n" +
            text.substring(
              0,
              300
            )
          );

        }


        if (!res.ok) {

          throw new Error(
            "HTTPエラー: " +
            res.status
          );

        }


        return json;

      }
    )


    .then(
      function(json) {


        console.log(
          "MAIN_GAS 認証結果：",
          json.authenticated
        );


        // ====================================================
        // 認証失敗
        // ====================================================

        if (
          json.authenticated === false ||
          json.valid === false ||
          json.success === false
        ) {

          throw new Error(
            json.error ||
            "認証に失敗しました。"
          );

        }


        // ====================================================
        // 会員番号
        // ====================================================

        document.getElementById(
          "memberID"
        ).textContent =

          json.memberID ||

          json.memberId ||

          "登録情報なし";


        document.getElementById(
          "memberID"
        ).className =
          "";


        // ====================================================
        // 氏名
        // ====================================================

        document.getElementById(
          "name"
        ).textContent =

          json.name ||

          "登録情報なし";


        document.getElementById(
          "name"
        ).className =
          "";


        // ====================================================
        // 現在講座
        // ====================================================

        const currentCourseText =

          json.courseId &&
          json.courseName

            ? json.courseId +
              " " +
              json.courseName

            : (

                json.courseName ||

                json.courseId ||

                "講座情報なし"

              );


        document.getElementById(
          "courseName"
        ).textContent =
          currentCourseText;


        document.getElementById(
          "courseName"
        ).className =
          "";


        // ====================================================
        // 申し込み日
        // ====================================================

        if (
          json.createdAt
        ) {

          const createdDate =
            new Date(
              json.createdAt
            );


          if (
            !isNaN(
              createdDate.getTime()
            )
          ) {

            document.getElementById(
              "createdAt"
            ).textContent =
              formatDate(
                createdDate
              );

          } else {

            document.getElementById(
              "createdAt"
            ).textContent =
              json.createdAt;

          }

        } else {

          document.getElementById(
            "createdAt"
          ).textContent =
            "登録情報なし";

        }


        // ====================================================
        // 視聴期限
        //
        // MAIN_GASのexpireDateを最優先。
        // ====================================================

        let expireDate =
          null;


        if (
          json.expireDate
        ) {

          expireDate =
            new Date(
              json.expireDate
            );

        }


        // ====================================================
        // expireDateがない場合だけ予備計算
        // ====================================================

        if (
          !expireDate ||
          isNaN(
            expireDate.getTime()
          )
        ) {

          if (
            json.createdAt &&
            (
              json.expireDays !== undefined ||
              json.expire_days !== undefined
            )
          ) {

            const expireDays =
              Number(
                json.expireDays !== undefined
                  ? json.expireDays
                  : json.expire_days
              );


            const createdDate =
              new Date(
                json.createdAt
              );


            if (
              !isNaN(
                createdDate.getTime()
              ) &&
              Number.isFinite(
                expireDays
              )
            ) {

              expireDate =
                addDays(
                  createdDate,
                  expireDays
                );

            }

          }

        }


        // ====================================================
        // 視聴期限表示
        // ====================================================

        if (
          expireDate &&
          !isNaN(
            expireDate.getTime()
          )
        ) {

          document.getElementById(
            "expireDate"
          ).textContent =
            formatDate(
              expireDate
            );


          // --------------------------------------------------
          // MAIN_GASのremainDaysを優先
          // --------------------------------------------------

          let remainDays;


          if (
            json.remainDays !== undefined &&
            json.remainDays !== null
          ) {

            remainDays =
              Number(
                json.remainDays
              );

          } else {

            remainDays =
              calculateRemainDays(
                expireDate
              );

          }


          if (
            !Number.isFinite(
              remainDays
            )
          ) {

            remainDays =
              0;

          }


          remainDays =
            Math.max(
              0,
              remainDays
            );


          document.getElementById(
            "remainDays"
          ).textContent =
            remainDays;


          // --------------------------------------------------
          // 期限切れ判定
          // --------------------------------------------------

          const today =
            startOfDay(
              new Date()
            );


          const expireDay =
            startOfDay(
              expireDate
            );


          accessExpired =
            today >=
            expireDay;


          // --------------------------------------------------
          // 認証・期限確認完了
          // --------------------------------------------------

          accessStateReady =
            true;


          // --------------------------------------------------
          // 期限表示
          // --------------------------------------------------

          updateExpireStatus(
            remainDays,
            accessExpired
          );


          // --------------------------------------------------
          // 教材表示
          // --------------------------------------------------

          if (
            accessExpired
          ) {

            setExpiredResourceUI();

          } else {

            setActiveResourceUI();

          }

        } else {

          document.getElementById(
            "expireDate"
          ).textContent =
            "日付エラー";


          document.getElementById(
            "remainDays"
          ).textContent =
            "-";


          accessExpired =
            true;


          accessStateReady =
            true;


          setExpiredResourceUI();

        }

      }
    )


    .catch(
      function(error) {

        console.error(
          "会員情報取得エラー:",
          error
        );


        // ------------------------------------------------------
        // 認証失敗時は教材アクセス停止
        // ------------------------------------------------------

        accessStateReady =
          true;

        accessExpired =
          true;


        setExpiredResourceUI();


        document.getElementById(
          "name"
        ).textContent =
          "認証エラー";


        document.getElementById(
          "name"
        ).className =
          "error";


        document.getElementById(
          "courseName"
        ).textContent =
          "マイページを開く権限を確認できません。";


        document.getElementById(
          "courseName"
        ).className =
          "error";

      }
    );

}


// ============================================================
// ② 受講講座・教材情報
// ============================================================

function loadResources() {

  const url =
    buildApiUrl({

      getResources:
        "1"

    });


  fetch(
    url,
    {
      cache:
        "no-store"
    }
  )

    .then(
      async function(res) {

        const text =
          await res.text();


        console.log(
          "MAIN_GAS getResources response:",
          text
        );


        let json;


        try {

          json =
            JSON.parse(
              text
            );

        } catch (e) {

          throw new Error(
            "MAIN_GASから受講講座のJSONを取得できませんでした。"
          );

        }


        if (
          !res.ok ||
          json.success === false ||
          json.authenticated === false ||
          json.valid === false
        ) {

          throw new Error(
            json.error ||
            "受講講座取得エラー"
          );

        }


        return json;

      }
    )


    .then(
      function(json) {


        // ====================================================
        // 教材情報保存
        // ====================================================

        currentResources = {

          courseId:
            json.courseId ||
            "",

          productId:
            json.productId ||
            "",

          courseName:
            json.courseName ||
            "",

          videoUrl:
            json.videoUrl ||
            "",

          pdfUrl:
            json.pdfUrl ||
            "",

          expireDays:
            Number(
              json.expireDays ||
              0
            )

        };


        // ====================================================
        // 講座名
        //
        // ★ここではMAIN_GASの正しいcourseNameを使用。
        //
        // SC08 + KP
        // ↓
        // Scratch動画＋PDF
        // ====================================================

        if (
          json.courseId ||
          json.courseName
        ) {

          const resourceCourseText =

            json.courseId &&
            json.courseName

              ? json.courseId +
                " " +
                json.courseName

              : (

                  json.courseName ||

                  json.courseId ||

                  "受講講座なし"

                );


          document.getElementById(
            "courseName"
          ).textContent =
            resourceCourseText;


          document.getElementById(
            "courseName"
          ).className =
            "";

        }


        // ====================================================
        // MAIN_GASからexpireDateが返った場合
        // ====================================================

        if (
          json.expireDate
        ) {

          const expireDate =
            new Date(
              json.expireDate
            );


          if (
            !isNaN(
              expireDate.getTime()
            )
          ) {

            document.getElementById(
              "expireDate"
            ).textContent =
              formatDate(
                expireDate
              );


            if (
              json.remainDays !== undefined &&
              json.remainDays !== null
            ) {

              const remainDays =
                Math.max(
                  0,
                  Number(
                    json.remainDays
                  )
                );


              document.getElementById(
                "remainDays"
              ).textContent =
                remainDays;


              const today =
                startOfDay(
                  new Date()
                );


              const expireDay =
                startOfDay(
                  expireDate
                );


              accessExpired =
                today >=
                expireDay;


              accessStateReady =
                true;


              updateExpireStatus(
                remainDays,
                accessExpired
              );

            }

          }

        }


        // ====================================================
        // 教材表示状態
        // ====================================================

        if (
          accessExpired
        ) {

          currentResources.videoUrl =
            "";

          currentResources.pdfUrl =
            "";

          setExpiredResourceUI();

        }

        else if (
          accessStateReady
        ) {

          setActiveResourceUI();

        }

      }
    )


    .catch(
      function(error) {

        console.error(
          "受講講座取得エラー:",
          error
        );


        currentResources = {

          courseId: "",

          productId: "",

          courseName: "",

          videoUrl: "",

          pdfUrl: "",

          expireDays: 0

        };


        const courseElement =
          document.getElementById(
            "courseName"
          );


        if (
          courseElement.textContent ===
          "読み込み中..."
        ) {

          courseElement.textContent =
            "取得エラー";


          courseElement.className =
            "error";

        }

      }
    );

}

  )

          "MAIN_GAS getHistory response:",
          text
        );


        let json;


        try {

          json =
            JSON.parse(
              text
            );

        } catch (e) {

          throw new Error(
            "MAIN_GASから履歴のJSONを取得できませんでした。\n" +
            text.substring(
              0,
              300
            )
          );

        }


        if (!res.ok) {

          throw new Error(
            json.error ||
            "HTTPエラー: " +
            res.status
          );

        }


        if (
          json.success === false ||
          json.authenticated === false ||
          json.valid === false
        ) {

          throw new Error(
            json.error ||
            "受講履歴を取得できませんでした。"
          );

        }


        return json;

      }
    )


    .then(
      function(json) {


        const ul =
          document.getElementById(
            "historyList"
          );


        ul.innerHTML =
          "";


        // ====================================================
        // 配列
        // ====================================================

        let list =
          [];


        if (
          Array.isArray(
            json
          )
        ) {

          list =
            json;

        }


        // ====================================================
        // {history:[...]}
        // ====================================================

        else if (
          json &&
          Array.isArray(
            json.history
          )
        ) {

          list =
            json.history;

        }


        // ====================================================
        // {data:[...]}
        // ====================================================

        else if (
          json &&
          Array.isArray(
            json.data
          )
        ) {

          list =
            json.data;

        }


        // ====================================================
        // 履歴なし
        // ====================================================

        if (
          list.length === 0
        ) {

          const li =
            document.createElement(
              "li"
            );


          li.textContent =
            "受講履歴はありません";


          ul.appendChild(
            li
          );


          return;

        }


        // ====================================================
        // 履歴表示
        // ====================================================

        list.forEach(
          function(item) {


            const li =
              document.createElement(
                "li"
              );


            // ------------------------------------------------
            // 日付
            // ------------------------------------------------

            let dateStr =
              "";


            if (
              item.createdAt
            ) {

              const d =
                new Date(
                  item.createdAt
                );


              if (
                !isNaN(
                  d.getTime()
                )
              ) {

                dateStr =
                  formatDate(
                    d
                  );

              } else {

                dateStr =
                  item.createdAt;

              }

            }


            // ------------------------------------------------
            // 講座名
            //
            // MAIN_GAS
            // ↓
            // courseId + productId
            // ↓
            // master
            // ↓
            // 正しいcourseName
            // ------------------------------------------------

            const courseText =

              item.courseId &&
              item.courseName

                ? item.courseId +
                  " " +
                  item.courseName

                : (

                    item.courseName ||

                    item.courseId ||

                    "講座情報なし"

                  );


            // ------------------------------------------------
            // 会員種別
            // ------------------------------------------------

            let typeText =
              "";


            if (
              item.memberType ===
              "paid"
            ) {

              typeText =
                "（受講）";

            }

            else if (
              item.memberType ===
              "trial"
            ) {

              typeText =
                "（無料体験）";

            }


            // ------------------------------------------------
            // 表示
            // ------------------------------------------------

            li.textContent =

              dateStr +
              "：" +
              courseText +
              typeText;


            ul.appendChild(
              li
            );

          }
        );

      }
    )


    .catch(
      function(error) {

        console.error(
          "受講履歴取得エラー:",
          error
        );


        document.getElementById(
          "historyList"
        ).innerHTML =

          "<li class='error'>" +

          "受講履歴を取得できませんでした" +

          "<br>" +

          "<small>" +

          escapeHtml(
            error.message
          ) +

          "</small>" +

          "</li>";

      }
    );

}

// ============================================================
// YouTube URL → iframe URL
// ============================================================

function toYouTubeEmbedUrl(
  url
) {

  const value =
    String(
      url || ""
    ).trim();


  // ----------------------------------------------------------
  // すでにembed
  // ----------------------------------------------------------

  if (
    value.includes(
      "youtube.com/embed/"
    )
  ) {

    return value;

  }


  // ----------------------------------------------------------
  // watch?v=
  // ----------------------------------------------------------

  const match =
    value.match(
      /[?&]v=([^&]+)/
    );


  if (match) {

    return (
      "https://www.youtube.com/embed/" +
      encodeURIComponent(
        match[1]
      )
    );

  }


  // ----------------------------------------------------------
  // youtu.be
  // ----------------------------------------------------------

  const shortMatch =
    value.match(
      /youtu\.be\/([^?&]+)/
    );


  if (shortMatch) {

    return (
      "https://www.youtube.com/embed/" +
      encodeURIComponent(
        shortMatch[1]
      )
    );

  }


  return value;

}

// ============================================================
// ⑨ 期限表示
// ============================================================

function updateExpireStatus(
  remainDays,
  expired
) {

  const element =
    document.getElementById(
      "expireStatus"
    );


  if (!element) {

    return;

  }


  element.style.display =
    "block";


  element.className =
    "info";


  if (expired) {

    element.className =
      "info expire-danger";


    element.textContent =
      "視聴期限が終了しています。";

    return;

  }


  if (
    remainDays <= 1
  ) {

    element.className =
      "info expire-danger";


    element.textContent =
      "視聴期限がまもなく終了します。";

    return;

  }


  if (
    remainDays <= 3
  ) {

    element.className =
      "info expire-warning";


    element.textContent =
      "視聴期限の残り日数をご確認ください。";

    return;

  }


  element.className =
    "info expire-normal";


  element.textContent =
    "現在、教材を視聴できます。";

}


// ============================================================
// ⑩ 日付開始
// ============================================================

function startOfDay(
  date
) {

  const d =
    new Date(
      date
    );


  d.setHours(
    0,
    0,
    0,
    0
  );


  return d;

}


// ============================================================
// ⑪ 日付加算
// ============================================================

function addDays(
  date,
  days
) {

  const d =
    new Date(
      date
    );


  d.setDate(
    d.getDate() +
    Number(
      days
    )
  );


  return d;

}


// ============================================================
// ⑫ 残り日数
// ============================================================

function calculateRemainDays(
  expireDate
) {

  const today =
    startOfDay(
      new Date()
    );


  const expireDay =
    startOfDay(
      expireDate
    );


  return Math.ceil(

    (
      expireDay -
      today
    ) /

    (
      1000 *
      60 *
      60 *
      24
    )

  );

}


// ============================================================
// ⑬ 視聴期限切れ再確認
// ============================================================

function isAccessExpired() {

  // ----------------------------------------------------------
  // 認証・期限確認前は安全側に倒す
  // ----------------------------------------------------------

  if (
    !accessStateReady
  ) {

    return true;

  }


  return accessExpired;

}


// ============================================================
// ⑭ 日付表示
// ============================================================

function formatDate(
  date
) {

  return (

    date.getFullYear() +
    "年" +

    (
      date.getMonth() +
      1
    ) +
    "月" +

    date.getDate() +
    "日"

  );

}


// ============================================================
// ⑮ HTMLエスケープ
// ============================================================

function escapeHtml(
  value
) {

  return String(
    value || ""
  )

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


// ============================================================
// ⑯ HTML属性エスケープ
// ============================================================

function escapeHtmlAttribute(
  value
) {

  return String(
    value || ""
  )

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    );

}
